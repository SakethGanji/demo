openapi: 3.0.3
info:
  title: Risk API
  version: "1.0"
servers:
  - url: http://127.0.0.1:9999
paths:
  /risk-check:
    post:
      operationId: riskCheck
      summary: Score an order for refund risk
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order_id, amount]
              properties:
                order_id:
                  type: string
                amount:
                  type: number
      responses:
        "200":
          description: The decision
          content:
            application/json:
              schema:
                type: object
                required: [decision, score]
                properties:
                  decision:
                    type: string
                    enum: [approve, review, deny]
                  score:
                    type: number
                    minimum: 0
                    maximum: 100
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
        "404":
          description: Order not found
        "500":
          description: Risk service unavailable
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /orders/{order_id}:
    get:
      summary: Fetch one order
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The order
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  placed_at:
                    type: string
                    format: date-time
                  total:
                    type: number
