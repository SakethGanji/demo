openapi: 3.0.3
info:
  title: ledger
  version: '1.0'
servers:
- url: http://ledger.bank.test
paths:
  /entries/search:
    post:
      operationId: list
      summary: Ledger entries for a date
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                date:
                  type: string
              required:
              - date
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      type: object
                      properties:
                        ref:
                          type: string
                        amount:
                          type: number
                      required:
                      - ref
                      - amount
                required:
                - entries
        '400':
          description: Bad date
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
