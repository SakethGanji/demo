openapi: 3.0.3
info:
  title: sms
  version: '1.0'
servers:
- url: http://sms.bank.test
paths:
  /sms:
    post:
      operationId: send
      summary: Text a customer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  sent:
                    type: boolean
                required:
                - sent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                to:
                  type: string
                text:
                  type: string
              required:
              - to
              - text
