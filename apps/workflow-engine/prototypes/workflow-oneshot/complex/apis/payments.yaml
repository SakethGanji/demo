openapi: 3.0.3
info:
  title: payments
  version: '1.0'
servers:
- url: http://payments.bank.test
paths:
  /payments/{payment_id}/hold:
    post:
      operationId: hold
      summary: Hold a payment
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  payment_id:
                    type: string
                  status:
                    type: string
                required:
                - payment_id
                - status
      parameters:
      - name: payment_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
              required:
              - reason
  /payments/{payment_id}/release:
    post:
      operationId: release
      summary: Release a payment for sending
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  payment_id:
                    type: string
                  status:
                    type: string
                required:
                - payment_id
                - status
      parameters:
      - name: payment_id
        in: path
        required: true
        schema:
          type: string
