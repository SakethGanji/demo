openapi: 3.0.3
info:
  title: accounts
  version: '1.0'
servers:
- url: http://accounts.bank.test
paths:
  /business-accounts:
    post:
      operationId: openBusiness
      summary: Open a business account
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  account_number:
                    type: string
                required:
                - account_number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                company_name:
                  type: string
                registration_number:
                  type: string
              required:
              - company_name
              - registration_number
