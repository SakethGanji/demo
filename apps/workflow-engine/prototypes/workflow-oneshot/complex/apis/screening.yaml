openapi: 3.0.3
info:
  title: screening
  version: '1.0'
servers:
- url: http://screening.bank.test
paths:
  /screen:
    post:
      operationId: screen
      summary: Screen a person or company name against sanctions lists
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  hit:
                    type: boolean
                  list:
                    type: string
                required:
                - hit
                - list
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                country:
                  type: string
              required:
              - name
              - country
