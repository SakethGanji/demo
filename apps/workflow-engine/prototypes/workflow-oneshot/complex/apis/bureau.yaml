openapi: 3.0.3
info:
  title: bureau
  version: '1.0'
servers:
- url: http://bureau.bank.test
paths:
  /credit-checks:
    post:
      operationId: creditScore
      summary: Credit score of an applicant
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  applicant_id:
                    type: string
                  score:
                    type: integer
                required:
                - applicant_id
                - score
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                applicant_id:
                  type: string
              required:
              - applicant_id
