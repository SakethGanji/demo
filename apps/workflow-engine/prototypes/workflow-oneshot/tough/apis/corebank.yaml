openapi: 3.0.3
info:
  title: corebank
  version: '1.0'
servers:
- url: http://corebank.bank.test
paths:
  /accounts/{account_id}/fee-refunds:
    post:
      operationId: refundFee
      summary: Refund a fee to an account
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  refund_id:
                    type: string
                required:
                - refund_id
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: number
              required:
              - amount
  /accounts/{account_id}/close:
    post:
      operationId: closeAccount
      summary: Close an account
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  account_id:
                    type: string
                  status:
                    type: string
                required:
                - account_id
                - status
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          type: string
