openapi: 3.0.3
info:
  title: collections
  version: '1.0'
servers:
- url: http://collections.bank.test
paths:
  /collection-cases:
    post:
      operationId: openCase
      summary: Hand a loan to the collections agency
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  case_id:
                    type: string
                required:
                - case_id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                loan_id:
                  type: string
                outstanding:
                  type: number
              required:
              - loan_id
              - outstanding
