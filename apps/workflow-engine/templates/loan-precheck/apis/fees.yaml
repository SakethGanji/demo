openapi: 3.0.3
info:
  title: fees
  version: '1.0'
servers:
- url: http://fees.bank.example
paths:
  /fees/waive:
    post:
      operationId: waive
      summary: Waive a fee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                account_id:
                  type: string
                fee_id:
                  type: string
                reason:
                  type: string
              required:
              - account_id
              - fee_id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  waiver_id:
                    type: string
                  status:
                    type: string
                required:
                - waiver_id
                - status
        '409':
          description: Fee already waived
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
  /fees/quote:
    post:
      operationId: quote
      summary: Quote the origination fee and rate of a loan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: number
                term_months:
                  type: integer
              required:
              - amount
              - term_months
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  origination_fee:
                    type: number
                  apr:
                    type: number
                required:
                - origination_fee
                - apr
        '422':
          description: Quote refused
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
