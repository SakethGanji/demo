openapi: 3.0.3
info:
  title: sanctions
  version: '1.0'
servers:
- url: http://sanctions.bank.example
paths:
  /screen:
    post:
      operationId: screen
      summary: Screen a party against the sanctions lists
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                country:
                  type: string
              required:
              - name
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  match:
                    type: boolean
                  list_name:
                    type: string
                    nullable: true
                required:
                - match
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
