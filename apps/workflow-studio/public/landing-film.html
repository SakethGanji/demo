      box-shadow: inset 0 0 0 .5px color-mix(in srgb, var(--kc) 32%, transparent), inset 0 1px 0 var(--hi-line); }
    .s-connect .cn-tile .g svg { width: 17px; height: 17px; }
    .s-connect .cn-tile .n { font-size: 13px; font-weight: 650; letter-spacing: -0.005em; color: var(--fg); }
    .s-connect .cn-tile .n svg { width: 11px; height: 11px; margin-left: 4px; vertical-align: -1px; color: var(--faint); }
    .s-connect .cn-tile.bk { background: color-mix(in srgb, var(--node-bg) 58%, transparent); box-shadow: inset 0 0 0 .5px var(--node-ring); }
    .s-connect .cn-tile.on { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--primary) 60%, transparent), inset 0 1px 0 var(--hi-line), 0 0 0 4px var(--brand-soft), 0 14px 30px -12px var(--primary); }
    .s-connect .cn-port { position: absolute; right: -4px; top: 50%; width: 8px; height: 8px; margin-top: -4px; border-radius: 50%; background: var(--primary);
      box-shadow: 0 0 0 2px var(--node-bg), 0 0 10px 1px color-mix(in srgb, var(--primary) 60%, transparent); opacity: 0; }
    .s-connect .k-i.cn-fill { fill: currentColor; stroke: none; }
    .s-connect .cn-tile .g text, .s-connect .cn-card .g text { font-family: var(--font); font-weight: 800; }

    .s-connect .cn-pulse { position: absolute; z-index: 54; left: 0; top: 0; }

    /* the two detail cards */
    .s-connect .cn-cards { position: absolute; inset: 0; z-index: 100; }
    .s-connect .cn-card { position: absolute; width: 440px; padding: 16px 18px 16px; }
    .s-connect .cn-ch { display: flex; align-items: center; gap: 10px; }
    .s-connect .cn-ch .g { display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 9px; color: var(--kc);
      background: linear-gradient(180deg, color-mix(in srgb, var(--kc) 19%, transparent), color-mix(in srgb, var(--kc) 10%, transparent));
      box-shadow: inset 0 0 0 .5px color-mix(in srgb, var(--kc) 32%, transparent), inset 0 1px 0 var(--hi-line); }
    .s-connect .cn-ch .g svg { width: 19px; height: 19px; }
    .s-connect .cn-ch .nm { font-size: 13.5px; font-weight: 700; color: var(--fg); line-height: 1.2; }
    .s-connect .cn-ch .sb { font-size: 12px; color: var(--muted); line-height: 1.25; }
    .s-connect .cn-ch .sb b { font-family: var(--mono); font-weight: 600; font-size: 11.5px; color: var(--fg); }
    .s-connect .cn-ch .rt { margin-left: auto; }
    .s-connect .cn-ttl { margin-top: 12px; font-size: 16px; font-weight: 680; letter-spacing: -0.012em; line-height: 1.3; color: var(--fg); }
    .s-connect .cn-desc { margin-top: 4px; font-size: 12.5px; line-height: 1.45; color: var(--muted); }
    .s-connect .cn-fields { margin-top: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 1px; overflow: hidden; }
    .s-connect .cn-f { display: flex; flex-direction: column; gap: 4px; padding: 9px 12px; }
    .s-connect .cn-f .k-label { font-size: 11px; }
    .s-connect .cn-f .v { display: flex; align-items: center; gap: 7px; height: 24px; font-size: 13px; font-weight: 600; color: var(--fg); }
    .s-connect .cn-f .v .k-av { width: 22px; height: 22px; font-size: 10px; }
    .s-connect .cn-f .v .mono { font-family: var(--mono); font-size: 12px; }
    .s-connect .cn-f .v svg { width: 14px; height: 14px; color: var(--warn); }
    .s-connect .cn-f + .cn-f:nth-child(2), .s-connect .cn-f:nth-child(4) { box-shadow: inset 1px 0 0 var(--hairline); }
    .s-connect .cn-f:nth-child(3), .s-connect .cn-f:nth-child(4) { border-top: 1px solid var(--hairline); }

    .s-connect .cn-msg { margin-top: 12px; display: grid; grid-template-columns: 32px 1fr; column-gap: 10px; padding: 12px 14px; }
    .s-connect .cn-bot { display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 9px; color: var(--primary-fg);
      background: linear-gradient(135deg, var(--brand-1), var(--brand-2)); box-shadow: inset 0 1px 0 rgb(255 255 255 / .35), 0 6px 14px -8px var(--primary); }
    .s-connect .cn-bot svg { width: 17px; height: 17px; }
    .s-connect .cn-who { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 700; color: var(--fg); line-height: 1.2; }
    .s-connect .cn-who .k-meta { font-size: 11.5px; font-weight: 500; }
    .s-connect .cn-txt { margin-top: 4px; font-size: 13px; line-height: 1.5; color: var(--fg); }
    .s-connect .cn-txt b { font-weight: 650; }
    .s-connect .cn-txt .mu { color: var(--muted); }
    .s-connect .cn-act { margin-top: 10px; display: flex; align-items: center; gap: 8px; }
    .s-connect .cn-act .k-tok { color: var(--primary); background: var(--brand-soft); }
    .s-connect .cn-act .k-btn { margin-left: auto; }
  `,
  build(area, kit) {
    const { h, html, icon } = kit
    const NS = 'http://www.w3.org/2000/svg'
    const W = 1472, H = 630
    const G = { x: 472, y: 330, r: 246 }          // the globe in area px
    const svg = (cls) => { const s = document.createElementNS(NS, 'svg'); s.setAttribute('class', 'cn-layer ' + cls); s.setAttribute('viewBox', `0 0 ${W} ${H}`); return s }
    const path = (parent, cls) => { const p = document.createElementNS(NS, 'path'); if (cls) p.setAttribute('class', cls); parent.appendChild(p); return p }

    /* glyphs: simple monochrome / two-tone marks in the palette (not brand artwork) */
    const NB = 'var(--node-bg)'
    const letterTile = (L, extra) => `<rect x="2" y="5.5" width="13" height="13" rx="3" fill="currentColor" stroke="none"/><text x="8.5" y="15.6" text-anchor="middle" font-size="9.5" fill="${NB}" stroke="none">${L}</text>${extra}`
    const GL = {
      jira: '<path d="M12 2.2 21.8 12 12 21.8 2.2 12Z" fill="currentColor" fill-opacity=".2" stroke="none"/><path d="M12 6.6 17.4 12 12 17.4 6.6 12Z" fill="currentColor" stroke="none"/>',
      github: '<path d="M5.5 10V3.8l3.6 2.7a8.4 8.4 0 0 1 5.8 0l3.6-2.7V10a6.8 6.8 0 0 1 .3 2A6.8 6.8 0 0 1 12 18.8 6.8 6.8 0 0 1 5.2 12a6.8 6.8 0 0 1 .3-2Z"/><path d="M9 21.3c-2.4-.2-3.6-1.4-4.6-3"/>',
      teams: letterTile('T', '<circle cx="18.6" cy="6.6" r="2.4"/><path d="M17.5 10.8h3a1.5 1.5 0 0 1 1.5 1.5v3.2a3.3 3.3 0 0 1-5 2.8"/>'),
      outlook: '<rect x="9" y="5" width="13" height="14" rx="2.2"/><path d="m9.6 7.6 5.9 4.4 5.9-4.4"/>' + `<rect x="2" y="6.5" width="11" height="11" rx="2.6" fill="currentColor" stroke="none"/><circle cx="7.5" cy="12" r="2.6" stroke="${NB}" stroke-width="1.9" fill="none"/>`,
      sharepoint: letterTile('S', '<circle cx="16.5" cy="8.5" r="4.8"/><circle cx="17.8" cy="16.2" r="3.6"/>'),
      slack: '<path d="M9 3.2v7.6M15 13.2v7.6M3.2 15h7.6M13.2 9h7.6" stroke-width="3.2"/>',
      confluence: '<path d="M3.5 17.2c2.6-3.6 5.6-4.9 9.2-3.5l6.6 2.6"/><path d="M20.5 6.8c-2.6 3.6-5.6 4.9-9.2 3.5L4.7 7.7"/>',
      servicenow: '<circle cx="12" cy="12" r="8.6"/><path d="M8 17.2a5 5 0 0 1 8 0" fill="currentColor" stroke="none"/><circle cx="12" cy="11.6" r="3.6" fill="currentColor" stroke="none"/>',
      mongo: '<path d="M12 2.5c3.6 3.6 5.2 7.1 5.2 10.6 0 3.6-2.3 6.1-5.2 7.6-2.9-1.5-5.2-4-5.2-7.6 0-3.5 1.6-7 5.2-10.6Z" fill="currentColor" fill-opacity=".18"/><path d="M12 6v15.6"/>',
      python: '<path d="M12 3H9.2a3 3 0 0 0-3 3v3H12M12 21h2.8a3 3 0 0 0 3-3v-3H12"/><path d="M6.2 9H5a2.5 2.5 0 0 0-2.5 2.5v1A2.5 2.5 0 0 0 5 15h7M17.8 15H19a2.5 2.5 0 0 0 2.5-2.5v-1A2.5 2.5 0 0 0 19 9h-7"/><circle cx="9.4" cy="5.7" r=".9" fill="currentColor" stroke="none"/><circle cx="14.6" cy="18.3" r=".9" fill="currentColor" stroke="none"/>',
    }
    const glyph = (name, size) => {
      if (!GL[name]) return icon(name, size)
      return html(`<svg class="k-i" viewBox="0 0 24 24" width="${size}" height="${size}" aria-hidden="true">${GL[name]}</svg>`)
    }

    /* the seventeen integrations, spread evenly over the sphere on three loose bands (lat, lon in degrees).
       Placed by a small solver (tools/g2): the middle band dips just below the core and leaves a gap where it would
       cross in front of the Engine, so no tile ever passes over the gear or its label; front tiles never overlap at rest. */
    const C = { work: 'var(--k-out)', ind: 'var(--k-flow)', data: 'var(--k-data)', trig: 'var(--k-trigger)', code: 'var(--k-code)', person: 'var(--k-person)', fg: 'var(--muted)' }
    const SYS = [
      // band A · high
      ['Jira', 'jira', C.work, 48, 20],
      ['Confluence', 'confluence', C.work, 56, 118],
      ['Webhooks', 'webhook', C.trig, 49, 195],
      ['Schedules', 'clock', C.trig, 44, 260],
      ['GitHub', 'github', C.fg, 34, 322],
      // band B · around the equator (REST APIs sits up, on the back)
      ['Postgres', 'database', C.data, -3, 50],
      ['Slack', 'slack', C.ind, -6, 121],
      ['MongoDB', 'mongo', C.data, -6, 170],
      ['Forms', 'form', C.person, 4, 227],
      ['Outlook', 'outlook', C.work, 1, 283],
      ['REST APIs', 'braces', C.code, 21, 76],
      // band C · low
      ['Microsoft Teams', 'teams', C.ind, -39, 347],
      ['ServiceNow', 'servicenow', C.data, -41, 52],
      ['Neo4j', 'graph', C.data, -52, 173],
      ['Email', 'mail', C.work, -46, 107],
      ['Python', 'python', C.code, -37, 231],
      ['SharePoint', 'sharepoint', C.work, -38, 288],
    ]
    const back = svg('cn-back'), front = svg('cn-front'), spokes = svg('cn-spokes'), links = svg('cn-links')
    // lattice strokes: radial gradients in the layer's own px, centred on the globe (front fades to the limb, back rises toward it)
    const grad = (parent, id, stops) => { const d = document.createElementNS(NS, 'defs')
      d.innerHTML = `<radialGradient id="${id}" gradientUnits="userSpaceOnUse" cx="${G.x - 30}" cy="${G.y - 40}" r="${G.r * 1.08}">` +
        stops.map(([o, a]) => `<stop offset="${o}" class="cn-ls" stop-opacity="${a}"/>`).join('') + '</radialGradient>'
      parent.appendChild(d) }
    grad(front, 'cn-lg-f', [[0, 0.46], [0.55, 0.34], [0.86, 0.16], [1, 0.07]])
    grad(back, 'cn-lg-b', [[0, 0.1], [0.7, 0.14], [1, 0.22]])
    const latB = path(back, 'cn-lat'), latF = path(front, 'cn-lat'), eqB = path(back, 'cn-lat eq'), eqF = path(front, 'cn-lat eq')

    const globe = h('div.cn-globe')
    // the perspective silhouette of the sphere is a touch larger than r (the lattice meets it exactly)
    const SR = G.r / Math.sqrt(1 - Math.pow(G.r / 2100, 2))
    const disc = (cls, pad = 0) => h(cls, { style: { left: G.x - SR - pad + 'px', top: G.y - SR - pad + 'px', width: 2 * (SR + pad) + 'px', height: 2 * (SR + pad) + 'px' } })
    const floor = h('div.cn-floor', { style: { left: G.x - G.r * 0.86 + 'px', top: G.y + G.r * 0.8 + 'px', width: G.r * 1.72 + 'px', height: G.r * 0.4 + 'px' } })
    const sphere = disc('div.cn-sphere')
    const fres = disc('div.cn-fres')
    const glint = h('span.cn-glint', { style: { left: G.x - SR * 0.38 + 'px', top: G.y - SR * 0.6 + 'px' } })
    const halo = disc('span.k-halo.cn-halo', 1.5); halo.appendChild(h('span'))

    // the engine core: a glass gear (12 teeth) in a glass bead, turning only while the scene plays
    const gearSvg = (() => {
      const R = 33, r = 27.5, n = 12, pts = []
      for (let i = 0; i < n; i++) {
        const a0 = (i / n) * Math.PI * 2, st = (Math.PI * 2) / n
        pts.push([r, a0], [r, a0 + st * 0.12], [R, a0 + st * 0.27], [R, a0 + st * 0.58], [r, a0 + st * 0.73])
      }
      const hole = 'M41 33 A8 8 0 1 0 25 33 A8 8 0 1 0 41 33 Z'
      const d = pts.map(([rad, a], i) => `${i ? 'L' : 'M'}${(33 + rad * Math.cos(a)).toFixed(1)} ${(33 + rad * Math.sin(a)).toFixed(1)}`).join(' ') + ' Z'
      return html(`<svg viewBox="0 0 66 66" width="66" height="66" aria-hidden="true"><defs><linearGradient id="cn-gear-fill" x1="0" y1="0" x2="1" y2="1"><stop offset="0" class="gs" stop-opacity=".78"/><stop offset="1" class="ge" stop-opacity=".92"/></linearGradient>` +
        `<linearGradient id="cn-gear-sheen" x1=".15" y1="0" x2=".6" y2=".8"><stop offset="0" class="gw" stop-opacity="1"/><stop offset=".55" class="gw" stop-opacity="0"/></linearGradient></defs>` +
        `<path class="gf" fill-rule="evenodd" d="${d} ${hole}"/><path class="gsh" fill-rule="evenodd" d="${d} ${hole}"/><circle class="gh" cx="33" cy="33" r="17"/></svg>`)
    })()
    const gear = h('div.cn-gear', gearSvg)
    const glow = h('span.cn-glow')
    const coreLabel = h('span.cn-cl', 'Engine')
    const core = h('div.cn-core', { style: { left: G.x + 'px', top: G.y + 'px' } }, h('span.cn-aura'), glow, h('span.cn-bead'), gear, coreLabel)

    const tiles = SYS.map(([name, gl, kc, lat, lon]) => {
      const port = name === 'Jira' || name === 'Microsoft Teams' ? h('span.cn-port') : null
      const el = h('div.cn-tile', { '--kc': kc }, h('span.g', glyph(gl, 17)), h('span.n', name, name === 'Postgres' ? icon('lock', 11) : null), port)
      return { el, name, lat, lon, port }
    })

    // pulses out of the core, one at a time
    // (each run is an arc over the glass: a soft glow path under a thin line; side = which way the arc bows)
    const PULSES = [['Postgres', 3.15, 1], ['GitHub', 3.7, -1], ['Jira', 4.25, 1], ['Microsoft Teams', 6.25, -1]]
    const pulses = PULSES.map(([name, at, side]) => {
      const tile = tiles.find((t) => t.name === name)
      const sg = path(spokes, 'gl'), sp = path(spokes, 'ln')
      const dot = h('span.k-pulse.cn-pulse')
      return { tile, at, side, sg, sp, dot }
    })

    // the two detail cards
    const JIRA = { x: 958, y: 44, w: 440, hgt: 262 }, TEAMS = { x: 958, y: 338, w: 440, hgt: 240 }
    const jHead = h('div.cn-ch', { '--kc': C.work }, h('span.g', glyph('jira', 19)), h('div', h('div.nm', 'Jira'), h('div.sb', h('b', 'PAY-1482'), ' · Payments Ops')),
      h('span.rt.k-chip.ok.sm', icon('check', 12), 'Created by a run'))
    const jTitle = h('div.cn-ttl', 'Release wire W2 · $12,500.00 stuck 4 days')
    const jDesc = h('div.cn-desc', 'Scheduled check · stuck wires older than 1 day in bank.wires')
    const fld = (label, ...v) => h('div.cn-f', h('span.k-label', label), h('span.v', ...v))
    const jFields = h('div.cn-fields.k-well',
      fld('Assignee', h('span.k-av.b', 'PN'), 'Priya Nair'),
      fld('Status', h('span.k-chip.brand.sm', 'To Do')),
      fld('Priority', icon('alert', 14), 'High'),
      fld('Run', h('span.mono', '#218 · 07:02')))
    const jira = h('div.cn-card.k-glass', { style: { left: JIRA.x + 'px', top: JIRA.y + 'px' } }, jHead, jTitle, jDesc, jFields)

    const tHead = h('div.cn-ch', { '--kc': C.ind }, h('span.g', glyph('teams', 19)), h('div', h('div.nm', 'Microsoft Teams'), h('div.sb', h('b', '#payments-ops'))),
      h('span.rt.k-meta', '07:02'))
    const tMsg = h('div.cn-msg.k-raised', h('span.cn-bot', icon('workflow', 17)),
      h('div',
        h('div.cn-who', 'Engine', h('span.k-meta', 'Scheduled check')),
        h('div.cn-txt', h('b', '3 wires'), ' stuck past the settlement window.'),
        h('div.cn-txt', h('b', '$12,600.50'), ' held · oldest W2 · $12,500.00 · 4 days.'),
        h('div.cn-txt.mu', 'The release waits for a person.')))
    const tTok = h('span.k-tok', icon('link', 12), 'PAY-1482')
    const tBtn = h('span.k-btn.sm', 'Open approval', icon('arrowUpRight', 13))
    const tAct = h('div.cn-act', tTok, tBtn)
    const teams = h('div.cn-card.k-glass', { style: { left: TEAMS.x + 'px', top: TEAMS.y + 'px' } }, tHead, tMsg, tAct)

    // tethers: tile → card
    const tether = (card) => { const g = path(links, 'gl'), p = path(links, 'ln'); const c = document.createElementNS(NS, 'circle'); c.setAttribute('r', '3.5'); links.appendChild(c); return { g, p, c, card } }
    const jLink = tether(JIRA), tLink = tether(TEAMS)

    globe.append(floor, back, ...tiles.map((t) => t.el), sphere, halo, front, fres, glint, core, spokes, ...pulses.map((p) => p.dot), links)
    const cards = h('div.cn-cards', jira, teams)
    const lean = h('div.cn-lean', globe, cards)
    const tilt = h('div.cn-tilt', lean)
    area.appendChild(h('div.cn-stage', tilt))

    return { G, tilt, globe, sphere, halo, floor, core, gear, glow, coreLabel, tiles, pulses, latB, latF, eqB, eqF,
      jira, teams, JIRA, TEAMS, jLink, tLink, jRows: [jHead, jTitle, jDesc, jFields], tRows: [tHead, tMsg, tAct], tBtn, back, front, fres, glint }
  },

  timeline(tl, kit, s) {
    const D2R = Math.PI / 180
    const G = s.G, P = 2100, PITCH = -16 * D2R, CP = Math.cos(PITCH), SP = Math.sin(PITCH)
    const TH0 = -60, TH1 = 50, TA = 0.3, TD = 9.7
    const theta = (t) => { const p = kit.clamp01((t - TA) / TD); return TH0 + (TH1 - TH0) * (1 - Math.pow(1 - p, 1.6)) }
    // view-space unit vector of (lat, lon) after the globe's yaw and the fixed pitch
    const vec = (lat, lon, th) => {
      const f0 = lat * D2R, l = (lon + th) * D2R
      const x0 = Math.cos(f0) * Math.sin(l), y0 = -Math.sin(f0), z0 = Math.cos(f0) * Math.cos(l)
      return [x0, y0 * CP - z0 * SP, y0 * SP + z0 * CP]
    }
    // perspective projection of a view-space point given in globe radii
    const scr = (x, y, z) => { const f = P / (P - z * G.r); return { x: G.x + x * G.r * f, y: G.y + y * G.r * f, z, f } }
    const proj = (lat, lon, th, rf = 1) => { const [x, y, z] = vec(lat, lon, th); const q = scr(x * rf, y * rf, z * rf); q.z = z; return q }

    /* tiles rise out of the core to the surface, one after another */
    const EMERGE0 = 1.3, EST = 0.07, ED = 0.85
    const RF = 1.04
    const emerge = s.tiles.map((_, i) => EMERGE0 + i * EST)
    const REST = TA + TD

    /* lattice: 12 half meridians + 5 parallels, split into the half in front of the glass and the half behind */
    const LINES = []
    for (let k = 0; k < 12; k++) { const pts = []; for (let la = -90; la <= 90; la += 4) pts.push([la, k * 30]); LINES.push({ pts, eq: false }) }
    for (const la of [-60, -30, 0, 30, 60]) { const pts = []; for (let lo = 0; lo <= 360; lo += 4) pts.push([la, lo]); LINES.push({ pts, eq: la === 0 }) }
    const n1 = (v) => v.toFixed(1)

    /* a run arc: leaves the core toward the viewer, reaches the glass, and runs along the surface (a great circle) to the tile */
    const ARC_N = 30
    const arc = (pl, th) => {
      const T = vec(pl.tile.lat, pl.tile.lon, th)
      const sl = Math.hypot(T[0], T[1]) || 1
      const N = [(-T[1] / sl) * pl.side, (T[0] / sl) * pl.side, 0]
      let S = [N[0] * 0.32 + T[0] * 0.3, N[1] * 0.32 + T[1] * 0.3, 0.85 + T[2] * 0.15]
      const sn = Math.hypot(S[0], S[1], S[2]); S = S.map((v) => v / sn)
      const om = Math.acos(Math.max(-1, Math.min(1, S[0] * T[0] + S[1] * T[1] + S[2] * T[2]))), so = Math.sin(om) || 1
      const pts = []
      for (let i = 0; i <= ARC_N; i++) {
        const u = i / ARC_N, a = Math.sin((1 - u) * om) / so, b = Math.sin(u * om) / so
        const rho = RF * 0.985 * (1 - Math.pow(1 - u, 2.6))
        pts.push(scr((a * S[0] + b * T[0]) * rho, (a * S[1] + b * T[1]) * rho, (a * S[2] + b * T[2]) * rho))
      }
      return pts
    }
    // the part of the arc up to progress p, skipping the stretch hidden inside the bead
    const arcD = (pts, p) => {
      const end = p * ARC_N, k = Math.floor(end)
      let d = '', head = pts[0]
      for (let i = 0; i <= Math.min(k + 1, ARC_N); i++) {
        let q = pts[i]
        if (i > end) { const r = end - k, a = pts[k]; q = { x: a.x + (q.x - a.x) * r, y: a.y + (q.y - a.y) * r } }
        head = q
        if (Math.hypot(q.x - G.x, q.y - G.y) < 44) continue
        d += (d ? 'L' : 'M') + n1(q.x) + ' ' + n1(q.y)
      }
      return { d: d || 'M0 0', head }
    }

    const lastTh = { v: null }
    const render = (tRaw) => {
      const t = Math.min(tRaw, 30)
      const th = theta(t)
      const atRest = t >= REST
      // lattice
      if (lastTh.v !== th) {
        lastTh.v = th
        let dF = '', dB = '', eF = '', eB = ''
        for (const ln of LINES) {
          let prev = null, prevSide = null, sF = '', sB = ''
          for (const [la, lo] of ln.pts) {
            const q = proj(la, lo, th)
            const side = q.z >= 0
            if (prev && side === prevSide) { if (side) sF += `L${n1(q.x)} ${n1(q.y)}`; else sB += `L${n1(q.x)} ${n1(q.y)}` }
            else if (prev) {
              // the segment crosses the limb: start the new side at the previous point (no gap)
              if (side) sF += `M${n1(prev.x)} ${n1(prev.y)}L${n1(q.x)} ${n1(q.y)}`; else sB += `M${n1(prev.x)} ${n1(prev.y)}L${n1(q.x)} ${n1(q.y)}`
            } else { if (side) sF += `M${n1(q.x)} ${n1(q.y)}`; else sB += `M${n1(q.x)} ${n1(q.y)}` }
            prev = q; prevSide = side
          }
          if (ln.eq) { eF += sF; eB += sB } else { dF += sF; dB += sB }
        }
        s.latF.setAttribute('d', dF || 'M0 0'); s.latB.setAttribute('d', dB || 'M0 0')
        s.eqF.setAttribute('d', eF || 'M0 0'); s.eqB.setAttribute('d', eB || 'M0 0')
      }
      // tiles: in front they sit on the glass, crisp; behind they go flat and dim under the frosted sphere
      s.tiles.forEach((tile, i) => {
        const e = kit.ease.out(kit.clamp01((t - emerge[i]) / ED))
        const rf = 0.12 + (RF - 0.12) * e
        const q = proj(tile.lat, tile.lon, th, rf)
        tile.q = q
        const d = q.z
        const vis = Math.min(1, e * 2.2)
        // behind: dimmer with depth, and fading where it would sit right behind the Engine
        const near = d >= 0 ? 1 : 0.3 + 0.7 * kit.clamp01((Math.hypot(q.x - G.x, (q.y - G.y - 18) * 1.25) - 70) / 60)
        const op = vis * (d >= 0 ? 1 : (1 - Math.min(1, -d / 0.5) * 0.42) * near)
        const blur = d >= 0 || e < 0.35 ? 0 : Math.round(Math.min(1, -d / 0.55) * 1.1 * 4) / 4
        const sc = (0.55 + 0.45 * e) * q.f * (d >= 0 ? 1 : 0.94)
        // stacking: front above the glass; just behind the limb also above it (so a tile straddling the silhouette is not cut by the glass); the rest under it
        const z = e < 0.35 ? 52 : d >= 0 ? 60 + Math.round(d * 30) : d > -0.28 ? 56 : 10 + Math.round((d + 1) * 30)
        const par = (0.5 + 0.5 * d) * rf
        // whole pixels at rest so the labels stay crisp
        const px = atRest ? String(Math.round(q.x)) : n1(q.x), py = atRest ? String(Math.round(q.y)) : n1(q.y)
        const tf = `translate(${px}px,${py}px) translate(calc(var(--lx) * ${(par * 16).toFixed(1)}px - 50%), calc(var(--ly) * ${(par * 10).toFixed(1)}px - 50%)) scale(${sc.toFixed(4)})`
        const st = tile.el.style
        if (tile._tf !== tf) { st.transform = tf; tile._tf = tf }
        const o = op.toFixed(3)
        if (tile._o !== o) { st.opacity = o; tile._o = o }
        if (tile._z !== z) { st.zIndex = String(z); tile._z = z }
        const bk = d < 0 && e > 0.35
        if (tile._bk !== bk) { tile.el.classList.toggle('bk', bk); tile._bk = bk }
        if (tile._b !== blur) { st.filter = blur > 0 ? `blur(${blur}px)` : 'none'; tile._b = blur }
      })
      // runs: an arc from the core over the glass to the tile, the dot at its head
      s.pulses.forEach((pl) => {
        const p = kit.ease.io(kit.clamp01((t - pl.at) / 0.55))
        const live = t >= pl.at && t <= pl.at + 0.6
        const keep = pl.tile.name === 'Jira' || pl.tile.name === 'Microsoft Teams'
        const spO = t < pl.at ? 0 : keep ? 0.6 : Math.max(0, 0.8 - Math.max(0, t - pl.at - 0.55) / 0.6)
        if (spO > 0 || live) {
          const { d, head } = arcD(arc(pl, th), p)
          pl.sp.setAttribute('d', d); pl.sg.setAttribute('d', d)
          pl.dot.style.transform = `translate(${n1(head.x)}px,${n1(head.y)}px)`
        }
        const so = spO.toFixed(3)
        if (pl._o !== so) { pl.sp.style.opacity = so; pl.sg.style.opacity = so; pl._o = so }
        const dO = live && Math.hypot(pl.tile.q.x - G.x, pl.tile.q.y - G.y) * p > 40 ? '1' : '0'
        if (pl._d !== dO) { pl.dot.style.opacity = dO; pl._d = dO }
      })
      // tethers tile → card (the card's left edge, a third of the way down)
      for (const [lk, at, tile] of [[s.jLink, 4.9, s.tiles[0]], [s.tLink, 6.85, s.tiles[11]]]) {
        const q = tile.q
        // the end rides on the card while it flies out of its tile (same motion as flyOut), so the line never hangs in space
        const b = lk.card, fp = kit.ease.soft(kit.clamp01((t - at) / 1.0)), sc = 0.18 + 0.82 * fp
        const q0 = proj(tile.lat, tile.lon, theta(at), RF), cx = b.x + b.w / 2, cy = b.y + b.hgt / 2
        const ex = cx + (b.x - cx) * sc + (q0.x - cx) * (1 - fp), ey = cy + (b.y + 64 - cy) * sc + (q0.y - cy) * (1 - fp)
        const mx = (q.x + ex) / 2
        const d = `M${n1(q.x)} ${n1(q.y)}C${n1(mx)} ${n1(q.y)} ${n1(mx)} ${n1(ey)} ${n1(ex)} ${n1(ey)}`
        lk.p.setAttribute('d', d); lk.g.setAttribute('d', d)
        lk.c.setAttribute('cx', n1(ex)); lk.c.setAttribute('cy', n1(ey))
        lk.c.style.opacity = t >= at + 0.75 ? '1' : '0'
      }
    }
    tl.fn(0, 0, (p, t) => render(t))

    /* 1 · the hero tilts in from depth and rests slightly tilted */
    tl.add(s.tilt, { opacity: [0, 1] }, 0.5, 0.9, 'out')
    tl.add(s.tilt, { rx: [24, 5], s: [0.9, 1], y: [40, 0] }, 0.5, 2.6, 'soft')
    tl.add([s.back, s.front], { opacity: [0, 1] }, 0.75, 1.0, 'out')
    tl.add([s.halo, s.glint], { opacity: [0, 1] }, 1.6, 1.0, 'out')

    /* 2 · the engine core lands; its gear turns while the scene plays and settles at rest */
    kit.pop(s.core, { at: 0.95, dur: 0.6, from: 0.6 })
    tl.add(s.gear, { rz: [0, 210] }, 0.95, 9.0, 'out')
    kit.reveal(s.coreLabel, { at: 1.25, y: 0, dur: 0.5 })
    tl.add(s.glow, { opacity: [0, 0] }, 0, 0)
    s.pulses.forEach((pl) => {
      tl.add(s.glow, { opacity: [0, 0.9] }, pl.at - 0.12, 0.15, 'out')
      tl.add(s.glow, { opacity: [0.9, 0] }, pl.at + 0.05, 0.45, 'in')
      // the tile lights as the pulse arrives (Jira and Teams stay lit)
      const keep = pl.tile.name === 'Jira' || pl.tile.name === 'Microsoft Teams'
      tl.cls(pl.tile.el, 'on', pl.at + 0.5, keep ? null : pl.at + 1.1)
    })

    /* 3 · the cards come forward out of their tiles; a port lights on the tile where the tether leaves */
    const flyOut = (card, box, tile, at) => {
      const q = proj(tile.lat, tile.lon, theta(at), RF)
      const dx = q.x - (box.x + box.w / 2), dy = q.y - (box.y + box.hgt / 2)
      tl.add(card, { opacity: [0, 1] }, at, 0.4, 'out')
      tl.add(card, { x: [dx, 0], y: [dy, 0], s: [0.18, 1], ry: [-28, 0] }, at, 1.0, 'soft')
    }
    flyOut(s.jira, s.JIRA, s.tiles[0], 4.9)
    tl.add([s.jLink.g, s.jLink.p], { draw: [0, 1], opacity: [0, 1] }, 5.15, 0.6, 'out')
    tl.add(s.tiles[0].port, { opacity: [0, 1] }, 5.1, 0.3, 'out')
    kit.reveal(s.jRows, { at: 5.0, stagger: 0.06, dur: 0.45, y: 8 })

    flyOut(s.teams, s.TEAMS, s.tiles[11], 6.85)
    tl.add([s.tLink.g, s.tLink.p], { draw: [0, 1], opacity: [0, 1] }, 7.1, 0.6, 'out')
    tl.add(s.tiles[11].port, { opacity: [0, 1] }, 7.05, 0.3, 'out')
    kit.reveal(s.tRows, { at: 6.95, stagger: 0.07, dur: 0.45, y: 8 })
    kit.pop(s.tBtn, { at: 7.7, dur: 0.5 })

  },
})

</script>

    const p3who = h('div.sc-card.k-raised',

      sum('Applied only after approval', 'one write, one person'))

    // 4 · audit
    const p4card = h('div.sc-card.k-raised',

      h('div.k-hr', { style: { margin: '12px 0' } }),

    const p5bad = badc('refused · host not allowed')

    const pane5 = h('div.sc-ev',
      evHead('key', 'Secrets locked to their hosts', 'Encrypted, bound to allowed hosts, removed from run output', h('span.k-chip.sm', icon('globe', 12), 'HTTP step')),

    // 6 · sandbox

    const p6m = h('div.sc-card.k-raised',
      h('div.sc-meters', meters.map(([ic, k, v, t]) => {

    const p6code = h('div.sc-card.k-raised',
      h('div.k-label', { style: { marginBottom: '6px' } }, 'Code · amount over 50 · python'),

        [['def', 'k'], [' rule', 'f'], ['(wires):', '']],

      ], { gutter: false }).el,
      h('div.sc-res', { style: { marginTop: '8px' } }, [['W1', '$100.50'], ['W2', '$12,500.00']].map(([id, amt]) =>

    const pane6 = h('div.sc-ev',
      evHead('cpu', 'Code runs in a sandbox', 'No network, no privileges, memory and CPU limits', h('span.k-chip.sm', icon('code', 12), 'Code step')),

    const panes = [pane1, pane2, pane3, pane4, pane5, pane6]

    tl.add(s.tilt, { opacity: [0, 1] }, 0.5, 0.9, 'out')

    s.rows.forEach((r, i) => tl.add(r.el, { opacity: [0, 0.5], y: [10, 0] }, 1.0 + i * 0.08, 0.6, 'out'))
    tl.add(s.counter, { opacity: [0, 1] }, 1.2, 0.5, 'out')

    const T = [2.2, 3.5, 4.8, 6.1, 7.4, 8.7]

    const ROW = 80

    tl.add(s.ring, { opacity: [0, 1] }, T[0] - 0.15, 0.35, 'out')
    for (let k = 1; k < 6; k++) tl.add(s.ring, { y: [(k - 1) * ROW, k * ROW] }, T[k] - 0.3, 0.38, 'io')

      tl.add(r.el, { opacity: [0.5, 1] }, T[k] - 0.1, 0.35, 'out')
      kit.pop(r.badge, { at: CHECK(k), dur: 0.5, from: 0.4 })
    })
    tl.fn(0, 0, (p, t) => {
      const n = T.filter((_, k) => t >= CHECK(k)).length
      const txt = n + ' of 6 proven'
      if (s.counter.textContent !== txt) s.counter.textContent = txt
      let cur = -1
      T.forEach((tk, k) => { if (t >= tk - 0.05) cur = k })
      if (t >= T_BACK) cur = 1
      s.tabs.forEach((tb, k) => { tb.classList.toggle('cur', k === cur); tb.classList.toggle('done', k !== cur && t >= CHECK(k)) })
    })

    // evidence panes cross-fade with the scanner
    s.panes.forEach((pn, k) => {
      tl.add(pn, { opacity: [0, 1], y: [12, 0] }, T[k], 0.45, 'out')

      tl.add(pn, { opacity: [1, 0] }, outAt, 0.28, 'in')
      tl.add(pn, { y: [0, -8] }, outAt, 0.28, 'in')
    })
    tl.add(s.panes[1], { opacity: [0, 1] }, T_BACK + 0.05, 0.5, 'out')
    tl.add(s.panes[1], { y: [12, 0] }, T_BACK + 0.05, 0.5, 'out')

    kit.pop(s.p1.ok, { at: a + 0.4 })
    tl.add(s.p1.strike, { sx: [0, 1] }, a + 0.55, 0.35, 'io')
    kit.pop(s.p1.bad, { at: a + 0.75 })

    // 2 · effects: steps list in, the unmocked HTTP call is refused
    a = T[1]
    kit.reveal(s.p2.rows, { at: a + 0.1, stagger: 0.07, y: 6, dur: 0.4 })
    kit.pop(s.p2.bad, { at: a + 0.6 })
    kit.reveal(s.p2.ref, { at: a + 0.7, y: 8, dur: 0.45 })

    // 3 · approval: waiting → the approver presses Approve → approved
    a = T[2]
    kit.reveal([s.p3.card, s.p3.who], { at: a + 0.1, stagger: 0.12, y: 8, dur: 0.45 })
    kit.swap(s.p3.gateState, [{ at: a + 0.2, text: s.p3.waiting }, { at: a + 0.85, text: s.p3.approved }])
    tl.cls(s.p3.approveBtn, 'press', a + 0.65, a + 0.82)

    // 4 · audit: the row is written, the retry is skipped
    a = T[3]
    kit.reveal(s.p4.card, { at: a + 0.1, y: 8, dur: 0.45 })
    kit.reveal(s.p4.card.querySelectorAll('.sc-kv > *'), { at: a + 0.25, stagger: 0.03, y: 4, dur: 0.35 })
    kit.reveal(s.p4.retry, { at: a + 0.75, y: 8, dur: 0.45 })

    // 5 · secrets: output shows [removed], the unbound host is refused
    a = T[4]
    kit.reveal([s.p5.sec, s.p5.out, s.p5.ref], { at: a + 0.1, stagger: 0.12, y: 8, dur: 0.45 })
    kit.pop(s.p5.bad, { at: a + 0.7 })

    // 6 · sandbox (quicker): meters fill
    a = T[5]
    kit.reveal([s.p6.m, s.p6.code], { at: a + 0.05, stagger: 0.1, y: 8, dur: 0.4 })
    tl.stagger(s.p6.fills, { sx: [0, 1] }, a + 0.2, 0.06, 0.5, 'out')
  },
})

    .s-reuse .ru-sig .s svg { width: 12px; height: 12px; }
    .s-reuse .ru-sig .l { width: 10px; height: 1.5px; background: color-mix(in srgb, var(--primary) 45%, transparent); }
    .s-reuse .ru-sig.bp .s { background: transparent; box-shadow: none; outline: 1.2px dashed color-mix(in srgb, var(--primary) 55%, transparent); color: var(--faint); }
    .s-reuse .ru-sig.bp .l { background: color-mix(in srgb, var(--primary) 22%, transparent); }

    /* the use-case tab on top of a box */
    .s-reuse .ru-tag { position: absolute; z-index: 3; top: -12px; right: 16px; }
    .s-reuse .ru-tag .k-chip { height: 24px; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ai) 30%, transparent), 0 8px 18px -10px var(--ai);
      background: linear-gradient(var(--ai-soft), var(--ai-soft)), var(--node-bg); }

    /* the strip of smaller blocks */
    .s-reuse .ru-strip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; height: 98px; margin-top: 18px; }
    .s-reuse .ru-sm { position: relative; display: flex; align-items: center; gap: 14px; padding: 0 18px; border-radius: 14px; }
    .s-reuse .ru-sm .tx { flex: 1; min-width: 0; }
    .s-reuse .ru-sm .nm { font-size: 15px; font-weight: 650; letter-spacing: -0.01em; color: var(--fg); line-height: 1.25; }
    .s-reuse .ru-sm .ln { margin-top: 2px; font-size: 13px; line-height: 1.4; color: var(--muted); }
    .s-reuse .ru-sm .rt { flex: none; display: flex; align-items: center; gap: 6px; }
    .s-reuse .ru-ring { position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
      box-shadow: 0 0 0 1.5px color-mix(in srgb, var(--primary) 55%, transparent), 0 0 0 5px var(--brand-soft), 0 16px 34px -16px var(--primary); }
  `,
  build(area, kit) {
    const { h, icon } = kit
    const BW = 329, BH = 340, NY = 262

    const BLOCKS = [
      {
        name: 'Data check', ic: 'search', kind: 'data', fx: 'Effects · database, network',
        line: 'Query → rule → look up the source API → one alert',
        io: [['In', 'bank.wires'], ['Out', 'one alert']], last: ['history', 'Last run · today 07:00 · 3 stuck found'],
        badge: '4 steps inside', inner: 'Inside · 4 micro nodes', tok: ['bank · read-only', ''],
        nodes: [['Query', 'database', 'data'], ['Rule', 'filter', 'flow'], ['Source API', 'globe', 'out'], ['Alert', 'alert', 'trigger']],
        tag: 'Use case 1 · data analysis',
      },
      {
        name: 'Browser test', ic: 'browser', kind: 'trigger', fx: 'Effects · network',
        line: 'Portal sign-in, steps you can take over, exports a Playwright spec',
        io: [['In', 'portal sign-in'], ['Out', 'spec.ts']], last: ['checkCircle', 'Last run · 5 of 5 steps passed'],
        badge: '4 steps inside', inner: 'Inside · 4 micro nodes', tok: ['spec.ts', ''],
        nodes: [['Open portal', 'browser', 'trigger'], ['Fill', 'form', 'code'], ['Sign in', 'hand', 'person'], ['Export', 'download', 'out']],
        tag: 'Use case 2 · testing',
      },
      {
        name: 'Approval chain', ic: 'users', kind: 'person', fx: 'Effects · a person',
        line: 'Maker → checker → treasury, each decision kept',
        io: [['In', 'proposed change'], ['Out', 'decision record']], last: ['history', 'Last decision · W2 · stuck → released'],
        badge: '3 steps inside', inner: 'Inside · 3 micro nodes', tok: ['each decision kept', 'ok'],
        people: [['Maker', 'M', ''], ['Checker', 'C', 'b'], ['Treasury', 'T', 'c']],
      },
      {
        name: 'Scheduled check', ic: 'calendar', kind: 'trigger', fx: 'Effects · database',
        line: 'Every business day 07:00, same code, same answer',
        io: [['In', 'weekdays · 07:00'], ['Out', 'what it finds']], last: ['clock', 'Next run · tomorrow 07:00'],
        badge: '3 steps inside', inner: 'Inside · 3 micro nodes', tok: ['no model in the loop', ''],
        nodes: [['07:00', 'clock', 'trigger'], ['Same code', 'code', 'code'], ['Same answer', 'checkCircle', 'data']],
      },
    ]

    const win = kit.window({ title: 'Blocks · Library', right: h('span.k-chip.ai.sm', icon('layers', 12), 'macro elements'), w: 1440, h: 598 })
    const well = h('div.ru-well.k-well.k-dots')
    win.body.appendChild(well)

    // toolbar: a real library header
    const tools = h('div.ru-tools',
      h('div.lt', icon('layers', 14), h('span.k-label', 'Library · 7 blocks')),
      h('span.sp'),
      h('span.k-chip.brand.sm', 'All'), h('span.k-chip.sm', 'Data'), h('span.k-chip.sm', 'Testing'), h('span.k-chip.sm', 'People'),
      h('span.ru-search.k-recess', icon('search', 13), 'Search blocks'))
    well.appendChild(tools)

    const sigOf = (list) => {
      const el = h('div.ru-sig.k-recess.bp')
      list.forEach(([ic, kind], i) => {
        if (i) el.appendChild(h('span.l'))
        el.appendChild(h('span.s', { '--kc': `var(--k-${kind})` }, icon(ic, 12)))
      })
      return el
    }

    const grid = h('div.ru-grid')
    well.appendChild(grid)
    const blocks = BLOCKS.map((b) => {
      const col = h('div.ru-col')
      const box = h('div.ru-box')
      // the inside: the micro-node graph this block wraps
      const tray = h('div.ru-tray')
      const items = b.people || b.nodes
      const n = items.length
      const span = n === 4 ? 73 : 93
      const x0 = BW / 2 - (span * (n - 1)) / 2
      const xs = items.map((_, i) => x0 + i * span)
      const ed = kit.edges(BW, BH, xs.slice(1).map((x, i) => [xs[i] + 22, NY, x - 22, NY, 'hot']))
      tray.appendChild(ed.svg)
      const minis = items.map((it, i) => {
        let nd
        if (b.people) {
          nd = kit.node({ x: 0, y: 0, name: it[0], icon: 'user', kind: 'person' })
          const t = nd.querySelector('.t'); t.textContent = ''
          t.appendChild(h('span.k-av' + (it[2] ? '.' + it[2] : ''), it[1]))
          nd.appendChild(h('span.st', h('span.ru-ck', icon('check', 10))))
        } else {
          nd = kit.node({ x: 0, y: 0, name: it[0], icon: it[1], kind: it[2] })
        }
        const mw = h('div.ru-mw', { style: { left: xs[i] + 'px', top: NY + 'px' } }, nd)
        tray.appendChild(mw)
        return { mw, t: nd.querySelector('.t'), ck: nd.querySelector('.ru-ck') }
      })
      const foot = h('div.ru-foot.ru-in', h('span.k-label', b.inner), h('span.k-tok' + (b.tok[1] ? '.' + b.tok[1] : ''), b.tok[0]))
      tray.appendChild(foot)

      // the lid: the block's compact face
      const sig = sigOf(items.map((it) => (b.people ? ['user', 'person'] : [it[1], it[2]])))
      const badge = h('span.k-chip.brand.sm', icon('check', 11), b.badge)
      const lid = h('div.ru-lid',
        h('div.ru-top', h('span.k-icon-tile.lg', { '--kc': `var(--k-${b.kind})` }, icon(b.ic, 20)), h('div', h('div.ru-nm', b.name), h('div.ru-fx', b.fx))),
        h('div.ru-line', b.line),
        h('div.ru-io.k-recess', b.io.map(([k, v]) => h('div.r', h('span.k-label', k), h('span.k-tok', v)))),
        h('div.ru-last', icon(b.last[0], 14), b.last[1]),
        h('div.ru-bot', sig, badge))
      box.append(tray, lid)
      col.appendChild(box)
      let tag = null
      if (b.tag) { tag = h('div.ru-tag', h('span.k-chip.ai', icon('sparkles', 12), b.tag)); col.appendChild(tag) }
      grid.appendChild(col)
      return { col, box, lid, minis, paths: ed.paths, foot, sig, badge, tag }
    })

    // the strip of smaller blocks
    const nbToks = [h('span.k-tok.ai', 'data analysis'), h('span.k-tok.ai', 'testing')]
    const nbRing = h('span.ru-ring')
    const SMALL = [
      { name: 'Notebook', ic: 'notebook', kind: 'flow', line: 'the way in', rt: nbToks, ring: nbRing },
      { name: 'Reconciliation', ic: 'compare', kind: 'data', line: 'match two systems, flag the breaks', rt: [h('div.ru-sig.k-recess', h('span.s', { '--kc': 'var(--k-data)' }, icon('database', 12)), h('span.l'), h('span.s', { '--kc': 'var(--k-flow)' }, icon('compare', 12)), h('span.l'), h('span.s', { '--kc': 'var(--k-data)' }, icon('database', 12)))] },
      { name: 'App builder', ic: 'wand', kind: 'out', line: 'describe a screen, it builds a React app on a workflow', rt: [h('div.ru-sig.k-recess', h('span.s', { '--kc': 'var(--k-flow)' }, icon('sparkles', 12)), h('span.l'), h('span.s', { '--kc': 'var(--k-out)' }, icon('browser', 12)), h('span.l'), h('span.s', { '--kc': 'var(--k-code)' }, icon('workflow', 12)))] },
    ]
    const strip = h('div.ru-strip')
    const smalls = SMALL.map((s) => {
      const el = h('div.ru-sm.k-raised',
        s.ring || null,
        h('span.k-icon-tile.lg', { '--kc': `var(--k-${s.kind})` }, icon(s.ic, 20)),
        h('div.tx', h('div.nm', s.name), h('div.ln', s.line)),
        h('div.rt', s.rt))
      strip.appendChild(el)
      return el
    })
    well.appendChild(strip)

    const tilt = h('div.ru-tilt', win.el)
    area.appendChild(h('div.ru-stage', tilt))
    return { tilt, tools, blocks, smalls, nbToks, nbRing }
  },
  timeline(tl, kit, s) {
    // hero tilts in and settles
    tl.add(s.tilt, { opacity: [0, 1] }, 0.45, 0.9, 'out')
    tl.add(s.tilt, { rx: [26, 7], s: [0.9, 1], y: [40, 0] }, 0.35, 2.6, 'soft')
    kit.reveal(s.tools, { at: 0.95, y: 6, dur: 0.5 })
    kit.reveal(s.blocks.map((b) => b.col), { at: 1.0, stagger: 0.08, y: 16, dur: 0.6 })
    kit.reveal(s.smalls, { at: 1.35, stagger: 0.08, y: 10, dur: 0.5 })

    // each box opens, its inside builds, it closes and the face shows what it holds
    const T0 = 2.0, STEP = 1.8
    const REOPEN = 11.0
    s.blocks.forEach((b, i) => {
      const T = T0 + i * STEP
      tl.add(b.box, { '--open': [0, 1] }, T, 0.6, 'out')
      b.minis.forEach((m, k) => {
        const at = T + 0.3 + k * 0.12
        tl.add(m.mw, { '--a': [0, 1] }, at, 0.25, 'out')
        tl.add(m.t, { s: [0.7, 1] }, at, 0.5, 'pop')
        tl.add(m.mw, { z: [0, 22] }, at, 0.5, 'out')
        tl.add(m.mw, { z: [22, 0] }, T + 1.18, 0.3, 'io')
        if (m.ck) tl.add(m.ck, { s: [0.4, 1], opacity: [0, 1] }, at + 0.22, 0.4, 'pop')
      })
      b.paths.forEach((p, k) => kit.draw(p, { at: T + 0.42 + (k + 1) * 0.12, dur: 0.3, stagger: 0 }))
      tl.add(b.foot, { y: [6, 0] }, T + 0.75, 0.4, 'out')
      tl.add(b.box, { '--open': [1, 0] }, T + 1.25, 0.5, 'io')
      tl.step(T + 1.68, (on) => b.sig.classList.toggle('bp', !on))
      // the dashed signature turns solid with a small pop (it stays visible, dashed, before that)
      b.sig.querySelectorAll('.s').forEach((el, k) => {
        const at = T + 1.68 + k * 0.04
        tl.fn(at, 0.4, (p, t) => { const v = t < at ? '' : `scale(${(0.72 + 0.28 * p).toFixed(4)})`; if (el.style.transform !== v) el.style.transform = v }, 'pop')
      })
      kit.pop(b.badge, { at: T + 1.78, dur: 0.5 })
    })
    // the opening box sits above its neighbours while its lid is up
    const cols = s.blocks.map((b) => b.col)
    tl.fn(0, 0, (p, t) => cols.forEach((c, i) => {
      const T = T0 + i * STEP
      const on = (t >= T && t < T + 1.8) || (i === 0 && t >= REOPEN - 0.05)
      const z = on ? '2' : ''
      if (c.style.zIndex !== z) c.style.zIndex = z
    }))

    // the second line: the notebook is the way in, two blocks are the use cases
    tl.add(s.nbRing, { opacity: [0, 1] }, 9.6, 0.6, 'out')
    kit.pop(s.nbToks, { at: 9.8, stagger: 0.1 })
    const tags = s.blocks.filter((b) => b.tag).map((b) => b.tag)
    tags.forEach((t, k) => { tl.add(t, { opacity: [0, 1], y: [8, 0] }, 10.1 + k * 0.18, 0.5, 'out'); tl.add(t.firstChild, { s: [0.85, 1] }, 10.1 + k * 0.18, 0.55, 'pop') })

    // rest: Data check left half-open, its insides lifted a little
    const d = s.blocks[0]
    tl.add(d.box, { '--open': [0, 0.85] }, REOPEN, 1.1, 'soft')
    d.minis.forEach((m, k) => tl.add(m.mw, { z: [0, 12] }, REOPEN + 0.25 + k * 0.06, 0.8, 'out'))
  },
})

</script>

    .s-ask .ak-hd1 .k-icon-tile { width: 28px; height: 28px; }
    .s-ask .ak-hd1 .nm { font: 650 14px var(--mono); letter-spacing: -0.01em; color: var(--fg); }
    .s-ask .ak-rail { margin-left: auto; display: flex; align-items: flex-start; }
    .s-ask .ak-rail .v { display: flex; flex-direction: column; align-items: center; gap: 2px; width: 30px; font: 500 11px/13px var(--mono); color: var(--faint); }

    .s-ask .ak-rail .v.cur { color: var(--primary); font-weight: 700; }

    .s-ask .ak-rail .ln { width: 12px; height: 1px; margin-top: 7px; background: var(--input); }
    .s-ask .ak-hd2 { display: flex; align-items: center; gap: 8px; margin-top: 4px; }

    .s-ask .ak-stats { display: grid; grid-template-columns: .95fr .62fr 1.32fr .9fr; }

    .s-ask .ak-mix span:last-child { border-radius: 3px 99px 99px 3px; }
    .s-ask .ak-leg { display: flex; flex-direction: column; gap: 2px; }
    .s-ask .ak-leg > div { display: flex; align-items: center; gap: 7px; height: 15px; font-size: 11.5px; color: var(--muted); }
    .s-ask .ak-leg i { width: 8px; height: 8px; border-radius: 2px; flex: none; }
    .s-ask .ak-leg b { margin-left: auto; font: 600 11.5px var(--mono); color: var(--fg); }

    .s-ask .ak-q { display: flex; align-items: center; gap: 8px; height: 20px; font-size: 12px; color: var(--fg); white-space: nowrap; }
    .s-ask .ak-q > svg { color: var(--ok); width: 15px; height: 15px; }
    .s-ask .ak-q code { font: 600 11.5px var(--mono); color: var(--fg); }
    .s-ask .ak-q .r { margin-left: auto; display: inline-flex; align-items: center; font: 11px var(--mono); color: var(--faint); }
    .s-ask .ak-q .k-mask { height: 20px; font-size: 11px; }

    .s-ask .ak-two { display: grid; grid-template-columns: 206px 1fr; gap: 16px; }
    .s-ask .ak-pv { display: grid; grid-template-columns: 58px repeat(3, 1fr); gap: 3px; font: 500 11.5px var(--mono); }
    .s-ask .ak-pv > span { display: flex; align-items: center; justify-content: center; height: 18px; border-radius: 4px; color: var(--fg); background: var(--recess); }
    .s-ask .ak-pv > span.h { background: none; font: 600 11px var(--font); color: var(--faint); }
    .s-ask .ak-pv > span.rh { justify-content: flex-start; padding-left: 2px; background: none; font: 550 11.5px var(--font); color: var(--muted); }
    .s-ask .ak-pv > span.z { color: var(--faint); }
    .s-ask .ak-pv > span.w { color: var(--warn-text); background: var(--warn-soft); font-weight: 700; }
    .s-ask .ak-pv > span.hl { color: var(--primary-fg); background: linear-gradient(135deg, var(--brand-1), var(--brand-2)); font-weight: 700; box-shadow: 0 6px 14px -8px var(--primary); }
    .s-ask .ak-spk { position: relative; }
    .s-ask .ak-spk .k-spark .ar { fill: color-mix(in srgb, var(--viz-1) 12%, transparent); }
    .s-ask .ak-spk .pk { position: absolute; right: 12px; top: -3px; font: 700 11px var(--mono); color: var(--primary); }
    .s-ask .ak-spk .end { position: absolute; width: 7px; height: 7px; margin: -3.5px 0 0 -3.5px; border-radius: 99px; background: var(--primary); box-shadow: 0 0 0 3px var(--brand-soft); }

    .s-ask .ak-rel { position: relative; height: 50px; }
    .s-ask .ak-rel .k-edges path { stroke-opacity: .6; }
    .s-ask .ak-tn { position: absolute; display: flex; align-items: center; gap: 6px; height: 22px; padding: 0 9px 0 6px; border-radius: 7px; font: 600 11.5px var(--mono); color: var(--fg); white-space: nowrap;
      background: var(--node-bg); box-shadow: inset 0 0 0 1px var(--node-ring), 0 6px 14px -10px var(--primary); }
    .s-ask .ak-tn svg { width: 13px; height: 13px; color: var(--k-data); }
    .s-ask .ak-tn.main { box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--primary) 55%, transparent), 0 8px 18px -10px var(--primary); }
    .s-ask .ak-el { position: absolute; font: 500 11px var(--mono); color: var(--muted); white-space: nowrap; }
    .s-ask .ak-el.a { left: 118px; top: -4px; }
    .s-ask .ak-el.b { left: 118px; top: 38px; }
    .s-ask .ak-rel .cd { position: absolute; font: 600 11px var(--mono); color: var(--faint); }
  `,
  build(area, kit) {
    const { h, icon } = kit
    const chip = (cls, ...kids) => h('span.k-chip.sm' + (cls ? '.' + cls : ''), ...kids)

    const win = kit.window({
      title: 'Notebook · Stuck wires',
      h: 630,
      right: [h('span.k-avs', h('span.k-av', 'SG'), h('span.k-av.c', 'MR')), chip('ai', icon('sparkles', 12), 'AI drafted')],
    })
    const grid = h('div.ak-grid')
    win.body.appendChild(grid)

    /* ── left: the notebook ── */
    const q = h('div.q')
    const ask = h('div.ak-ask.k-raised',
      h('span.k-av', 'SG'),
      h('div', h('div.who', icon('sparkles', 12), 'saketh asked'), q),
      h('span.k-kbd', '↵ Ask'))

    const CELLS = [
      { kind: 'DATA', kc: 'var(--k-data)', ic: 'hash', t: ['settlement window · ', h('span.k-tok', '1 day')] },
      { kind: 'QUERY', kc: 'var(--primary)', ic: 'database', t: ['stuck wires older than 1 day in bank.wires', h('span.m', 'bank · read-only')], sql: true },
      { kind: 'RULE', kc: 'var(--k-flow)', ic: 'filter', t: ['amount is over 50', h('span.m', 'the oldest first')] },
      { kind: 'CHANGE', kc: 'var(--k-person)', ic: 'gitCommit', t: ['release the oldest · status → released', h('span.m', 'bank_rw')] },
    ]
    let sqlInner = null
    const cells = CELLS.map((c, i) => {
      const ct = h('div.ak-ct', h('div.t', c.t))
      if (c.sql) {
        const S = (t, cl) => (cl ? h('span.' + cl, t) : t)
        sqlInner = h('span',
          S('SELECT', 'k'), ' id, amount, age ', S('FROM', 'k'), ' bank.wires ', S('WHERE', 'k'), ' status = ', S("'stuck'", 's'),
          ' ', S('AND', 'k'), ' age > ', S('interval', 'f'), ' ', S("'1 day'", 's'))
        ct.appendChild(h('code.ak-sql', sqlInner))
      }
      const st = h('span.sw')
      const el = h('div.ak-cell.k-raised',
        h('div.ak-gut', h('span.ix', String(i + 1)), h('span.ak-kind', { '--kc': c.kc }, icon(c.ic, 12), c.kind)),
        ct, h('div', { style: { justifySelf: 'end' } }, st))
      return { el, st }
    })
    const cellsEl = h('div.ak-cells', cells.map((c) => c.el))

    const ST = (ok, text) => h('span.k-chip.sm.' + (ok ? 'ok' : 'warn'), h('span.k-dot'), text)
    const w2st = h('span.sw', { style: { justifyItems: 'start' } })
    const rows = [
      [h('span.id', 'W1'), kit.mask('4821'), h('span.amt', '$100.50'), ST(false, 'stuck'), h('span.age', '3 days')],
      [h('span.id', 'W2'), kit.mask('0937'), h('span.amt', '$12,500.00'), w2st, h('span.age', '4 days')],
      [h('span.id', 'W3'), kit.mask('5512'), h('span.amt', '$75.00'), ST(true, 'sent'), h('span.age', '—')],
      [h('span.id', 'W4'), kit.mask('2210'), h('span.amt', '$40.00'), ST(false, 'stuck'), h('span.age', '2 hours', h('span.nt', 'inside the window'))],
    ]
    const table = kit.table({ cols: '64px 1fr 130px 130px 200px', head: ['ID', 'Beneficiary', 'Amount', 'Status', 'Age'], rows })
    const resLabel = h('div.ak-rl', h('span.k-label', 'Result'), h('span.k-meta', '4 rows · bank.wires v14 · beneficiary masked'))
    const res = h('div.ak-res', resLabel, table.el)

    const oldTok = h('span.k-tok.ak-tw', 'stuck')
    const chgSt = h('span.sw')
    const cursor = h('span.ak-cur', icon('cursor', 20))
    const applyBtn = h('span.k-btn.sm', icon('check', 12), 'Apply')
    const discard = h('span.k-btn.sm.ghost', 'Discard')
    const btns = h('div.btns', discard, h('span.ak-apply', applyBtn, cursor))
    const chg = h('div.ak-chg.k-raised',
      h('span.k-icon-tile', { '--kc': 'var(--k-person)' }, icon('gitCommit', 16)),
      h('div.df', 'W2 status:', oldTok, icon('arrowRight', 14), h('span.k-tok.ok', 'released')),
      h('span.via', 'writes through ', h('b', 'bank_rw'), ' · once'),
      h('span.st', chgSt), btns)

    const keyTok = h('span.k-tok', 'idem-wires-W2-…')
    const F = (label, ...v) => h('div.f', h('span.k-label', label), h('span.v', ...v))
    const aud = h('div.ak-aud.k-raised',
      h('span.k-icon-tile', { '--kc': 'var(--ok)' }, icon('history', 16)),
      h('div.ttl', h('span.a', 'Audit row'), h('span.b', 'written once')),
      F('Who', h('span.k-av', 'SG'), 'saketh'),
      F('When', 'today 07:04'),
      F('Before → after', h('span.mono', 'stuck'), icon('arrowRight', 13), h('span.mono', 'released')),
      F('Key', keyTok),
      F('Wrote', h('span.mono', 'bank_rw · 1 row')))

    const left = h('div.ak-left', ask, cellsEl, res, chg, aud)

    /* ── right: the analytics panel ── */
    const sl = (label, r) => h('div.ak-sl', h('span.k-label', label), r || null)
    const rail = h('div.ak-rail', h('span.v', h('i'), 'v12'), h('span.ln'), h('span.v', h('i'), 'v13'), h('span.ln'), h('span.v.cur', h('i'), 'v14'))
    const secHead = h('div.ak-sec',
      h('div.ak-hd1', h('span.k-icon-tile', { '--kc': 'var(--k-data)' }, icon('database', 15)), h('span.nm', 'bank.wires'), chip('brand', 'v14'), rail),
      h('div.ak-hd2', chip('', icon('lock', 12), 'read-only snapshot · today 07:00'), h('span.k-meta', '9 columns · 3 linked tables')))

    const STATS = [
      { to: 1284, l: 'wires today' },
      { to: 3, l: 'stuck', warn: true },
      { to: 12600.5, l: 'held', fmt: (v) => '$' + v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) },
      { to: 4, l: 'oldest', fmt: (v) => { const n = Math.round(v); return n + (n === 1 ? ' day' : ' days') } },
    ]
    const statV = STATS.map((s) => h('span.v' + (s.warn ? '.warn' : ''), '0'))
    const statsEl = h('div.ak-stats.k-raised', STATS.map((s, i) => h('div.k-stat', statV[i], h('span.l', s.l))))
    const secStats = h('div.ak-sec', statsEl)

    const HV = [0.34, 0.6, 0.86, 1, 0.82, 0.64, 0.5, 0.38, 0.27, 0.2, 0.14, 0.09, 0.06, 0.12]
    const hist = kit.bars(HV, { hl: [13] })
    const MIX = [
      { n: 1262, c: 'var(--viz-1)', l: 'sent' },
      { n: 19, c: 'var(--viz-3)', l: 'pending' },
      { n: 3, c: 'var(--warn)', l: 'stuck' },
    ]
    const mixSegs = MIX.map((m) => h('span', { style: { background: m.c }, '--n': m.n }))
    const legRows = MIX.map((m) => h('div', h('i', { style: { background: m.c } }), m.l, h('b', m.n.toLocaleString('en-US'))))
    const fresh = h('span.r.ok', h('span.k-dot'), 'fresh · 07:00 · 2 min ago')
    const secProf = h('div.ak-sec',
      sl('Profile', fresh),
      h('div.ak-prof',
        h('div', h('div.k-meta', { style: { fontSize: '11.5px', marginBottom: '4px' } }, 'amount'), h('div.ak-hist', hist.el), h('div.ak-ax', h('span', '$0'), h('span', '$12.5k'))),
        h('div', h('div.k-meta', { style: { fontSize: '11.5px' } }, 'status mix'), h('div.ak-mix', mixSegs), h('div.ak-leg', legRows))))

    const QS = [
      [[h('code', 'id'), ' unique'], h('span.r', '1,284 / 1,284')],
      [[h('code', 'amount'), ' not null'], h('span.r', '0 nulls')],
      [[h('code', 'beneficiary_iban'), ' masked for AI and output'], h('span.r', kit.mask('0937'))],
    ]
    const qRows = QS.map(([t, r]) => h('div.ak-q', icon('checkCircle', 15), h('span', t), r))
    const secQ = h('div.ak-sec', sl('Quality checks', h('span.r', '3 of 3 pass')), qRows)

    const PV = [
      ['', '<1d', '1–3d', '>3d'],
      ['sent', '1,262', '—', '—'],
      ['pending', '19', '—', '—'],
      ['stuck', '1', '1', '1'],
    ]
    const pvCells = []
    const pv = h('div.ak-pv', PV.map((row, r) => row.map((v, c) => {
      const cls = r === 0 ? '.h' : c === 0 ? '.rh' : v === '—' ? '.z' : r === 3 ? (c === 3 ? '.hl' : '.w') : ''
      const el = h('span' + cls, v)
      if (r > 0 && c > 0) pvCells.push(el)
      return el
    })))
    const SP = [40, 32, 28, 35, 62, 148, 336, 603]
    const SW = 214, SH = 52
    const sp = kit.spark(SP, SW, SH, { pad: 4 })
    const spEnd = h('span.end', { style: { left: sp.X(SP.length - 1) + 'px', top: sp.Y(SP[SP.length - 1]) + 'px' } })
    const spPk = h('span.pk', '603')
    const secTwo = h('div.ak-sec', h('div.ak-two',
      h('div', sl('Pivot · status × age'), pv),
      h('div', sl('Wires per hour today'), h('div.ak-spk', { style: { width: SW + 'px', height: SH + 'px' } }, sp.svg, spEnd), h('div.ak-ax', h('span', '00:00'), h('span', '07:00')))))
    secTwo.querySelector('.ak-spk').appendChild(spPk)

    // relationships: wires —account_id→ accounts, wires —batch_id→ settlement_batches
    const RW = 442, RH = 50
    const nW = h('span.ak-tn.main', { style: { left: '0px', top: '14px' } }, icon('table', 13), 'wires')
    const nA = h('span.ak-tn', { style: { left: '232px', top: '2px' } }, icon('table', 13), 'accounts')
    const nB = h('span.ak-tn', { style: { left: '232px', top: '28px' } }, icon('table', 13), 'settlement_batches')
    const re = kit.edges(RW, RH, [[76, 25, 228, 13], [76, 25, 228, 39]])
    const elA = h('span.ak-el.a', 'account_id → id')
    const elB = h('span.ak-el.b', 'batch_id → id')
    const cdA = h('span.cd', { style: { left: '346px', top: '5px' } }, 'n : 1')
    const cdB = h('span.cd', { style: { left: '400px', top: '31px' } }, 'n : 1')
    const relBox = h('div.ak-rel', re.svg, nW, nA, nB, elA, elB, cdA, cdB)
    const secRel = h('div.ak-sec', sl('Relationships', h('span.r', '2 joins found')), relBox)

    // skeletons where each section will land (the panel waits for the query to run)
    const SK = [[74, [100, 100]], [146, [38, 92, 70]], [264, [80, 64, 88]], [358, [46, 90, 76]], [474, [34, 82]]]
    const skels = SK.map(([top, ws]) => h('div.ak-skel', { style: { top: top + 'px' } }, ws.map((w, i) => h('div.k-shimmer', { style: { width: w + '%', height: i === 0 && top === 74 ? '44px' : '12px' } }))))
    const panel = h('div.ak-panel.k-well', secHead, secStats, secProf, secQ, secTwo, secRel, skels)
    grid.append(left, panel)

    const tilt = h('div.ak-tilt', win.el)
    area.appendChild(h('div.ak-stage', tilt))
    return {
      tilt, ask, q, cells, sqlInner, res, resLabel, table, w2st, chg, oldTok, chgSt, applyBtn, discard, cursor, aud, keyTok,
      secs: [secHead, secStats, secProf, secQ, secTwo, secRel], statV, STATS, hist, mixSegs, legRows, fresh, qRows, pvCells,
      sp, spEnd, spPk, re, skels, rel: [nW, nA, nB], relLabels: [elA, elB, cdA, cdB], panel,
    }
  },
  timeline(tl, kit, s) {
    const { h, icon } = kit
    const chip = (cls, ...kids) => h('span.k-chip.sm.' + cls, ...kids)

    // 1. the hero tilts in and settles at a slight tilt
    tl.add(s.tilt, { opacity: [0, 1] }, 0.5, 0.9, 'out')
    tl.add(s.tilt, { rx: [26, 5], s: [0.9, 1], y: [40, 0] }, 0.5, 2.6, 'soft')

    // 2. the ask is typed
    kit.reveal(s.ask, { at: 0.85, y: 8, dur: 0.5 })
    kit.type(s.q, 'Find wires stuck past the settlement window and release the oldest over the limit.', { at: 1.0, cps: 37 })

    // 3. the AI drafts four cells, one by one (violet glow, then they settle)
    const CT = [3.4, 3.72, 4.3, 4.62]
    s.cells.forEach((c, i) => {
      const t = CT[i]
      tl.add(c.el, { opacity: [0, 1], y: [10, 0] }, t, 0.45, 'out')
      tl.add(c.el, { '--g': [0, 1] }, t, 0.3, 'out')
      tl.add(c.el, { '--g': [1, 0] }, t + 0.7, 0.9, 'io')
    })
    tl.add(s.sqlInner, { clip: [0, 1] }, 3.9, 0.95, 'linear')

    // cell status chips: drafted → result
    kit.swap(s.cells[0].st, [{ at: CT[0], text: chip('ai', 'drafted') }, { at: 5.0, text: chip('ok', icon('check', 12), 'set') }])
    kit.swap(s.cells[1].st, [{ at: CT[1], text: chip('ai', 'drafted') }, { at: 5.0, text: chip('brand', icon('play', 11), 'running') }, { at: 5.85, text: chip('ok', icon('check', 12), '3 rows') }])
    kit.swap(s.cells[2].st, [{ at: CT[2], text: chip('ai', 'drafted') }, { at: 7.3, text: chip('ok', icon('check', 12), '1 row') }])
    kit.swap(s.cells[3].st, [{ at: CT[3], text: chip('ai', 'drafted') }, { at: 8.4, text: chip('warn', icon('userCheck', 12), 'waits for a person') }, { at: 11.35, text: chip('ok', icon('check', 12), 'applied · 1 row') }])

    // 4. the analytics panel comes alive as the query runs
    tl.add(s.panel, { opacity: [0.55, 1] }, 3.7, 0.6, 'out')
    kit.reveal(s.secs[0], { at: 3.75, y: 6, dur: 0.5 })
    ;[5.05, 5.35, 5.95, 6.45, 6.95].forEach((t, i) => tl.add(s.skels[i], { opacity: [1, 0] }, t - 0.05, 0.35, 'out'))
    kit.reveal(s.secs[1], { at: 5.05, y: 6, dur: 0.45 })
    s.statV.forEach((el, i) => kit.count(el, s.STATS[i].to, { at: 5.15 + i * 0.08, dur: 1.1, fmt: s.STATS[i].fmt }))
    kit.reveal(s.secs[2], { at: 5.35, y: 6, dur: 0.45 })
    tl.stagger(s.hist.bars, { sy: [0, 1] }, 5.45, 0.035, 0.5, 'out')
    tl.stagger(s.mixSegs, { sx: [0, 1] }, 5.6, 0.22, 0.45, 'out')
    kit.reveal(s.legRows, { at: 5.7, stagger: 0.08, y: 4, dur: 0.35 })
    kit.reveal(s.fresh, { at: 5.95, y: 0, x: -6, dur: 0.4 })
    kit.reveal(s.secs[3], { at: 5.95, y: 6, dur: 0.4 })
    s.qRows.forEach((r, i) => {
      tl.add(r, { opacity: [0.3, 1] }, 6.05 + i * 0.16, 0.3, 'out')
      tl.add(r.querySelector('svg'), { s: [0.4, 1], opacity: [0, 1] }, 6.05 + i * 0.16, 0.45, 'pop')
    })
    kit.reveal(s.secs[4], { at: 6.45, y: 6, dur: 0.4 })
    kit.pop(s.pvCells, { at: 6.55, stagger: 0.03, dur: 0.4, from: 0.7 })
    kit.draw(s.sp.line, { at: 6.65, dur: 0.95, e: 'io' })
    tl.add(s.sp.area, { opacity: [0, 1] }, 7.1, 0.6, 'out')
    kit.pop([s.spEnd, s.spPk], { at: 7.55, stagger: 0.05 })
    kit.reveal(s.secs[5], { at: 6.95, y: 6, dur: 0.4 })
    kit.pop(s.rel[0], { at: 7.05, dur: 0.45 })
    kit.draw(s.re.paths, { at: 7.2, stagger: 0.12, dur: 0.5 })
    kit.pop([s.rel[1], s.rel[2]], { at: 7.45, stagger: 0.12, dur: 0.45 })
    kit.reveal(s.relLabels, { at: 7.6, stagger: 0.06, y: 4, dur: 0.35 })

    // 5. the result fills; the rule picks W2
    kit.reveal(s.resLabel, { at: 6.15, y: 6, dur: 0.4 })
    kit.reveal(s.table.head, { at: 6.25, y: 6, dur: 0.4 })
    kit.reveal(s.table.rows, { at: 6.4, stagger: 0.1, y: 8, dur: 0.45 })
    tl.cls(s.table.rows[1], 'hl', 7.4)
    tl.cls([s.table.rows[2], s.table.rows[3]], 'dim', 7.4)
    kit.swap(s.w2st, [
      { at: 6.5, text: h('span.k-chip.sm.warn', h('span.k-dot'), 'stuck') },
      { at: 11.4, text: h('span.k-chip.sm.ok', h('span.k-dot'), 'released') },
    ])

    // 6. the change waits for a person
    kit.reveal(s.chg, { at: 8.45, y: 10, dur: 0.55 })
    kit.swap(s.chgSt, [
      { at: 8.5, text: chip('warn', icon('userCheck', 12), 'waits for a person') },
      { at: 11.3, text: chip('ok', icon('check', 12), 'written once · 07:04') },
    ])

    // 7. a person clicks Apply
    tl.add(s.cursor, { opacity: [0, 1] }, 10.15, 0.3, 'out')
    tl.add(s.cursor, { x: [-80, 0], y: [62, 0] }, 10.15, 0.95, 'io')
    tl.add(s.cursor, { opacity: [1, 0] }, 11.9, 0.4, 'out')
    tl.cls(s.applyBtn, 'press', 11.2, 11.36)
    tl.cls(s.oldTok, 'gone', 11.3)
    tl.cls(s.chg, 'done', 11.3)
    tl.add([s.applyBtn, s.discard], { opacity: [1, 0.4] }, 11.5, 0.4, 'out')

    // 8. the audit row lands, its key token pops
    tl.add(s.aud, { opacity: [0, 1] }, 12.45, 0.45, 'out')
    tl.add(s.aud, { x: [-28, 0] }, 12.45, 0.7, 'out')
    kit.pop(s.keyTok, { at: 12.85, dur: 0.55, from: 0.6 })
  },
})

  build(area, kit) {
    const { h, icon } = kit
    const win = kit.window({
      title: 'Keep this answer',
      right: h('span.k-chip.ok.sm', icon('notebook', 12), 'from Notebook · Stuck wires'),
      h: 612,
    })

    /* ── left ── */
    const src = h('div.kp-src.k-raised',
      h('div.row',
        h('span.k-icon-tile', { '--kc': 'var(--k-code)' }, icon('notebook', 16)),
        h('div', h('div.tt', 'Stuck wires'), h('div.mt', 'Notebook · 4 cells · ran today')),
        h('div.ans', h('div.v', '3 stuck'), h('div.mt', '$12,600.50 held'))),
      h('div.toks', ['DATA', 'QUERY', 'RULE', 'CHANGE'].map((t) => h('span.k-tok', t))))

    const OPTS = [
      ['workflow', 'Workflow', 'Run on demand or from another workflow.', [['play', 'on demand'], ['merge', 'as a sub-workflow']], 'var(--k-flow)'],
      ['flask', 'Test suite', 'Pass/fail every run; browser steps export as Playwright tests.', [['checkCircle', 'pass / fail'], ['download', 'Playwright']], 'var(--k-data)'],
      ['calendar', 'Scheduled check', 'Runs on a schedule, flags what it finds.', [['clock', 'every business day 07:00'], ['alert', 'flags findings']], 'var(--k-trigger)'],
    ]
    const opts = OPTS.map(([ic, tt, ds, chips, kc]) => {
      const dot = h('span')
      const ring = h('span.ring')
      const el = h('div.kp-opt.k-raised',
        h('span.k-icon-tile', { '--kc': kc }, icon(ic, 16)),
        h('div', h('div.tt', tt), h('div.ds', ds), h('div.ft', chips.map(([ci, ct]) => h('span.k-chip.sm', icon(ci, 11), ct)))),
        h('span.rd', dot), ring)
      return { el, dot, ring }
    })
    const keepBtn = h('span.k-btn', icon('check', 14), 'Keep')
    const keepWrap = h('span.kb', keepBtn)
    const kept = h('span.k-chip.ok.kept', icon('checkCircle', 13), 'Kept as a scheduled check')
    const act = h('div.kp-act', keepWrap, h('span.k-btn.ghost', 'Cancel'), kept)
    const lab = h('div.kp-lab', h('span.k-label', 'Keep as'), h('span.k-meta', 'pick one'))
    const left = h('div.kp-left', src, lab, h('div.kp-opts', opts.map((o) => o.el)), act)

    /* ── right: the scheduled workflow ── */
    const GW = 1042, GH = 218, CW = 172, CY = 80, STEP = (GW - 32 - CW) / 4
    const N = [
      ['Trigger', 'every business day 07:00', 'clock', 'trigger', 'none'],
      ['Query', 'runs on bank, read-only', 'database', 'data', 'database · read'],
      ['Rule', 'same code as the notebook', 'code', 'code', 'none'],
      ['Change', 'asks a person first', 'userCheck', 'person', 'a person'],
      ['Write', 'through bank_rw', 'database', 'data', 'database · write'],
    ]
    const graph = h('div.kp-graph.k-well.k-dots')
    const empty = h('div.kp-empty', icon('cursor', 15), 'Pick how to keep this answer')
    const ghead = h('div.kp-ghead',
      h('span.k-icon-tile', { '--kc': 'var(--k-trigger)' }, icon('calendar', 16)),
      h('span.tt', 'Scheduled check · Stuck wires'),
      h('span.r', h('span.k-chip.sm', icon('workflow', 11), '5 steps'), h('span.k-chip.brand.sm', icon('clock', 11), 'next run Tue 07:00')))
    const xs = N.map((_, i) => 16 + i * STEP)
    const ey = CY + 32
    const ed = kit.edges(GW, GH, xs.slice(0, 4).map((x, i) => [x + CW, ey, xs[i + 1], ey, i === 3 ? 'dash' : '']))

    const cards = N.map(([name, meta, ic, kind], i) => {
      const c = kit.ncard({ x: xs[i], y: CY, name, meta, icon: ic, kind, w: CW })
      graph.appendChild(c)
      return c
    })
    const fx = N.map(([, , , , e], i) => {
      const el = h('div.kp-fx', { style: { left: xs[i] + 'px' } }, 'effect · ', h('b', e))
      graph.appendChild(el)
      return el
    })
    const lockB = h('span.k-chip.sm.bdg', icon('lock', 11), 'read-only')
    cards[1].appendChild(lockB)
    const gold = h('span.gold')
    const waitB = h('span.k-chip.warn.sm.bdg', icon('userCheck', 11), 'waits for a person')
    cards[3].append(gold, waitB)
    const dot = h('span.k-pulse'); graph.appendChild(dot)

    /* ── right: next runs + last runs ── */
    const DAYS = [['Tue', '3'], ['Wed', '4'], ['Thu', '5'], ['Fri', '6'], ['Sat', '7', 1], ['Sun', '8', 1], ['Mon', '9']]
    const days = DAYS.map(([d, n, off], i) => h('div.kp-day.k-raised' + (off ? '.off' : '') + (i === 0 ? '.nx' : ''),
      h('span.d', d), h('span.n', n), h('span.tm', off ? 'no run' : '07:00')))
    const RUNS = ['Mon 2 Nov', 'Fri 30 Oct', 'Thu 29 Oct']
    const runs = RUNS.map((d) => h('div.kp-run.k-raised',
      icon('checkCircle', 15), h('span.dt', d), h('span.k-chip.ok.sm', 'ok'), h('span.tm', '07:00'), h('span.sa', 'same answer'), h('span.k-tok', icon('hash', 11), 'sha 9f3c…')))
    const runsEl = h('div.kp-runs.k-well',
      h('div', h('div.k-label', 'Next runs', h('span', 'business days only')), h('div.kp-cal', days)),
      h('div', h('div.k-label', 'Last runs', h('span', 'result hash')), h('div.kp-hist', runs)))

    /* ── right: the two guarantees ── */
    const codeA = kit.code([[['wires', ''], ['.', ''], ['filter', 'f'], ['(w ', ''], ['=>', 'k'], [' w.amount ', ''], ['>', 'k'], [' ', ''], ['50', 'n'], [')', '']]], { gutter: false })
    const codeB = kit.code([[['wires', ''], ['.', ''], ['filter', 'f'], ['(w ', ''], ['=>', 'k'], [' w.amount ', ''], ['>', 'k'], [' ', ''], ['50', 'n'], [')', '']]], { gutter: false })
    const srcA = h('span.k-tok', 'src a41e…'), srcB = h('span.k-tok', 'src a41e…')
    const cbA = h('div.kp-cb.k-raised', h('div.lb', h('span', 'Notebook · RULE cell'), srcA), codeA.el)
    const cbB = h('div.kp-cb.k-raised', h('div.lb', h('span', 'Workflow · Rule step'), srcB), codeB.el)
    const eq = h('span.kp-eq', '=')
    const ident = h('span.k-chip.ok', icon('check', 13), 'identical')
    const same = h('div.kp-co.k-well',
      h('div.hd', h('span.k-icon-tile', { '--kc': 'var(--k-code)' }, icon('compare', 16)),
        h('div', h('div.tt', 'Same code, same answer'), h('div.ds', 'The rule node runs the exact source the notebook ran.')), ident),
      h('div.kp-cmp', cbA, eq, cbB))

    const strike = h('span.sk')
    const noAI = h('span.k-chip.brand', icon('cpu', 13), 'no AI at run time')
    const z1 = h('span.v', '0'), z2 = h('span.v', '5 of 5')
    const nomodel = h('div.kp-co.k-well',
      h('div.hd', h('span.kp-nm-wrap', h('span.k-icon-tile', { '--kc': 'var(--ai)' }, icon('sparkles', 16)), strike),
        h('div', h('div.tt', 'No model in the loop'), h('div.ds', 'Nothing is regenerated.')), noAI),
      h('div.kp-stats',
        h('div.k-stat.k-raised', z1, h('span.l', 'model calls per run')),
        h('div.k-stat.k-raised', z2, h('span.l', 'steps run as kept'))))

    const right = h('div.kp-right', graph, runsEl, h('div.kp-calls', same, nomodel))
    win.body.appendChild(h('div.kp-grid', left, right))

    const tilt = h('div.kp-tilt', win.el)
    area.appendChild(h('div.kp-stage', tilt))
    return { tilt, src, lab, opts, act, keepWrap, kept, empty, ghead, cards, fx, lockB, gold, waitB, paths: ed.paths, dot,
      runsEl, days, runs, same, cbA, cbB, codeA, codeB, srcA, srcB, eq, ident, nomodel, strike, noAI, stats: [z1.parentNode, z2.parentNode] }
  },
  timeline(tl, kit, s) {
    // hero tilts in and settles at 7deg
    tl.add(s.tilt, { opacity: [0, 1] }, 0.5, 0.9, 'out')
    tl.add(s.tilt, { rx: [26, 7], s: [0.9, 1], y: [40, 0] }, 0.45, 2.6, 'soft')

    // the kept answer and the chooser
    kit.reveal(s.src, { at: 0.9, y: 8, dur: 0.5 })
    kit.reveal(s.lab, { at: 1.0, y: 6, dur: 0.4 })
    kit.reveal(s.opts.map((o) => o.el), { at: 1.05, stagger: 0.12, y: 10, dur: 0.55 })
    kit.reveal(s.act, { at: 1.5, y: 6, dur: 0.45 })

    // Scheduled check is picked
    const pick = s.opts[2]
    tl.add(pick.ring, { opacity: [0, 1] }, 2.4, 0.35, 'out')
    tl.add(pick.dot, { opacity: [0, 1] }, 2.4, 0.2, 'out')
    tl.add(pick.dot, { s: [0.3, 1] }, 2.4, 0.45, 'pop')
    tl.add(pick.el, { s: [1, 1.012] }, 2.4, 0.3, 'spring')
    s.opts.slice(0, 2).forEach((o) => tl.add(o.el, { opacity: [1, 0.55] }, 2.5, 0.45, 'out'))

    // Keep is pressed
    tl.add(s.keepWrap, { s: [1, 0.93] }, 3.4, 0.12, 'out')
    tl.add(s.keepWrap, { s: [0.93, 1] }, 3.52, 0.35, 'spring')
    kit.pop(s.kept, { at: 3.62 })
    tl.add(s.empty, { opacity: [1, 0] }, 3.5, 0.3, 'out')
    kit.reveal(s.ghead, { at: 3.65, y: 6, dur: 0.45 })

    // the scheduled workflow builds: blueprint, then solid; edges draw once both ends exist
    const T0 = 3.9, TICK = 0.3
    s.cards.forEach((c, i) => {
      const tb = T0 + i * TICK, ts = tb + TICK
      tl.add(c, { opacity: [0, 1] }, tb, 0.18, 'out')
      tl.step(ts, (on) => c.classList.toggle('bp', !on))
      tl.add(c, { s: [0.9, 1] }, ts, 0.5, 'pop')
      kit.reveal(s.fx[i], { at: ts + 0.05, y: 4, dur: 0.4 })
      if (i > 0) kit.draw(s.paths[i - 1], { at: ts + 0.04, dur: 0.4, stagger: 0 })
    })
    kit.pop(s.lockB, { at: T0 + 2 * TICK + 0.1 })

    // next runs, then the last runs with the same result hash
    kit.reveal(s.runsEl, { at: 5.7, y: 8, dur: 0.5 })
    kit.pop(s.days, { at: 6.0, stagger: 0.08, from: 0.8 })
    kit.reveal(s.runs, { at: 7.0, stagger: 0.16, y: 6, dur: 0.45 })
    s.runs.forEach((r, i) => kit.pop(r.querySelector('.k-tok'), { at: 7.25 + i * 0.16 }))

    // same code, same answer
    kit.reveal(s.same, { at: 8.0, y: 8, dur: 0.5 })
    kit.reveal([s.cbA, s.cbB], { at: 8.15, stagger: 0.1, y: 6, dur: 0.4 })
    tl.add(s.codeA.lines[0], { clip: [0, 1] }, 8.25, 0.55, 'linear')
    tl.add(s.codeB.lines[0], { clip: [0, 1] }, 8.55, 0.55, 'linear')
    kit.pop([s.srcA, s.srcB], { at: 8.85, stagger: 0.1 })
    kit.pop(s.eq, { at: 9.0, from: 0.5 })
    kit.pop(s.ident, { at: 9.15 })

    // no model in the loop
    kit.reveal(s.nomodel, { at: 9.4, y: 8, dur: 0.5 })
    tl.add(s.strike, { sx: [0, 1] }, 9.75, 0.35, 'out')
    kit.reveal(s.stats, { at: 9.7, stagger: 0.1, y: 6, dur: 0.4 })
    kit.pop(s.noAI, { at: 10.0 })

    // one run travels the graph and stops at the step that asks a person first
    const TR = 10.3, TD = 1.26
    tl.fn(TR, TD, (p, t) => {
      const k = Math.min(2, Math.floor(p * 3)), q = kit.pointAt(s.paths[k], p * 3 - k)
      s.dot.style.left = q.x + 'px'; s.dot.style.top = q.y + 'px'
      s.dot.style.opacity = t < TR || t > TR + TD + 0.15 ? '0' : '1'
    }, 'io')
    tl.add(s.gold, { opacity: [0, 1] }, 11.45, 0.4, 'out')
    kit.pop(s.waitB, { at: 11.5 })
  },
})
