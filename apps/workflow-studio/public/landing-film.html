      tilt, count, countTx, cards: [ui, api, data], uiSt, apiSt, dataSt, steps, takeBtn, expBtn, expTok,
      c1, c2, flow: [f1, f2, f3], url, load, pnav, navR1, navR2, signin, accounts, card, userTx, userPh, userFld, pwFld, pwPh, dots, pwChip,
      signBtn, banner, handBack, accHd, rows: tbl.rows, thead: tbl.head, toast, cursor, curSvg, labRun, labYou, specPanel, specLines: spec.lines, br,
    }
  },
  timeline(tl, kit, s) {
    /* hero */
    tl.add(s.tilt, { opacity: [0, 1] }, 0.5, 0.9, 'out')
    tl.add(s.tilt, { rx: [26, 7], s: [0.9, 1], y: [40, 0] }, 0.45, 2.6, 'soft')
    kit.reveal(s.cards, { at: 1.0, stagger: 0.09, y: 10, dur: 0.6 })

    /* suite status chips: queued → running → passed */
    const status = (st, run, pass) => {
      tl.add(st.q, { opacity: [1, 0] }, run, 0.2, 'in')
      tl.add(st.r, { opacity: [0, 1] }, run, 0.25, 'out')
      tl.add(st.r, { opacity: [1, 0] }, pass, 0.18, 'in')
      tl.add(st.p, { opacity: [0, 1] }, pass, 0.25, 'out')
      tl.add(st.p, { s: [0.8, 1] }, pass, 0.5, 'pop')
    }
    const T_RUN = 1.8, T_LOAD = 2.4, T_USER = 2.6, T_PW = 3.8, T_BACK = 5.55, T_CLICK = 5.7, T_SWAP = 6.6, T_PASS = 7.7
    const T_EXP = 8.9, T_API = 10.5, T_DATA = 11.2
    status(s.uiSt, T_RUN, T_PASS + 0.1)
    status(s.apiSt, 10.0, T_API)
    status(s.dataSt, 10.65, T_DATA)

    /* header chip counts passes */
    tl.fn(0, 0, (p, t) => {
      const n = t >= T_DATA ? 3 : t >= T_API ? 2 : t >= T_PASS + 0.1 ? 1 : 0
      const tx = `${n} of 3 passed`
      if (s.countTx.textContent !== tx) s.countTx.textContent = tx
      s.count.classList.toggle('ok', n === 3)
      s.count.classList.toggle('brand', t >= T_RUN && n < 3)
    })
    tl.add(s.count, { s: [0.85, 1] }, T_DATA, 0.55, 'pop')

    /* the left stepper follows the run */
    tl.fn(0, 0, (p, t) => {
      s.steps.set(t < T_RUN ? -1 : t < T_USER ? 0 : t < T_PW ? 1 : t < T_CLICK ? 2 : t < T_SWAP ? 3 : t < T_PASS ? 4 : 5)
    })
    tl.cls(s.steps.el, 'you', T_PW, T_BACK)

    /* open the portal: the url types, the page loads */
    const U1 = 'portal.bank.example/sign-in', U2 = 'portal.bank.example/accounts'
    tl.fn(0, 0, (p, t) => {
      let u, blank = false
      if (t < T_RUN) { u = 'about:blank'; blank = true }
      else if (t < T_SWAP) u = U1.slice(0, Math.min(U1.length, Math.round((t - T_RUN) * 44)))
      else u = U2
      if (s.url.textContent !== u) s.url.textContent = u
      s.url.classList.toggle('blank', blank)
    })
    tl.add(s.load, { sx: [0, 1] }, T_RUN + 0.5, 0.7, 'io')
    tl.add(s.load, { opacity: [0, 1] }, T_RUN + 0.5, 0.1, 'out')
    tl.add(s.load, { opacity: [1, 0] }, T_LOAD + 0.75, 0.3, 'out')
    tl.add(s.pnav, { opacity: [0, 1] }, T_LOAD, 0.4, 'out')
    tl.add(s.signin, { opacity: [0, 1], y: [8, 0] }, T_LOAD + 0.08, 0.5, 'out')
    tl.add(s.navR1, { opacity: [1, 0] }, T_SWAP, 0.2, 'in')
    tl.add(s.navR2, { opacity: [0, 1] }, T_SWAP + 0.15, 0.3, 'out')

    /* the cursor: runner → username → (person) password → runner → Sign in */
    const P0 = [800, 430], PU = [470, 238], PP = [470, 302], PB = [540, 359]
    tl.add(s.cursor, { opacity: [0, 1] }, 2.5, 0.25, 'out')
    tl.add(s.cursor, { x: [P0[0], PU[0]], y: [P0[1], PU[1]] }, T_USER, 0.5, 'io')
    tl.add(s.cursor, { x: [PU[0], PP[0]], y: [PU[1], PP[1]] }, T_PW + 0.05, 0.42, 'io')
    tl.add(s.cursor, { x: [PP[0], PB[0]], y: [PP[1], PB[1]] }, T_CLICK, 0.6, 'io')
    tl.add(s.cursor, { opacity: [1, 0] }, T_SWAP + 0.5, 0.35, 'out')
    const click = (at) => { tl.add(s.curSvg, { s: [1, 0.82] }, at, 0.09, 'out'); tl.add(s.curSvg, { s: [0.82, 1] }, at + 0.1, 0.25, 'spring') }
    click(T_USER + 0.5); click(T_PW + 0.48); click(T_CLICK + 0.62)
    tl.cls(s.cursor, 'you', T_PW, T_BACK)
    tl.add(s.labYou, { opacity: [0, 1] }, T_PW, 0.2, 'out')
    tl.add(s.labRun, { opacity: [1, 0] }, T_PW, 0.15, 'out')
    tl.add(s.labYou, { opacity: [1, 0] }, T_BACK, 0.2, 'out')
    tl.add(s.labRun, { opacity: [0, 1] }, T_BACK, 0.2, 'out')

    /* fill the username */
    tl.cls(s.userFld, 'focus', T_USER + 0.55, T_PW)
    tl.step(T_USER + 0.6, (on) => { s.userPh.style.display = on ? 'none' : '' })
    kit.type(s.userTx, 'ops.reviewer', { at: T_USER + 0.62, cps: 22 })

    /* the person takes over for the password: dots only, never the text */
    tl.cls(s.takeBtn, 'press', T_PW - 0.12, T_PW + 0.04)
    tl.add(s.banner, { opacity: [0, 1], y: [-10, 0] }, T_PW, 0.4, 'spring')
    tl.add(s.banner, { opacity: [1, 0], y: [0, -8] }, T_BACK + 0.05, 0.3, 'in')
    tl.cls(s.handBack, 'press', T_BACK - 0.16, T_BACK)
    tl.cls(s.pwFld, 'focus', T_PW + 0.5, T_BACK + 0.05)
    tl.add(s.pwPh, { opacity: [1, 0] }, T_PW + 0.55, 0.05, 'linear')
    tl.fn(0, 0, (p, t) => {
      const n = t < T_PW + 0.6 ? 0 : Math.min(6, Math.floor((t - (T_PW + 0.6)) / 0.13) + 1)
      const d = '•'.repeat(n)
      if (s.dots.textContent !== d) s.dots.textContent = d
      s.pwPh.style.display = n ? 'none' : ''
    })
    kit.pop(s.pwChip, { at: T_PW + 0.65 })

    /* click Sign in → the accounts table shows */
    tl.cls(s.signBtn, 'press', T_CLICK + 0.62, T_CLICK + 0.78)
    tl.add(s.signin, { opacity: [1, 0] }, T_SWAP, 0.25, 'in')
    tl.add(s.accounts, { opacity: [0, 1] }, T_SWAP + 0.12, 0.3, 'out')
    kit.reveal(s.accHd, { at: T_SWAP + 0.15, y: 8, dur: 0.45 })
    kit.reveal([s.thead, ...s.rows], { at: T_SWAP + 0.3, stagger: 0.08, y: 8, dur: 0.45 })
    kit.pop(s.toast, { at: T_PASS - 0.15, from: 0.8 })

    /* export the Playwright spec: the panel slides up over the pane and the lines type in */
    tl.cls(s.expBtn, 'press', T_EXP - 0.16, T_EXP)
    tl.add(s.expBtn, { opacity: [1, 0] }, T_EXP + 0.05, 0.2, 'in')
    kit.pop(s.expTok, { at: T_EXP + 0.15 })
    tl.add(s.specPanel, { opacity: [0, 1] }, T_EXP + 0.05, 0.35, 'out')
    tl.add(s.specPanel, { y: [70, 0] }, T_EXP + 0.05, 0.75, 'soft')
    s.specLines.forEach((ln, i) => {
      const tx = ln.querySelector('.tx')
      tl.add(ln, { opacity: [0, 1] }, T_EXP + 0.3 + i * 0.2, 0.08, 'linear')
      tl.add(tx, { clip: [0, 1] }, T_EXP + 0.3 + i * 0.2, 0.3, 'linear')
    })

    /* the API and Data suites run */
    kit.pop([s.c1.ck, s.c2.ck], { at: 10.2, stagger: 0.18, from: 0.5 })
    tl.cls(s.flow[0], 'on', 10.75); tl.cls(s.flow[1], 'on', 10.9)
    tl.cls(s.flow[2], 'ok', 11.05)
  },
})

</script>
<script data-slide="08-close">
/* 08 · Close — "One engine. Many uses." The last frame of the talk: two slam lines, then three stat plates in the
 * window material rise from depth and fan gently (the middle one forward, with the only halo), joined underneath by
 * one hairline spine (one engine), then the closing question. Rests perfectly still. */
Film.slide({
  index: 8,
  id: 'close',
  name: 'Close',
  word: 'Recap',
  head: false,
  dur: 7.4,
  css: `
    .s-close .cl-head { position: absolute; left: 160px; right: 160px; top: 138px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
    .s-close .cl-head .k-slam { line-height: 1.04; }
    .s-close .cl-l2 .k-w > span { background: linear-gradient(100deg, var(--brand-1), var(--brand-2)); -webkit-background-clip: text; background-clip: text; color: transparent; padding-right: .04em; }
    .s-close .cl-card { font-variant-numeric: proportional-nums; }
    .s-close .cl-row { position: absolute; left: 50%; top: 432px; width: 1160px; height: 212px; margin-left: -580px; perspective: 1400px; }
    .s-close .cl-fan { position: absolute; inset: 0; transform-style: preserve-3d; }
    .s-close .cl-slot { position: absolute; top: 0; width: 360px; height: 212px; transform-style: preserve-3d; }
    .s-close .cl-rise { position: absolute; inset: 0; transform-style: preserve-3d; transform-origin: 50% 100%; }
    .s-close .cl-card .k-body { display: flex; flex-direction: column; padding: 24px 26px 22px; }
    .s-close .cl-top { display: flex; align-items: center; justify-content: space-between; }
    .s-close .cl-v { margin-top: auto; font-size: 44px; line-height: 1; font-weight: 720; letter-spacing: -0.035em; color: var(--fg); white-space: nowrap; }
    .s-close .cl-mid .cl-v { background: linear-gradient(100deg, var(--brand-1), var(--brand-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .s-close .cl-l { margin-top: 12px; font-size: 14px; line-height: 1.45; color: var(--muted); max-width: 300px; }
    .s-close .cl-spine { position: absolute; left: 50%; top: 672px; width: 1160px; height: 24px; margin-left: -580px; overflow: visible; }
    .s-close .cl-spine path { fill: none; stroke: color-mix(in srgb, var(--primary) 45%, transparent); stroke-width: 1.25; stroke-linecap: round; }
    .s-close .cl-spine circle { fill: var(--bg); stroke: color-mix(in srgb, var(--primary) 70%, transparent); stroke-width: 1.5; transform-box: fill-box; transform-origin: center; }
    .s-close .cl-q { position: absolute; left: 160px; right: 160px; top: 738px; margin: 0; text-align: center; font-size: 30px; line-height: 1.2; font-weight: 600; letter-spacing: -0.025em; color: var(--muted); }
  `,
  build(area, kit, root) {
    const { h, icon } = kit
    const l1 = h('h1.k-slam.cl-l1', 'One engine.')
    // one mask for the whole line so the gradient runs continuously across both words
    const l2in = h('span', 'Many uses.')
    const l2 = h('h2.k-slam.cl-l2', h('span.k-w', l2in))
    root.appendChild(h('div.cl-head', l1, l2))

    const STATS = [
      { ic: 'workflow', kc: 'var(--primary)', v: '35', l: 'node types in an n8n-style engine I built' },
      { ic: 'notebook', kc: 'var(--brand-2)', v: '2 use cases', l: 'we are targeting: data analysis and testing, both in the notebook' },
      { ic: 'lock', kc: 'var(--ok)', v: 'Read-only', l: 'by default. Notebook writes wait for a person.' },
    ]
    const fan = h('div.cl-fan')
    const slots = [], rises = [], vals = []
    STATS.forEach((st, i) => {
      const w = kit.window({ bar: false, halo: i === 1, h: 212 })
      w.win.classList.add('cl-card')
      const v = h('div.cl-v', st.v)
      kit.append(w.body, [
        h('div.cl-top', h('span.k-icon-tile.lg', { '--kc': st.kc }, icon(st.ic, 20))),
        v,
        h('div.cl-l', st.l),
      ])
      const rise = h('div.cl-rise', w.el)
      const slot = h('div.cl-slot' + (i === 1 ? '.cl-mid' : ''), { style: { left: i * 400 + 'px' } }, rise)
      fan.appendChild(slot)
      slots.push(slot); rises.push(rise); vals.push(v)
    })
    root.appendChild(h('div.cl-row', fan))

    // the spine: one hairline joining the three plates (one engine)
    const NS = 'http://www.w3.org/2000/svg'
    const svg = document.createElementNS(NS, 'svg')
    svg.setAttribute('class', 'cl-spine'); svg.setAttribute('viewBox', '0 0 1160 24')
    const path = document.createElementNS(NS, 'path')
    path.setAttribute('d', 'M 180 12 L 980 12')
    svg.appendChild(path)
    const dots = [180, 580, 980].map((x) => {
      const c = document.createElementNS(NS, 'circle')
      c.setAttribute('cx', x); c.setAttribute('cy', 12); c.setAttribute('r', 4)
      svg.appendChild(c)
      return c
    })
    root.appendChild(svg)

    const q = h('p.cl-q', 'What would you build on it?')
    root.appendChild(q)
    return { l1, l2in, slots, rises, vals, path, dots, q }
  },
  timeline(tl, kit, s) {
    kit.kinetic(s.l1, { at: 0.5, stagger: 0.09, dur: 0.95 })
    tl.add(s.l2in, { yp: [108, 0] }, 1.3, 1.0, 'out')

    // the plates rise from depth one by one, then fan to their resting angles
    s.rises.forEach((r, i) => {
      const at = 2.2 + i * 0.18
      tl.add(r, { opacity: [0, 1] }, at, 0.6, 'out')
      tl.add(r, { z: [-300, 0], rx: [20, 0], y: [40, 0] }, at, 1.25, 'soft')
    })
    const FAN = [{ ry: [0, 8] }, { y: [0, -10] }, { ry: [0, -8] }]
    s.slots.forEach((sl, i) => tl.add(sl, FAN[i], 3.4, 0.9, 'io'))
    kit.count(s.vals[0], 35, { at: 2.3, dur: 1.3 })

    // one engine: the spine draws left to right under them
    kit.draw(s.path, { at: 3.9, dur: 0.9, stagger: 0 })
    s.dots.forEach((d, i) => {
      tl.add(d, { opacity: [0, 1] }, 3.9 + i * 0.4, 0.3, 'out')
      tl.add(d, { s: [0.4, 1] }, 3.9 + i * 0.4, 0.45, 'pop')
    })

    // the closing question
    tl.add(s.q, { opacity: [0, 1], y: [16, 0] }, 4.8, 0.8, 'out')
    tl.fn(4.8, 1.2, (p) => { s.q.style.color = `color-mix(in srgb, var(--fg) ${Math.round(p * 100)}%, var(--muted))` }, 'out')
  },
})

</script>
