function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(text){$('#toast').textContent=text;$('#toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').hidden=true,3500);}
function rail(){return `<aside class="rail"><div class="logo">c.</div><button aria-label="Application overview" data-overview>◫</button><button class="selected" aria-label="Business logic" data-logic>⌘</button><button aria-label="Connections" data-pick="postgres">▤</button><div class="avatar">MC</div></aside>`;}
function sidebar(){return `<aside class="sidebar"><div class="side-title">Business logic</div><div class="side-sub">Banking Operations <span>⌄</span></div><div class="side-label">APPLICATION</div><button class="side-op ${selected==='app'?'active':''}" data-pick="app"><span>◫</span>Application overview</button><div class="side-label">TRANSACTIONS</div><button class="side-op ${['search','inputs','validate','read','transform','output'].includes(selected)?'active':''}" data-operation="search"><span>⇄</span><span><b>Find transactions</b><small>Read · 4 inputs</small></span></button><button class="side-op ${selected==='detail'?'active':''}" data-operation="detail"><span>⌕</span><span><b>Inspect transaction</b><small>Read · 1 input</small></span></button><div class="side-label">CONNECTED DATA</div><button class="side-op" data-pick="postgres"><span>▤</span>Operations Postgres</button><button class="side-op" data-pick="audit"><span>≋</span>Audit events</button><div class="sidebar-note"><strong>${concept==='build'?'Visual-managed operation':'Code-backed operation'}</strong>${concept==='build'?'Supported steps generate code. Custom code remains available.':'The visual view explains the implementation. Code remains the authority.'}<div class="micro" style="margin-top:9px">CONCEPT · NOT CONNECTED</div></div></aside>`;}
function node(id,cls,kind){const n=nodes[id];return `<button class="node ${cls} ${selected===id?'selected':''}" data-node="${id}" data-pick="${id}"><div class="node-top"><span class="node-symbol">${n.icon}</span><span class="node-kind">${kind||n.kind}</span></div><strong>${n.title}</strong><p>${id==='search'?'Search, filter and page through records.':id==='postgres'?'Transactions · accounts · branches':id==='inputs'?'status · region · search · page':id==='validate'?'Page size is bounded to '+ruleValue:id==='read'?'Count matches + retrieve a page':id==='output'?'Records and pagination metadata':n.desc.slice(0,65)}</p><div class="node-bottom"><span>${id==='app'?'6 operations':id==='postgres'?'3 tables':concept==='build'?'Supported step':'View details'}</span><span class="tiny-pill">${id==='postgres'?'READ':concept==='build'?'EDITABLE':'INSPECT'} ↗</span></div></button>`;}
function map(){return `<div class="canvas" id="canvas"><div class="map-labels"><span>APPLICATION</span><span>BUSINESS OPERATIONS</span><span>CONNECTED RESOURCES</span></div><svg class="wires" aria-hidden="true"></svg>${node('app','map-app')}${node('search','map-a')}${node('detail','map-b')}${node('postgres','map-c')}${node('audit','map-d')}<div class="map-note"><span><i></i>Declared dependency</span><span><i class="dashed"></i>Proposed relationship · illustrative</span></div><div class="zoom">Auto layout <span>⌘</span></div></div>`;}
function story(){return `<div class="recipe"><div class="recipe-summary"><span>ONE OPERATION · FIVE UNDERSTANDABLE STEPS</span><span class="dots"><i></i><i></i><i></i></span></div>${['inputs','validate','read','transform','output'].map((id,i)=>`<div class="step-wrap"><span class="step-number">${i+1}</span><button class="step ${selected===id?'selected':''}" data-pick="${id}" data-node="${id}"><span class="step-icon">${nodes[id].icon}</span><span class="step-copy"><strong>${nodes[id].title}</strong><small>${['Status, region, search and pagination','Normalize values · page size up to '+ruleValue,'Join transactions, accounts and branches','Select fields and assemble pagination','Records, total matches and page metadata'][i]}</small></span><span class="step-meta">${i===2?'2 queries':i===3?'Custom logic':'Inspect'} <b>›</b></span></button>${id==='validate'?'<div class="branch"><b>Input outside supported range?</b> Normalize to the defined default. <button class="link" data-pick="validate">Inspect rule ↗</button></div>':''}${id==='read'?'<div class="read-group"><button class="read-child" data-pick="read"><b>01 · Count matches</b>Total records for these filters</button><button class="read-child" data-pick="read"><b>02 · Read selected page</b>Return only the requested records</button></div>':''}</div>`).join('')}</div>`;}
function builder(){return `<div class="canvas" id="canvas"><div class="map-labels"><span>VISUAL OPERATION</span><span>SUPPORTED STEPS · DRAFT</span></div><div class="add-menu"><button class="btn" id="add-step">＋ Add step</button><div class="add-options" id="add-options" hidden><button data-add="Check permission">◇ Check permission</button><button data-add="Calculate value">⌘ Calculate value</button><button data-add="Custom code">‹› Custom code</button></div></div><svg class="wires" aria-hidden="true"></svg>${node('inputs','build-start')}${node('validate','build-check')}${node('read','build-read')}${node('output','build-return')}${extra?node('extra','build-extra'):''}<div class="map-note"><span><i></i>Execution sequence</span><span>Drag a step to arrange · illustrative definition</span></div><div class="zoom">Canvas <span>↔</span></div></div>`;}
function code(){return `<div class="code-view"><div class="code-label"><span>banking_ops.py / find_transactions</span><span>ILLUSTRATIVE IMPLEMENTATION</span></div><pre>${escapeHTML(`# Code remains available at every level.
# This is a shortened example, not the live module.

@api.get('/ops/transactions', name='opsTransactions')
def find_transactions(request):
    criteria = normalize_search(request.query)

    total = count_matching_transactions(criteria)
    records = read_transaction_page(criteria)

    return {
        'items': prepare_records(records),
        'total': total,
        'page': criteria.page,
        'page_size': criteria.page_size,
    }

# Exact SQL, shared helpers and custom logic
# would open here with source-linked inspection.`)}</pre><button class="btn" data-back-visual>← Back to visual</button></div>`;}
function inspector(){const n=nodes[selected]||nodes.search;const editing=concept==='build'&&view!==2;return `<aside class="inspector"><div class="inspect-tag"><span>${editing?'CONFIGURE STEP':'INSPECT OPERATION'}</span><span>↗</span></div><div class="inspect-icon">${n.icon}</div><h2>${n.title}</h2><p>${n.desc}</p><span class="evidence"><i></i>${editing?'Illustrative visual definition':n.evidence}</span>${editing?`<label class="form-label">Step label<input id="step-label" value="${escapeHTML(n.title)}"></label><label class="form-label">${selected==='validate'?'Maximum page size':'Connection'}${selected==='validate'?`<input id="page-size" type="number" min="1" max="100" value="${ruleValue}">`:'<select id="connection"><option>Operations Postgres</option><option>Choose another connection…</option></select>'}</label><div class="form-actions"><button class="btn primary" id="apply-step">Apply to concept</button><button class="btn" data-code>View code</button></div><div class="safe-note">This mockup edits a local visual definition only. No database or deployed code is changed.</div>`:`<h3>Properties</h3>${n.properties.map(([key,value])=>`<div class="property"><span>${key}</span><b>${value}</b></div>`).join('')}<h3>${selected==='output'?'Response fields':selected==='postgres'?'Referenced tables':'Inputs & references'}</h3>${n.fields.map(([name,type])=>`<div class="field"><i></i>${name}<code>${type}</code></div>`).join('')}<button class="link" style="margin-top:15px" data-code>Open implementation ↗</button><div class="inspect-footer">An explanation and an execution trace are different things. A real product would tie this view to a source revision and show only verified run evidence.</div>`}</aside>`;}
function render(){const c=concepts[concept];$('#direction-title').textContent=c.title;$('#direction-copy').textContent=c.copy;document.querySelectorAll('[data-concept]').forEach(b=>{b.classList.toggle('active',b.dataset.concept===concept);b.setAttribute('aria-pressed',b.dataset.concept===concept);});$('#app').innerHTML=`<div class="workspace ${concept==='build'?'builder':''}">${rail()}${sidebar()}<section class="main"><header class="pagebar"><div class="crumb">Banking Operations <span>/</span> Backend <span>/</span> <b>${concept==='map'?'Application map':'Find transactions'}</b></div><div class="title-line"><div><h1>${c.heading}</h1><p>${c.sub}</p></div><div class="actions"><button class="btn" data-code>‹› Code</button><button class="btn primary" id="run" ${running?'disabled':''}>▷ ${running?'Playing example…':'Try sample run'}</button></div></div><nav class="view-tabs" aria-label="Workspace view">${c.tabs.map((label,i)=>`<button data-view="${i}" class="${view===i?'active':''}" aria-pressed="${view===i}">${label}</button>`).join('')}</nav></header><div class="split"><div class="stage">${view===2?code():concept==='map'&&view===0?map():concept==='build'&&view===0?builder():story()}</div>${inspector()}</div><section class="trace-panel"><div class="trace-title"><strong>${view===1&&concept==='story'?'Run evidence preview':'Test your understanding'}</strong><span class="evidence">ILLUSTRATIVE · NO API REQUESTS</span></div><div class="trace-message" id="run-status">Try an example with Region: EMEA · Status: exception. All values and timings in this concept are illustrative.</div><div class="trace-items" id="trace-items"><span><i></i>Inputs</span><span><i></i>Rules</span><span><i></i>Two database reads</span><span><i></i>Response</span></div></section></section></div>`;bind();requestAnimationFrame(drawWires);}
function select(id){selected=id;render();}
function drawWires(){const canvas=$('#canvas');if(!canvas)return;const svg=canvas.querySelector('.wires');const pairs=concept==='build'?[['inputs','validate'],['validate','read'],['read','output'],...(extra?[['output','extra']]:[])]:[['app','search'],['app','detail'],['search','postgres'],['detail','postgres'],['detail','audit']];const base=canvas.getBoundingClientRect();svg.innerHTML=pairs.map(([a,b])=>{const first=canvas.querySelector(`[data-node="${a}"]`),second=canvas.querySelector(`[data-node="${b}"]`);if(!first||!second)return '';const f=first.getBoundingClientRect(),s=second.getBoundingClientRect();let x1=f.right-base.left,y1=f.top+f.height/2-base.top,x2=s.left-base.left,y2=s.top+s.height/2-base.top;if(concept==='build'&&(a==='validate'||a==='output')){x1=f.left+f.width/2-base.left;y1=f.bottom-base.top;x2=s.left+s.width/2-base.left;y2=s.top-base.top;return `<path d="M${x1},${y1} C${x1},${y1+65} ${x2},${y2-65} ${x2},${y2}"/>`;}return `<path d="M${x1},${y1} C${x1+35},${y1} ${x2-35},${y2} ${x2},${y2}" ${concept==='map'&&b==='audit'?'stroke-dasharray="5 4"':''}/>`;}).join('');}
function bind(){document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>select(b.dataset.pick));document.querySelectorAll('[data-operation]').forEach(b=>b.onclick=()=>{selected=b.dataset.operation;if(concept==='map')view=1;render();});document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=Number(b.dataset.view);render();});document.querySelectorAll('[data-code]').forEach(b=>b.onclick=()=>{view=2;render();});document.querySelectorAll('[data-back-visual]').forEach(b=>b.onclick=()=>{view=0;render();});document.querySelector('[data-overview]').onclick=()=>{concept='map';view=0;selected='app';render();};document.querySelector('[data-logic]').onclick=()=>{concept='story';view=0;selected='inputs';render();};$('#run').onclick=runExample;if($('#add-step'))$('#add-step').onclick=()=>$('#add-options').hidden=!$('#add-options').hidden;document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{extra=true;nodes.extra.title=b.dataset.add;selected='extra';render();toast('Step added to this local concept.');});if($('#apply-step'))$('#apply-step').onclick=()=>{const label=$('#step-label').value.trim();if(!label)return;nodes[selected].title=label;if($('#page-size')){const value=Number($('#page-size').value);if(!Number.isInteger(value)||value<1||value>100){toast('Choose a whole number from 1 to 100.');return;}ruleValue=String(value);}render();toast('Local concept updated. No code or data was changed.');};if(concept==='build')document.querySelectorAll('.canvas .node').forEach(enableDrag);}
function enableDrag(node){node.onpointerdown=e=>{if(e.button!==0)return;const startX=e.clientX,startY=e.clientY,left=node.offsetLeft,top=node.offsetTop;let moved=false;node.setPointerCapture(e.pointerId);const move=event=>{if(Math.abs(event.clientX-startX)+Math.abs(event.clientY-startY)>5)moved=true;if(!moved)return;node.style.left=Math.max(5,Math.min(node.parentElement.clientWidth-node.offsetWidth-5,left+event.clientX-startX))+'px';node.style.top=Math.max(65,top+event.clientY-startY)+'px';drawWires();};const up=()=>{node.removeEventListener('pointermove',move);node.removeEventListener('pointerup',up);if(moved)node.onclick=event=>{event.preventDefault();event.stopPropagation();node.onclick=()=>select(node.dataset.pick);};};node.addEventListener('pointermove',move);node.addEventListener('pointerup',up);};}
async function runExample(){if(running)return;running=true;$('#run').disabled=true;$('#run').textContent='▷ Playing example…';$('#run-status').textContent='Illustrative playback — this does not execute your backend.';for(const id of ['inputs','validate','read','transform','output']){document.querySelectorAll('.running').forEach(el=>el.classList.remove('running'));document.querySelector(`[data-node="${id}"]`)?.classList.add('running');await new Promise(resolve=>setTimeout(resolve,260));}document.querySelectorAll('.running').forEach(el=>el.classList.remove('running'));running=false;const button=$('#run');if(button){button.disabled=false;button.textContent='▷ Try sample run';}$('#run-status').textContent='Illustrative run complete · 2 database reads · 25 example records · 184 ms. A live product would show recorded evidence for the tested revision.';toast('Example playback only — no backend calls were made.');}
document.querySelectorAll('[data-concept]').forEach(b=>b.onclick=()=>{concept=b.dataset.concept;view=0;selected=concept==='map'?'search':concept==='story'?'read':'validate';render();});$('#theme').onclick=()=>{document.body.classList.toggle('mode-dark');};window.addEventListener('resize',drawWires);render();
</script></body></html>
