<script>
const $ = s => document.querySelector(s);
const icons={overview:'M3 3h7v7H3z M14 3h7v7h-7z M3 14h7v7H3z M14 14h7v7h-7z',data:'M3 5c0-4 18-4 18 0s-18 4-18 0 M3 5v14c0 4 18 4 18 0V5 M3 12c0 4 18 4 18 0',apps:'M3 4h18v16H3z M3 9h18 M8 9v11',automations:'M7 3h10v5H7z M7 16h10v5H7z M12 8v8 M4 12h16',activity:'M3 12h4l3-8 4 16 3-8h4',settings:'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8 M12 2v3 M12 19v3 M2 12h3 M19 12h3 M5 5l2 2 M17 17l2 2 M5 19l2-2 M17 7l2-2',folder:'M3 5h7l2 3h9v12H3z',file:'M5 2h9l5 5v15H5z M14 2v6h5 M8 12h8 M8 16h8',table:'M3 4h18v16H3z M3 9h18 M3 14h18 M9 4v16',upload:'M12 16V3 M7 8l5-5 5 5 M3 16v5h18v-5',plus:'M12 5v14 M5 12h14',arrow:'M5 12h14 M14 7l5 5-5 5',check:'M5 12l4 4L19 6',spark:'M12 2l3 7 7 3-7 3-3 7-3-7-7-3 7-3z',key:'M14 10a5 5 0 1 0-4 4L3 21 M7 17l3 3',code:'M8 5l-6 7 6 7 M16 5l6 7-6 7 M14 3l-4 18',download:'M12 3v13 M7 11l5 5 5-5 M3 17v4h18v-4',clock:'M12 8v5l3 2 M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0',link:'M9 15l6-6 M8 17l-2 2a4 4 0 0 1-5-5l4-4a4 4 0 0 1 6 0 M16 7l2-2a4 4 0 0 1 5 5l-4 4a4 4 0 0 1-6 0',info:'M12 11v6 M12 7v1 M22 12a10 10 0 1 1-20 0 10 10 0 0 1 20 0'};
const icon=(name)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${icons[name]||icons.file}"/></svg>`;
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const state={mode:'vision',page:'overview',tab:'datasets',folder:'All datasets',datasetTab:'preview',sheet:'Transactions',uploaded:false,newApp:false,published:false,query:'',folders:[]};
const datasets=[{name:'Reconciliation — October.xlsx',format:'Excel · 3 sheets',rows:'24,680',size:'3.8 MB',updated:'12 minutes ago',by:'Alex Chen',folder:'Payments',icon:'excel',version:'v3'},{name:'Counterparty directory.csv',format:'CSV',rows:'1,240',size:'186 KB',updated:'2 hours ago',by:'Morgan Patel',folder:'Payments',icon:'table',version:'v2'},{name:'Settlement history.parquet',format:'Parquet',rows:'186,420',size:'12.4 MB',updated:'Yesterday',by:'Workflow run',folder:'Treasury',icon:'db',version:'v8'},{name:'Branch reference.xlsx',format:'Excel · 2 sheets',rows:'840',size:'94 KB',updated:'Oct 12, 2026',by:'Alex Chen',folder:'Reference',icon:'excel',version:'v1'}];
const badge=(text,tone='soft')=>`<span class="badge ${tone}">${text}</span>`;
const button=(text,action,primary=false,ico)=>`<button class="btn ${primary?'primary':''}" data-action="${action}">${ico?icon(ico):''}${text}</button>`;
const heading=(eyebrow,title,sub,actions='')=>`<div class="page-heading"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${sub}</p></div><div class="actions">${actions}</div></div>`;
const resourceIcon=(type='excel')=>`<span class="resource-icon ${type}">${icon(type==='excel'?'file':type==='db'?'data':type)}</span>`;
const bars=(heights=[36,49,40,58,70,62,88,67,76,96,83,100])=>`<div class="bars">${heights.map(h=>`<i style="height:${h}%"></i>`).join('')}</div>`;
function miniature(){return `<div class="mini-screen"><div class="mini-sidebar">◫<br><br>≡<br><br>↗</div><div class="mini-body"><b>Payments command center</b><div class="mini-stats"><div>Volume<b>$2.87M</b></div><div>Transactions<b>600</b></div><div>Exceptions<b>99</b></div></div>${bars()}</div></div>`;}
function appCard(title,desc,status='Published',created=false){return `<a href="#${created?'builder':'app-detail'}" class="card"><div class="app-preview">${miniature()}</div><div class="app-info"><div class="section-heading" style="margin-bottom:6px"><h3>${title}</h3>${badge(status,status==='Published'?'green':'orange')}</div><p>${desc}</p><div class="app-meta"><span>${created?'1 dataset · 2 APIs':'1 connection · 6 APIs'}</span><span>Edited ${created?'just now':'18m ago'} ↗</span></div></div></a>`;}
function overview(){return heading('PROJECT WORKSPACE','Payments Operations','Your data, applications, and automations. Connected in one place.',button('Build an app','build',true,'spark'))+`<section class="welcome-panel"><span class="welcome-icon">${icon('file')}</span><div><h2>Your next app can start with a spreadsheet.</h2><p>Upload a workbook, explore its sheets, and describe what you want to build. Command connects the data, backend, and interface.</p></div><div class="actions">${button('Explore datasets','data',false,'arrow')}</div></section><div class="metrics">${[['Data sources','7','4 datasets · 2 tables · 1 connection','data'],['Applications',state.newApp?'3':'2','1 published · private workspace','apps'],['Automations','3','Next scheduled run in 24 min','automations'],['Successful runs','98.6%','142 runs over the last 7 days','activity']].map(([label,value,foot,i])=>`<div class="card metric"><div class="metric-head">${label}${icon(i)}</div><div class="metric-value">${value}</div><div class="metric-foot">${foot}</div></div>`).join('')}</div><div class="two-column"><section><div class="section-heading"><h2>Your applications</h2><a class="text-button" href="#apps">View all apps →</a></div><div class="app-grid">${appCard('Payments command center','Transactions, account insights, and exception handling.')}${appCard('Reconciliation review','Review unmatched payments across uploaded workbooks.',state.newApp?'Draft':'Draft',true)}</div></section><section><div class="section-heading"><h2>Project data</h2><a class="text-button" href="#data">Browse data →</a></div><div class="card card-pad"><a class="list-item" href="#dataset">${resourceIcon()}<div><b>Reconciliation — October.xlsx</b><small>24,680 rows · 3 sheets · updated 12m ago</small></div>${badge('Ready','green')}</a><a class="list-item" href="#data?tab=connections">${resourceIcon('db')}<div><b>Payments Postgres</b><small>Live connection · read-only access</small></div>${badge('Connected','green')}</a><a class="list-item" href="#data?tab=tables">${resourceIcon('table')}<div><b>Review decisions</b><small>Managed table · 284 rows</small></div>${badge('Table','blue')}</a></div></section></div><div class="section-heading"><h2>Recent activity</h2><a class="text-button" href="#activity">All activity →</a></div><div class="card card-pad">${activityItems().slice(0,3).join('')}</div>`;}
function activityItems(){return [['file','Alex uploaded a new dataset version','Reconciliation — October.xlsx · v3 · 24,680 rows','12 minutes ago'],['apps','Payments command center published','Release 4 · production · private access','18 minutes ago'],['check','Daily reconciliation completed','24,680 rows processed · 128 exceptions found','Today, 09:00'],['key','Database credential replaced','Payments Postgres · development and production','Yesterday, 16:24']].map(([i,title,detail,time])=>`<div class="activity-row"><span class="activity-marker">${icon(i)}</span><div><p>${title}</p><small>${detail}</small></div><small style="margin-left:auto;white-space:nowrap">${time}</small></div>`);}
function data(){let active=state.tab;return heading('DATA WORKSPACE','Data','Upload a dataset, manage a table, or connect a source.',button('New folder','folder',false,'folder')+button('Upload dataset','upload',true,'upload'))+`<div class="tabs">${[['datasets','Datasets',state.uploaded?'5':'4'],['tables','Tables','2'],['connections','Connections','1']].map(([id,label,count])=>`<button class="${active===id?'active':''}" data-tab="${id}">${label}<span>${count}</span></button>`).join('')}</div>`+(active==='datasets'?`<div class="data-layout"><aside class="folder-tree"><div class="tree-label">COLLECTIONS</div>${['All datasets','Payments','Treasury','Reference',...state.folders].map((name,i)=>`<button class="folder-link ${state.folder===name?'active':''} ${i?'child':''}" data-folder="${escapeHtml(name)}">${icon(i?'folder':'data')}<span>${escapeHtml(name)}</span><span>${i===0?datasets.length:datasets.filter(d=>d.folder===name).length}</span></button>`).join('')}<div class="folder-tip">Folders organize datasets.<br>Apps reference stable IDs, so moving or renaming a dataset won’t break them.</div></aside><div><div class="toolbar"><span class="muted" style="font-size:11px">Datasets <span style="padding:0 8px">/</span> <b style="color:var(--text);font-weight:500">${escapeHtml(state.folder)}</b></span><input class="input-search" id="dataset-search" placeholder="Search datasets…" aria-label="Search datasets" value="${escapeHtml(state.query)}"></div><div class="card"><div class="table-wrap"><table class="data-table"><thead><tr><th>Dataset name</th><th>Rows</th><th>Status</th><th>Updated</th><th></th></tr></thead><tbody id="dataset-rows">${datasetRows()}</tbody></table></div><div class="table-footer"><span>Stored and processed by Analytics</span><span>Dataset files only ${badge('New','blue')}</span></div></div><div class="info-note">${icon('info')} Excel workbooks preserve their original file and expose each sheet as structured data. Upload CSV, XLSX, or Parquet.</div></div></div>`:active==='tables'?resourceTable('tables'):resourceTable('connections'));}
function datasetRows(){const filtered=datasets.filter(d=>(state.folder==='All datasets'||state.folder===d.folder)&&d.name.toLowerCase().includes(state.query.toLowerCase()));return filtered.length?filtered.map(d=>`<tr class="clickable" data-action="dataset"><td><div class="resource-name">${resourceIcon(d.icon)}<div>${escapeHtml(d.name)}<small>${d.format} · ${d.size} · ${d.version}</small></div></div></td><td class="mono muted">${d.rows}</td><td>${badge('Ready','green')}</td><td class="muted">${d.updated}<small style="display:block;font-size:9px">${d.by}</small></td><td>↗</td></tr>`).join(''):`<tr><td colspan="5"><div class="empty">No datasets here yet.<br><button class="text-button" data-action="upload">Upload a dataset</button></div></td></tr>`;}
function resourceTable(type){const connections=type==='connections';return `<div class="card"><div class="table-wrap"><table class="data-table"><thead><tr><th>${connections?'Connection':'Table'}</th><th>${connections?'Type':'Rows'}</th><th>Status</th><th>Used by</th><th></th></tr></thead><tbody>${(connections?[['Payments Postgres','PostgreSQL','Connected','Payments command center']]:[['Review decisions','284','Ready','Reconciliation review'],['Approval rules','16','Ready','Daily reconciliation']]).map(([name,kind,status,used])=>`<tr><td><div class="resource-name">${resourceIcon(connections?'db':'table')}<div>${name}<small>${connections?'Read-only · credentials stored in Settings':'Managed data · editable by project members'}</small></div></div></td><td class="muted">${kind}</td><td>${badge(status,'green')}</td><td>${used}</td><td>${button(connections?'View credentials':'Open table',connections?'settings':'table-detail',false)}</td></tr>`).join('')}</tbody></table></div></div><div class="info-note">${icon('info')}${connections?'Connections stay alongside datasets, while secret values stay in Settings. This is a proposed integration; the demonstrated Postgres path uses the existing broker.':'Managed tables remain editable application data. Uploaded datasets are versioned analytical inputs.'}</div>`;}
const transactionRows=[['TX-024680','2026-10-15','Northbridge Capital','USD','42,500.00','Matched'],['TX-024679','2026-10-15','Harbor & Co.','USD','18,750.00','Unmatched'],['TX-024678','2026-10-15','Cedarstone Partners','EUR','64,200.00','Matched'],['TX-024677','2026-10-15','Ashfield Holdings','USD','9,830.50','Review'],['TX-024676','2026-10-15','Northbridge Capital','GBP','31,400.00','Matched'],['TX-024675','2026-10-14','Lakeview Securities','USD','72,180.00','Matched'],['TX-024674','2026-10-14','Harbor & Co.','EUR','15,600.00','Unmatched'],['TX-024673','2026-10-14','Cedarstone Partners','USD','28,450.25','Matched']];

document.addEventListener('click',e=>{const mode=e.target.closest('[data-mode]');if(mode){state.mode=mode.dataset.mode;state.page='overview';history.replaceState(null,'','#overview');render();return;}const tab=e.target.closest('[data-tab]');if(tab){state.tab=tab.dataset.tab;render();return;}const folder=e.target.closest('[data-folder]');if(folder){state.folder=folder.dataset.folder;render();return;}const datasetTab=e.target.closest('[data-dataset-tab]');if(datasetTab){state.datasetTab=datasetTab.dataset.datasetTab;render();return;}const sheet=e.target.closest('[data-sheet]');if(sheet){state.sheet=sheet.dataset.sheet;render();return;}const result=e.target.closest('[data-palette-to]');if(result){$('#modal').close();go(result.dataset.paletteTo);return;}const a=e.target.closest('[data-action]');if(!a)return;const action=a.dataset.action;if(['data','dataset','builder','backend','settings','table-detail'].includes(action)){go(action);return;}if(action==='close'){$('#modal').close();return;}if(action==='upload'||action==='version-upload'){upload(action==='version-upload');return;}if(action==='simulate-upload'||action==='simulate-version'){processUpload(action==='simulate-version');return;}if(action==='build'){build();return;}if(action==='simulate-build'){const name=$('#app-name').value.trim();if(!name){$('#app-name').focus();return;}$('#modal').close();state.newApp=true;go('builder');toast('Demo app assembled. No backend or AI requests were made.');return;}if(action==='folder'){modal('New dataset folder','<p>Organize your project datasets without changing their references.</p><label class="field">Folder name<input id="folder-name" placeholder="e.g. Monthly close"></label>',button('Create folder','create-folder',true,'folder'));return;}if(action==='create-folder'){const name=$('#folder-name').value.trim();if(!name||['All datasets','Payments','Treasury','Reference',...state.folders].includes(name)){toast('Choose a new, unique folder name.');return;}state.folders.push(name);state.folder=name;$('#modal').close();go('data');render();return;}if(action==='publish'){modal('Publish Reconciliation review',`<p>A proposed delivery flow using the publishing capabilities already in the studio.</p><label class="field">Access<select id="publish-access"><option>Private · project members</option><option>Password protected</option><option>Public link</option></select></label><div class="list-item">${icon('check')}<span>Dataset version ready</span>${badge('v3','green')}</div><div class="list-item">${icon('check')}<span>Backend contracts available</span>${badge('Ready','green')}</div><div class="list-item">${icon('check')}<span>App preview reviewed</span>${badge('Demo','blue')}</div>`,`<small>Prototype only · no deployment</small>${button('Publish demo','publish-demo',true,'arrow')}`);return;}if(action==='publish-demo'){state.published=true;$('#modal').close();render();toast('Demo app marked published. Nothing was deployed.');return;}if(action==='download'){const blob=new Blob(['transaction_id,counterparty,amount,status\nTX-DEMO,Example Company,1250,Matched\n'],{type:'text/csv'});const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='command-prototype-sample.csv';link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000);toast('Downloaded a synthetic CSV sample, not an original workbook.');return;}if(action==='refine'){const prompt=$('#refine-input').value.trim();if(!prompt){$('#refine-input').focus();return;}toast('Refinement captured in this prototype. No AI call was made.');$('#refine-input').value='';return;}if(action==='transaction-detail'){modal('Transaction TX-024679',`<p>Synthetic exception detail</p><div class="property"><span>Counterparty</span><b>Harbor & Co.</b></div><div class="property"><span>Amount</span><b>USD 18,750.00</b></div><div class="property"><span>Issue</span><b>Missing settlement reference</b></div><div class="info-note">${icon('link')} Source: Reconciliation — October · Transactions · v3</div>`,button('Close','close'));return;}if(action==='workflow'||action==='new-automation'){modal('Daily reconciliation',`<p>Proposed placement for the existing workflow editor. Dataset events connect analytics to automation.</p><div class="lineage"><div class="card lineage-node"><b>Dataset ready</b><small>Version 3 processed</small></div><span>→</span><div class="card lineage-node"><b>Find exceptions</b><small>Reconcile payments</small></div><span>→</span><div class="card lineage-node"><b>Write report</b><small>Versioned result</small></div></div><div class="info-note">${icon('info')} Illustrative workflow. These dataset-trigger steps are not connected to live services.</div>`,button('Close','close'));return;}toast('Concept control: '+({'filter-exceptions':'the full app would open its searchable exception list.','activity-filter':'filter activity by source, status, or date.','environments':'existing dev and prod controls would live here.','access':'enterprise membership and permissions remain future work.'}[action]||action));});
document.addEventListener('input',e=>{if(e.target.id==='dataset-search'){state.query=e.target.value;$('#dataset-rows').innerHTML=datasetRows();}if(e.target.id==='palette-search'){const q=e.target.value.toLowerCase();document.querySelectorAll('[data-palette-to]').forEach(b=>b.hidden=!b.textContent.toLowerCase().includes(q));}});
document.addEventListener('dragover',e=>{if(e.target.closest('#dropzone'))e.preventDefault();});
document.addEventListener('drop',e=>{const zone=e.target.closest('#dropzone');if(!zone)return;e.preventDefault();const file=e.dataTransfer?.files[0];if(!file)return;if(!/\.(xlsx?|csv|parquet)$/i.test(file.name)){toast('Choose an Excel, CSV, or Parquet dataset.');return;}const input=$('#upload-file');const transfer=new DataTransfer();transfer.items.add(file);input.files=transfer.files;input.dispatchEvent(new Event('change',{bubbles:true}));});
document.addEventListener('change',e=>{if(e.target.id==='sheet-select'){state.sheet=e.target.value;render();}if(e.target.id==='upload-file'&&e.target.files[0])$('#upload-name').value=e.target.files[0].name.replace(/\.[^.]+$/,'');});
$('#theme-toggle').onclick=()=>{const dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';try{localStorage.setItem('command-vision-theme',dark?'dark':'light');}catch{}};
$('#search-button').onclick=palette;$('#help-button').onclick=()=>modal('About this concept','<p>This is a standalone HTML prototype of Command’s proposed product organization. All datasets, metrics, apps, and activity are synthetic. No files are uploaded, AI called, or applications deployed.</p><p>Use the top switch to compare today’s navigation with the proposed workspace. Explore Data → workbook sheets → Build an app → Publish.</p>',button('Explore','close',true));$('#workspace-button').onclick=()=>toast('Payments Operations is the sample project for this concept.');$('#env-toggle').onclick=()=>toast('Prototype environment: Development. No live environment is selected.');document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();palette();}});$('#modal').addEventListener('click',e=>{if(e.target===$('#modal'))$('#modal').close();});window.addEventListener('hashchange',route);try{document.documentElement.dataset.theme=localStorage.getItem('command-vision-theme')||'light';}catch{}route();

</script>
</body></html>
