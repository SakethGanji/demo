<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Studio Workbench Mockup</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a scene stepper over one app frame (chat left, live panel right), with design notes under it. */
:root {
  --bg: #eef1f4; --surface: #ffffff; --surface-2: #f4f6f8; --fg: #16202a; --muted: #5a6674; --line: #d8dee5;
  --accent: #1d5d8a; --accent-fg: #ffffff; --accent-soft: #e2edf6;
  --ok: #1b7a4e; --ok-soft: #e1f3ea; --warn: #9a5a00; --warn-soft: #fbefd9; --bad: #b3261e; --bad-soft: #fbe5e3;
  --ring: #e8a200; --you: #8a3ab9;
  --font: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1319; --surface: #151c24; --surface-2: #1b242e; --fg: #e5eaef; --muted: #93a0ad; --line: #2a3541;
  --accent: #6cb0df; --accent-fg: #0b1620; --accent-soft: #1a3346;
  --ok: #4fc48c; --ok-soft: #15302a; --warn: #e3a440; --warn-soft: #33270f; --bad: #f07a70; --bad-soft: #3a1c1b;
  --ring: #ffc53d; --you: #c48bec; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0e1319; --surface: #151c24; --surface-2: #1b242e; --fg: #e5eaef; --muted: #93a0ad; --line: #2a3541;
  --accent: #6cb0df; --accent-fg: #0b1620; --accent-soft: #1a3346;
  --ok: #4fc48c; --ok-soft: #15302a; --warn: #e3a440; --warn-soft: #33270f; --bad: #f07a70; --bad-soft: #3a1c1b;
  --ring: #ffc53d; --you: #c48bec; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 14px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 40px }
.wrap { max-width: 1320px; margin: 0 auto; display: grid; gap: 16px }
button { font: inherit; color: inherit; cursor: pointer }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }

header.top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px }
header.top h1 { font-size: 20px; font-weight: 600; margin: 0; text-wrap: balance }
header.top p { margin: 0; color: var(--muted); max-width: 70ch }
.tag { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted) }

nav.scenes { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px }
nav.scenes button { flex: 0 0 auto; display: flex; gap: 8px; align-items: center; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 6px 12px 6px 6px; white-space: nowrap }
nav.scenes button .n { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); font-size: 12px; font-variant-numeric: tabular-nums }
nav.scenes button .new { font-size: 10px; letter-spacing: .05em; color: var(--you); font-weight: 600 }
nav.scenes button[aria-current="true"] { border-color: var(--accent); background: var(--accent-soft) }
nav.scenes button[aria-current="true"] .n { background: var(--accent); color: var(--accent-fg) }

.frame { display: grid; grid-template-columns: minmax(300px, 380px) minmax(0, 1fr); border: 1px solid var(--line); border-radius: 12px; background: var(--surface); overflow: hidden; min-height: 640px }
.appbar { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--line) }
.appbar .brand { font-weight: 600 } .appbar .crumb { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0 } .appbar > * { white-space: nowrap } .appbar .sp { flex: 1 }
.appbar .me { width: 28px; height: 28px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-size: 12px; font-weight: 600 }
.appbar .home { border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 4px 10px }

.chat { display: flex; flex-direction: column; border-right: 1px solid var(--line); min-width: 0; background: var(--surface-2) }
.msgs { flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; max-height: 680px }
.msg { display: grid; gap: 8px; min-width: 0 }
.msg.you { justify-self: end; max-width: 88%; background: var(--accent); color: var(--accent-fg); padding: 9px 12px; border-radius: 12px 12px 2px 12px }
.msg.agent .who { font-size: 12px; color: var(--muted) }
.msg.agent .body { background: var(--surface); border: 1px solid var(--line); border-radius: 2px 12px 12px 12px; padding: 10px 12px; display: grid; gap: 8px; min-width: 0 }
.msg p { margin: 0 }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px }
.steps li { display: grid; grid-template-columns: 18px 1fr; gap: 6px; align-items: start; color: var(--muted); font-size: 13px; transition: opacity .2s }
.steps li .i { width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center; font-size: 10px; margin-top: 2px }
.steps li.done .i { background: var(--ok-soft); color: var(--ok) }
.steps li.fail .i { background: var(--bad-soft); color: var(--bad) }
.steps li.run { color: var(--fg) }
.steps li.run .i { border: 2px solid var(--accent); border-top-color: transparent; animation: spin .9s linear infinite }
.steps li.wait { opacity: .45 } .steps li.wait .i { border: 1.5px solid var(--muted) }
.steps li.yours .i { background: color-mix(in srgb, var(--you) 18%, transparent); color: var(--you) }
@keyframes spin { to { transform: rotate(360deg) } }
.details-btn { justify-self: start; border: none; background: none; color: var(--accent); padding: 0; font-size: 12px }
pre.code { margin: 0; font-family: var(--mono); font-size: 12px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px; overflow-x: auto; white-space: pre; color: var(--fg) }
.chips { display: flex; flex-wrap: wrap; gap: 6px }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 10px; font-size: 13px; text-align: left }
.chip:hover { border-color: var(--accent) }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 12px; font-weight: 500 }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent) }
.btn.done { background: var(--ok-soft); color: var(--ok); border-color: transparent; cursor: default }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.composer { border-top: 1px solid var(--line); padding: 12px; display: flex; gap: 8px; background: var(--surface) }
.composer input { flex: 1; min-width: 0; font: inherit; color: var(--fg); background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px }
.timestamp { font-size: 11px; color: var(--muted); text-align: center }

.panel { min-width: 0; display: flex; flex-direction: column }
.panel-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 12px 16px; border-bottom: 1px solid var(--line) }
.panel-head h2 { margin: 0; font-size: 15px; font-weight: 600 }
.panel-head .src { color: var(--muted); font-size: 12px }
.panel-head .sp { flex: 1 }
.panel-body { padding: 16px; display: grid; gap: 14px; align-content: start; min-width: 0 }
.pill { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 2px 8px; font-size: 12px; font-weight: 500; white-space: nowrap }
.pill.ok { background: var(--ok-soft); color: var(--ok) } .pill.warn { background: var(--warn-soft); color: var(--warn) }
.pill.bad { background: var(--bad-soft); color: var(--bad) } .pill.info { background: var(--accent-soft); color: var(--accent) }
.pill.plain { background: var(--surface-2); color: var(--muted) }
.pill.you { background: color-mix(in srgb, var(--you) 16%, transparent); color: var(--you) }

.filters { display: flex; flex-wrap: wrap; gap: 6px; align-items: center }
.fchip { border: 1px dashed var(--accent); color: var(--accent); background: var(--accent-soft); border-radius: 6px; padding: 3px 8px; font-size: 12px }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px }
table { border-collapse: collapse; width: 100%; font-size: 13px }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap }
th { font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); font-weight: 500; background: var(--surface-2) }
tr:last-child td { border-bottom: none }
td.num { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--mono) }
td.mono { font-family: var(--mono); font-size: 12px }
td.masked { color: var(--muted); font-family: var(--mono) }
tr.changed td { background: var(--warn-soft) } tr.added td { background: var(--ok-soft) }
.banner { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; border-radius: 8px; padding: 10px 12px }
.banner.warn { background: var(--warn-soft); border: 1px solid var(--warn) }
.banner.ok { background: var(--ok-soft); border: 1px solid var(--ok) }
.banner.bad { background: var(--bad-soft); border: 1px solid var(--bad) }
.foot { color: var(--muted); font-size: 12px }
.caption { font-size: 12px; color: var(--muted) }
.section-h { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 }

/* the browser */
.browser { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface) }
.browser .bar { display: flex; align-items: center; gap: 8px; padding: 7px 10px; background: var(--surface-2); border-bottom: 1px solid var(--line) }
.browser .dots { display: flex; gap: 4px } .browser .dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); display: block }
.browser .url { flex: 1; min-width: 0; font-family: var(--mono); font-size: 12px; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.browser .live { font-size: 11px; color: var(--bad); font-weight: 600; letter-spacing: .05em; white-space: nowrap }
.stage { position: relative; min-height: 330px }
.site { padding: 16px; display: grid; gap: 12px; font-size: 13px; align-content: start }
.sitehead { display: flex; justify-content: space-between; align-items: center; padding-bottom: 10px; border-bottom: 1px solid var(--line) }
.sitehead b { font-weight: 600 }
.sitenav { display: flex; gap: 16px; flex-wrap: wrap }
.sitenav span { color: var(--accent); border-bottom: 2px solid transparent; padding-bottom: 2px }
.sitenav span.on { color: var(--fg); border-bottom-color: var(--accent) }
.field { display: grid; gap: 4px; max-width: 360px }
.field label { font-size: 12px; color: var(--muted) }
.field .hint { font-size: 11px; color: var(--muted) }
.inp { border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; background: var(--surface-2); min-height: 34px; font-variant-numeric: tabular-nums; transition: border-color .15s, box-shadow .15s }
.inp.focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft) }
.inp.focus .val::after { content: ""; display: inline-block; width: 1px; height: 1em; background: var(--fg); vertical-align: -2px; margin-left: 1px; animation: blink 1s steps(1) infinite }
@keyframes blink { 50% { opacity: 0 } }
.fake-btn { display: inline-block; border-radius: 6px; padding: 7px 14px; background: var(--fg); color: var(--bg); font-weight: 500; transition: transform .1s, box-shadow .1s }
.fake-btn.ghost { background: var(--surface-2); color: var(--fg); border: 1px solid var(--line) }
.pressed { transform: scale(.95); box-shadow: 0 0 0 5px var(--accent-soft) }
.ringed { outline: 3px solid var(--ring); outline-offset: 3px; border-radius: 6px }
.ringnote { font-size: 11px; color: var(--warn); font-weight: 600 }
.toast { justify-self: start; background: var(--fg); color: var(--bg); border-radius: 8px; padding: 6px 10px; font-size: 12px }
.cursor { position: absolute; left: 24px; top: 24px; z-index: 5; pointer-events: none; display: flex; align-items: flex-start;
  transition: left .48s cubic-bezier(.3,.7,.2,1), top .48s cubic-bezier(.3,.7,.2,1) }
.cursor svg { width: 18px; height: 18px; filter: drop-shadow(0 1px 1px rgba(0,0,0,.25)) }
.cursor .who { background: var(--accent); color: var(--accent-fg); font-size: 10px; font-weight: 600; padding: 1px 6px; border-radius: 4px; margin: 14px 0 0 -2px; white-space: nowrap }
.cursor.you .who { background: var(--you) }
.mini { font-size: 12px } .mini .site { padding: 10px; gap: 8px; font-size: 12px }

.twocol { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px }
.tile { border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: grid; gap: 4px }
.tile .k { font-size: 12px; color: var(--muted) } .tile .v { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums }
.toolbar { display: flex; gap: 6px; flex-wrap: wrap } .toolbar span { border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; font-size: 12px }

.list { display: grid; border: 1px solid var(--line); border-radius: 8px; overflow: hidden }
.list .it { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 10px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap }
.list .it:last-child { border-bottom: none }
.list .it .t { font-weight: 500 } .list .it .s { font-size: 12px; color: var(--muted) }
.map .it { animation: none }
.map .it.fresh { animation: pop .4s ease both }
@keyframes pop { from { background: var(--accent-soft) } to { background: transparent } }
.digest { border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 8px; background: var(--surface-2) }

.home-hero { padding: 28px 20px 8px; display: grid; gap: 12px }
.home-hero h2 { margin: 0; font-size: 22px; font-weight: 600; text-wrap: balance }
.bigbox { display: flex; gap: 8px; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 8px }
.bigbox input { flex: 1; min-width: 0; border: none; background: transparent; font: inherit; font-size: 15px; color: var(--fg); padding: 6px }
.starter { display: grid; gap: 2px; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px }
.starter small { color: var(--muted) } .starter:hover { border-color: var(--accent) }
.starters { display: grid; gap: 8px; padding: 0 20px 20px }

.ext-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px }
.ext { border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 10px; align-content: start }
.ext h3 { margin: 0; font-size: 15px; display: flex; justify-content: space-between; gap: 8px; align-items: center }
.ext dl { margin: 0; display: grid; grid-template-columns: 56px 1fr; gap: 6px 10px; font-size: 13px }
.ext dt { color: var(--muted); font-size: 11px; letter-spacing: .05em; text-transform: uppercase; padding-top: 2px }
.ext dd { margin: 0 }
.ext.avail { background: var(--surface-2) }
.settings-nav { padding: 16px; display: grid; gap: 4px; align-content: start }
.settings-nav div { padding: 8px 10px; border-radius: 8px; color: var(--muted) }
.settings-nav div.on { background: var(--surface); color: var(--fg); font-weight: 500; border: 1px solid var(--line) }

.chart { width: 100%; height: auto; display: block }
.chart .b { fill: var(--line) } .chart .h { fill: var(--bad) } .chart text { fill: var(--muted); font-size: 11px; font-family: var(--font) }
.recipe { border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 8px }
.recipe ol { margin: 0; padding-left: 20px; display: grid; gap: 4px }
.blank { background: color-mix(in srgb, var(--you) 16%, transparent); color: var(--you); border-radius: 4px; padding: 0 5px; font-weight: 500 }

.notes { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: start; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 16px }
.notes h3 { margin: 0 0 6px; font-size: 14px }
.notes ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; max-width: 78ch }
.notes .nav { display: flex; gap: 8px; flex-wrap: wrap }

@media (max-width: 900px) {
  .frame { grid-template-columns: minmax(0, 1fr) }
  .chat { border-right: none; border-bottom: 1px solid var(--line) }
  .msgs { max-height: none }
  .twocol, .ext-grid { grid-template-columns: minmax(0, 1fr) }
  .notes { grid-template-columns: minmax(0, 1fr) }
}
.fadein { animation: fadein .3s ease both }
@keyframes fadein { from { opacity: 0; transform: translateY(4px) } to { opacity: 1; transform: none } }
@media (prefers-reduced-motion: reduce) { .fadein, .map .it.fresh, .steps li.run .i { animation: none } .cursor { transition: none } }
/* ════ Studio glass layer: the workflow-studio design standard (apps/workflow-studio/DESIGN-STANDARD.md + src/index.css).
   The page is transparent over a calm backdrop; every box is glass with a lit rim (no border); a box inside glass is a
   well; controls that hold a value are recessed; the chosen thing is raised; primary is the indigo→cyan brand fill.
   Cards never blur; only the chrome (top bar, ask bar) and overlays (toasts) blur. Labels are sentence case. ════ */
:root {
  --canvas: #eef1f4; --fg: #0d1430; --muted: #363f63; --faint: #5a6282;
  --hairline: rgb(0 0 0 / .06);
  --primary: #5250e9; --primary-text: #4b48d6; --ring-ui: #6d6bf0; --brand-1: #5250e9; --brand-2: #0aa2dc;
  --brand-soft: color-mix(in srgb, #5250e9 9%, transparent);
  --success: #16a34a; --success-text: #137538; --success-soft: color-mix(in srgb, #16a34a 10%, transparent);
  --warning: #d97706; --warning-text: #925305; --warning-soft: color-mix(in srgb, #d97706 11%, transparent);
  --destructive: #c82828; --destructive-soft: color-mix(in srgb, #c82828 9%, transparent);
  --ai: #7c5fe6; --ai-text: #6447d1;
  --glass-fill: rgb(255 255 255 / .46); --glass-fill-hover: rgb(255 255 255 / .56);
  --glass-strong: rgb(255 255 255 / .78);
  --glass-sheen: linear-gradient(180deg, rgb(255 255 255 / .40), rgb(255 255 255 / 0) 46%);
  --hi: rgb(255 255 255 / .95); --shade: rgb(30 40 90 / .07); --edge: rgb(16 24 56 / .07);
  --glass-depth: 0 1px 2px rgb(16 24 56 / .05), 0 14px 34px -14px rgb(16 24 56 / .16);
  --well: rgb(255 255 255 / .34); --recess: rgb(0 0 0 / .04);
  --raised-hi: inset 0 1px 0 rgb(255 255 255 / 1); --raised-ring: rgb(16 24 56 / .06);
  --raised-contact: 0 1px 2px rgb(16 24 56 / .06), 0 6px 14px -8px rgb(16 24 56 / .12);
  --chrome-fill: rgb(255 255 255 / .46);
  --overlay-fill: rgb(255 255 255 / .74);
  --overlay-shadow: inset 0 1px 0 var(--hi), 0 0 0 1px var(--edge), 0 2px 4px rgb(16 24 56 / .05), 0 20px 48px -16px rgb(16 24 56 / .22);
  --site-bg: #ffffff; --site-2: #f5f6f8; --site-line: #e2e5ea;
  --etch: 0 1px 0 rgb(255 255 255 / .8);
  --sky:
    radial-gradient(55% 38% at 12% 0%, rgb(255 255 255 / .85), transparent 70%),
    radial-gradient(50% 34% at 88% 4%, rgb(214 228 240 / .55), transparent 72%),
    radial-gradient(75% 42% at 50% 52%, rgb(120 134 156 / .13), transparent 72%),
    radial-gradient(60% 34% at 80% 92%, rgb(203 213 225 / .35), transparent 72%),
    linear-gradient(180deg, #f3f6f8 0%, #edf0f3 50%, #f2f4f6 100%);
  --font: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --canvas: #07070a; --fg: #f4f4f7; --muted: #a3a3af; --faint: #6e6e7a;
  --hairline: rgb(255 255 255 / .06);
  --primary: #5b57e0; --primary-text: #b4acff; --ring-ui: #9c8fff; --brand-1: #7b72ff; --brand-2: #40d6e8;
  --brand-soft: color-mix(in srgb, #9c8fff 13%, transparent);
  --success: #22c55e; --success-text: #7fd6a0; --success-soft: color-mix(in srgb, #4ade80 12%, transparent);
  --warning: #f59e0b; --warning-text: #fbbf24; --warning-soft: color-mix(in srgb, #f59e0b 16%, transparent);
  --destructive: #f87171; --destructive-soft: color-mix(in srgb, #f87171 13%, transparent);
  --ai: #a08bff; --ai-text: #c0b2ff;
  --glass-fill: rgb(10 10 14 / .55); --glass-fill-hover: rgb(22 22 30 / .60);
  --glass-strong: rgb(34 34 46 / .80);
  --glass-sheen: linear-gradient(180deg, rgb(255 255 255 / .045), rgb(255 255 255 / 0) 46%);
  --hi: rgb(255 255 255 / .10); --shade: rgb(0 0 0 / .35); --edge: rgb(255 255 255 / .03);
  --glass-depth: 0 1px 2px rgb(0 0 0 / .40), 0 18px 40px -16px rgb(0 0 0 / .60);
  --well: rgb(255 255 255 / .045); --recess: rgb(255 255 255 / .05);
  --raised-hi: inset 0 1px 0 rgb(255 255 255 / .08); --raised-ring: rgb(255 255 255 / .045);
  --raised-contact: 0 1px 2px rgb(0 0 0 / .30), 0 6px 14px -8px rgb(0 0 0 / .45);
  --chrome-fill: rgb(10 10 14 / .55);

/* recipes, composed from the tokens (both modes) */
:root {
  --bg: var(--canvas); --line: var(--hairline);
  --accent: var(--primary); --accent-fg: #ffffff; --accent-soft: var(--brand-soft);
  --ok: var(--success-text); --ok-soft: var(--success-soft);
  --warn: var(--warning-text); --warn-soft: var(--warning-soft);
  --bad: var(--destructive); --bad-soft: var(--destructive-soft);
  --ring: var(--warning); --you: var(--ai);
  --focus: 0 0 0 2px color-mix(in srgb, var(--ring-ui) 45%, transparent);
  --brand-gradient: linear-gradient(135deg, var(--brand-1), var(--brand-2));
  --glass-elevation: inset 0 1px 0 var(--hi), inset 0 -16px 28px -24px var(--shade), 0 0 0 1px var(--edge), var(--glass-depth);
  --inner-elevation: var(--raised-hi), 0 0 0 1px var(--raised-ring), var(--raised-contact);
  --r-panel: 20px; --r-well: 12px; --r-ctl: 8px; --r-chip: 6px;
  --ease-out: cubic-bezier(.16, 1, .3, 1); --ease-spring: cubic-bezier(.3, 1.3, .5, 1);
}
html { background: var(--canvas) }
body { background: var(--canvas); font-family: var(--font); font-size: 13px; line-height: 1.5;
  font-feature-settings: "cv01", "ss03"; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased }
body::before { content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none; background: var(--sky) }
.wrap { position: relative; z-index: 1 }
code, pre, .mono, td.mono, td.num, .url { font-family: var(--mono) }
button:focus-visible, input:focus-visible { outline: none; box-shadow: var(--focus) }

.pill, .fchip, .chip, .pin, .sharedtag { border: 0; box-shadow: inset 0 0 0 .5px color-mix(in srgb, currentColor 22%, transparent); border-radius: var(--r-chip) }
.pill.ok { background: var(--success-soft); color: var(--success-text) }
.pill.warn { background: var(--warning-soft); color: var(--warning-text) }
.pill.bad { background: var(--destructive-soft); color: var(--destructive) }
.pill.info, .fchip, .pin { background: var(--brand-soft); color: var(--primary-text) }
.pill.plain, .chip { background: var(--recess); color: var(--muted) }
.pill.you, .blank { background: color-mix(in srgb, var(--ai) 13%, transparent); color: var(--ai-text) }
.stage, .browser.mini > :not(.bar) { background: var(--site-bg); text-shadow: none }
.site { --line: var(--site-line); --surface-2: var(--site-2) }
.site .inp { border: 1px solid var(--site-line); background: var(--site-2) }
.site .inp.focus { border-color: var(--primary-text); box-shadow: var(--focus) }
.site .sitenav span { color: #2a5fc4 }
.site .sitenav span.on { color: var(--fg); border-bottom-color: #2a5fc4 }
.site .tablewrap { background: transparent; box-shadow: 0 0 0 1px var(--site-line); border-radius: 6px }
.site .tile { background: transparent; box-shadow: 0 0 0 1px var(--site-line); border-radius: 6px }
.cursor .who { background: var(--primary); color: #fff; border-radius: var(--r-chip) }
.cursor.you .who { background: var(--ai) }
.lv { display: grid; gap: 8px; min-width: 0 }
.lv .browser { transition: box-shadow .2s var(--ease-out) }
.lv.you .browser { box-shadow: 0 0 0 3px var(--primary), 0 0 0 7px color-mix(in srgb, var(--primary) 25%, transparent) }
.drive { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between }
.dstat { display: inline-flex; gap: 8px; align-items: center; font-size: 13px; font-weight: 500 }
.dstat::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--success); animation: pulse 1.6s ease-in-out infinite }
.lv.you .dstat::before { background: var(--primary); animation: none }
@keyframes pulse { 50% { opacity: .35 } }
.lv .foot { font-size: 12px; color: var(--muted) }
.conn .tool { white-space: normal }
.cmp { width: 100%; border-collapse: collapse; font-size: 12.5px }
.cmp th { text-align: left; font-weight: 500; color: var(--muted); font-size: 11.5px; padding: 2px 8px 4px 0 }
.cmp td { padding: 4px 8px 4px 0; vertical-align: top }
.cmp tr.mis td { background: var(--warn-soft) }
.cmp tr.mis td:first-child { box-shadow: inset 2px 0 0 var(--warn) }
.env { display: inline-flex; align-items: center; border-radius: 6px; padding: 2px 8px; font-size: 11.5px; font-weight: 650; letter-spacing: .02em; text-shadow: none }
.env.uat { background: var(--warn-soft); color: var(--warn); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--warn) 45%, transparent) }
.env.prod { background: var(--bad); color: #fff; letter-spacing: .06em }
/* ════ Studio Workbench layer ════ */
[hidden] { display: none !important }
body { margin: 0; padding: 0 !important; font-size: 13px; overflow-x: hidden }
#app { position: relative; z-index: 1; height: 100vh; min-height: 640px; display: flex; flex-direction: column; gap: 8px; padding: 8px; max-width: 1760px; margin: 0 auto }
.glass { background-color: var(--glass-fill); background-image: var(--glass-sheen); box-shadow: var(--glass-elevation); text-shadow: var(--etch); border-radius: var(--r-panel) }
.btn { border: 0; background: var(--recess); border-radius: var(--r-ctl); padding: 5px 11px; font-weight: 500; font-size: 12.5px; transition: background-color 140ms var(--ease-out) }
.btn:hover { background: color-mix(in srgb, var(--fg) 9%, transparent) }
.btn.primary { background: var(--brand-gradient); color: #fff; box-shadow: inset 0 .5px 0 rgb(255 255 255 / .35), 0 4px 14px -6px rgb(59 91 230 / .5) }
.btn.primary:hover { filter: brightness(1.06); background: var(--brand-gradient) }
.btn.danger { color: var(--destructive) }
.btn.done { background: var(--success-soft); color: var(--success-text); cursor: default }
.btn.sm { padding: 3px 8px; font-size: 12px }
.btn[disabled] { opacity: .5; cursor: default }
.btn.pressed { box-shadow: var(--focus) }
.linkbtn { border: 0; background: none; padding: 0; color: var(--primary-text); font-size: 12px; text-decoration: underline; text-underline-offset: 2px }

/* top bar */
.top { position: relative; z-index: 30; display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-radius: 16px; flex: 0 0 auto;
  background-color: var(--chrome-fill); background-image: var(--glass-sheen); -webkit-backdrop-filter: blur(32px) saturate(190%); backdrop-filter: blur(32px) saturate(190%);
  box-shadow: var(--glass-elevation); text-shadow: var(--etch) }
.logo { width: 20px; height: 20px; border-radius: 6px; background: var(--brand-gradient); flex: 0 0 auto }
.wordmark { font-weight: 650; letter-spacing: -.02em; font-size: 15px }
.seg { display: inline-flex; background: var(--recess); border-radius: 10px; padding: 2px }
.seg button { border: 0; background: transparent; padding: 4px 12px; border-radius: 8px; color: var(--muted); font-weight: 500; font-size: 12.5px }
.seg button[aria-pressed="true"] { background: var(--glass-strong); color: var(--fg); box-shadow: inset 0 1px 0 var(--hi), 0 0 0 1px var(--raised-ring) }
.cmdwrap { position: relative; flex: 1; max-width: 640px; margin: 0 auto; min-width: 0 }
.cmd { display: flex; align-items: center; gap: 8px; background: var(--recess); border-radius: 12px; padding: 6px 10px; box-shadow: inset 0 0 0 1px var(--raised-ring) }
.cmd:focus-within { box-shadow: var(--focus), inset 0 0 0 1px var(--raised-ring) }
.cmd input { flex: 1; min-width: 0; border: 0; background: transparent; font: inherit; font-size: 13.5px; color: var(--fg); outline: none; box-shadow: none !important }
.cmd .spark { color: var(--primary-text) }
kbd { font-family: var(--mono); font-size: 11px; color: var(--muted); background: var(--well); border-radius: 5px; padding: 1px 6px; box-shadow: 0 0 0 1px var(--raised-ring) }
.sug { position: absolute; left: 0; right: 0; top: calc(100% + 8px); z-index: 40; background-color: var(--overlay-fill); -webkit-backdrop-filter: blur(28px) saturate(180%); backdrop-filter: blur(28px) saturate(180%);
  box-shadow: var(--overlay-shadow); border-radius: 14px; padding: 6px; display: grid; gap: 2px }
.sug h4 { margin: 6px 10px 2px; font-size: 11.5px; font-weight: 600; color: var(--muted) }
.sug button { display: flex; gap: 10px; align-items: baseline; width: 100%; text-align: left; border: 0; background: transparent; padding: 8px 10px; border-radius: 9px; font-size: 13px }
.sug button:hover { background: var(--recess) }
.sug .ico { flex: 0 0 auto }
.top .sp { flex: 1 }
.me { width: 28px; height: 28px; border-radius: 50%; background: var(--brand-gradient); color: #fff; display: grid; place-items: center; font-size: 11.5px; font-weight: 650; flex: 0 0 auto }
.envbtn { cursor: default }

/* workspace grid */
.ws { flex: 1; min-height: 0; display: grid; grid-template-columns: 52px auto minmax(0, 1fr) 304px; grid-template-rows: minmax(0, 1fr) auto; gap: 8px }
.rail { grid-column: 1; grid-row: 1 / 3; display: flex; flex-direction: column; gap: 4px; padding: 8px 6px; align-items: center }
.rail button { width: 38px; height: 38px; border-radius: 10px; border: 0; background: transparent; font-size: 17px; position: relative }
.rail button:hover { background: var(--recess) }
.rail button[aria-pressed="true"] { background: var(--glass-strong); box-shadow: inset 0 1px 0 var(--hi), 0 0 0 1px var(--raised-ring) }
.rail .bd { position: absolute; top: 2px; right: 1px; min-width: 15px; height: 15px; border-radius: 8px; background: var(--warning); color: #1a1000; font-size: 10px; font-weight: 700; display: grid; place-items: center; padding: 0 3px }
.expl { grid-column: 2; grid-row: 1 / 3; width: 240px; overflow: auto; padding: 12px 10px; display: block; min-height: 0 }
.expl h3 { margin: 14px 4px 4px; font-size: 11.5px; font-weight: 600; color: var(--muted); display: flex; justify-content: space-between }
.expl h3:first-child { margin-top: 2px }
.ex { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; border: 0; background: transparent; padding: 5px 6px; border-radius: 8px; font-size: 12.5px; min-width: 0 }
.ex:hover { background: var(--recess) }
.ex[aria-current="true"] { background: var(--glass-strong); box-shadow: 0 0 0 1px var(--raised-ring) }
.ex .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.ex .nm.mono { font-size: 11.5px }
.ex .meta { color: var(--muted); font-size: 11px; white-space: nowrap }
.ex.sub { padding-left: 22px }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; background: var(--faint) }
.dot.run { background: var(--success); animation: pulse 1.6s ease-in-out infinite }
.dot.need { background: var(--warning) }
.dot.done { background: var(--primary-text) }
.dot.sched { background: var(--ai) }
.exin { width: 100%; border: 0; background: var(--recess); border-radius: 9px; padding: 7px 10px; font: inherit; color: var(--fg); margin-bottom: 8px }
.faintline { color: var(--muted); font-size: 11.5px; padding: 4px 6px }

/* editor */
.ed { grid-column: 3; grid-row: 1; display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden; position: relative }
.tabs { display: flex; gap: 2px; padding: 6px 8px 0; overflow-x: auto; flex: 0 0 auto; scrollbar-width: none; border-bottom: 1px solid var(--hairline) }
.tab { display: flex; align-items: center; gap: 6px; padding: 6px 6px 6px 11px; border-radius: 10px 10px 0 0; border: 0; background: transparent; color: var(--muted); white-space: nowrap; font-size: 12.5px; cursor: pointer }
.tab:hover { background: var(--recess) }
.tab[aria-selected="true"] { background: var(--glass-strong); color: var(--fg); box-shadow: inset 0 1px 0 var(--hi), 0 0 0 1px var(--raised-ring) }
.tab .x { width: 18px; height: 18px; border-radius: 5px; display: grid; place-items: center; font-size: 12px; opacity: .6; border: 0; background: transparent; color: inherit; padding: 0 }
.tab .x:hover { background: var(--recess); opacity: 1 }
.tab .lvdot { width: 6px; height: 6px; border-radius: 50%; background: var(--destructive); animation: pulse 1.6s ease-in-out infinite }
.pw { flex: 1; min-height: 0; position: relative }
.panes { position: absolute; inset: 0; overflow: auto }
.pane { padding: 14px 16px 18px; display: grid; gap: 12px; align-content: start; min-width: 0 }
.empty { padding: 48px 20px; text-align: center; color: var(--muted); display: grid; gap: 6px; justify-items: center }
.empty b { color: var(--fg); font-size: 15px }
.snapov { position: absolute; inset: 0; z-index: 8; overflow: auto; background-color: var(--glass-strong); backdrop-filter: blur(6px) }
.snapov .pane > * { pointer-events: none }
.snaptag { position: sticky; top: 0; z-index: 2; display: inline-flex; margin: 10px 0 0 16px; gap: 6px }

/* editor content */
.hd { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px }
.hd h3 { margin: 0; font-size: 16px; font-weight: 650; letter-spacing: -.02em }
.hd .sp { flex: 1 }
.code { font-family: var(--mono); font-size: 12.5px; background: var(--well); border-radius: var(--r-well); padding: 12px 14px; box-shadow: inset 0 0 0 1px var(--raised-ring); white-space: pre; overflow-x: auto; margin: 0; line-height: 1.6 }
.code .kw { color: var(--primary-text); font-weight: 500 } .code .str { color: var(--success-text) } .code .cm { color: var(--muted) }
.code.typing::after { content: ""; display: inline-block; width: 7px; height: 14px; background: var(--primary-text); vertical-align: -2px; animation: blink 1s steps(1) infinite }
.well { background: var(--well); border-radius: var(--r-well); padding: 12px 14px; box-shadow: inset 0 0 0 1px var(--raised-ring); display: grid; gap: 8px }
.grid { width: 100%; border-collapse: collapse; font-size: 12.5px }
.grid th { text-align: left; font-weight: 500; color: var(--muted); font-size: 11.5px; padding: 6px 10px; box-shadow: inset 0 -1px 0 var(--hairline); background: transparent; text-transform: none; letter-spacing: 0 }
.grid td { padding: 8px 10px; box-shadow: inset 0 -1px 0 var(--hairline); border: 0; white-space: nowrap; vertical-align: middle }
.grid tr:last-child td { box-shadow: none }
.grid td.num { text-align: right }
.grid tr.mis td { background: var(--warning-soft) }
.grid tr.mis td:first-child { box-shadow: inset 3px 0 0 var(--warning) }
.gwrap { overflow-x: auto; border-radius: var(--r-well) }
.cmb { border: 0; background: transparent; border-radius: 7px; padding: 2px 7px; font-size: 12px; color: var(--muted); display: inline-flex; gap: 4px; align-items: center }
.cmb:hover, tr:hover .cmb { background: var(--recess); color: var(--fg) }
.cmb.has { color: var(--primary-text); background: var(--brand-soft) }
.md h1 { font-size: 20px; letter-spacing: -.03em; margin: 0 0 4px; font-weight: 650 }
.md h2 { font-size: 14px; margin: 12px 0 4px; font-weight: 650 }
.md p { margin: 4px 0 } .md ol, .md ul { margin: 4px 0; padding-left: 20px; display: grid; gap: 4px }
.md code { background: var(--recess); border-radius: 4px; padding: 1px 5px; font-size: 12px }
.md .jump { border: 0; background: none; padding: 0; color: var(--primary-text); text-align: left; font: inherit; text-decoration: underline; text-underline-offset: 2px }
.cards2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 10px }
.mini2 { display: grid; gap: 4px; padding: 12px; border-radius: var(--r-well); background: var(--well); box-shadow: inset 0 0 0 1px var(--raised-ring) }
.mini2 b { font-size: 13px } .mini2 span { color: var(--muted); font-size: 12px }
.runcard { display: grid; gap: 6px }
.rstep { display: flex; gap: 8px; align-items: center; font-size: 12.5px }
.rstep .ck { color: var(--success-text) }

/* diff */
.diff { font-family: var(--mono); font-size: 12.5px; border-radius: var(--r-well); overflow: hidden; box-shadow: 0 0 0 1px var(--raised-ring) }
.diff .fh { padding: 7px 12px; background: var(--recess); color: var(--muted); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap }
.diff .ln { display: grid; grid-template-columns: 26px 1fr; padding: 2px 12px 2px 0; white-space: pre-wrap; overflow-wrap: anywhere }
.diff .ln i { font-style: normal; text-align: center; opacity: .8 }
.diff .ln.ctx { color: var(--muted) }
.diff .ln.del { background: var(--destructive-soft); color: var(--destructive) }
.diff .ln.add { background: var(--success-soft); color: var(--success-text) }
.rvstate { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center }

/* browser panel (live view) */
.lv { display: grid; gap: 8px; min-width: 0 }
.lv .stage { min-height: 300px }
.drive .row2 { display: flex; gap: 8px; align-items: center; flex-wrap: wrap }
.lv .stage.cmode { cursor: crosshair; outline: 2px dashed var(--ring-ui); outline-offset: -2px }
.lv .stage.cmode * { cursor: crosshair }
.youbadge { display: none; font-size: 11px; font-weight: 650; color: var(--ai-text); background: color-mix(in srgb, var(--ai) 14%, transparent); border-radius: 6px; padding: 1px 7px }
.lv.you .youbadge { display: inline-block }
.liverep { color: var(--ai-text) !important }

/* comments */
.cthread { position: absolute; z-index: 60; width: 272px; padding: 10px; border-radius: 14px; display: grid; gap: 8px; background-color: var(--overlay-fill); -webkit-backdrop-filter: blur(28px) saturate(180%); backdrop-filter: blur(28px) saturate(180%); box-shadow: var(--overlay-shadow); text-shadow: none }
.cthread .hh { display: flex; justify-content: space-between; align-items: center; font-size: 11.5px; color: var(--muted) }
.cmsg { display: grid; gap: 2px; font-size: 12.5px }
.cmsg .who { font-size: 11px; font-weight: 600; color: var(--muted) } .cmsg.ag .who { color: var(--ai-text) }
.cmsg.ag { padding-left: 8px; box-shadow: inset 2px 0 0 var(--ai) }
.cform { display: grid; gap: 6px }
.cform input { border: 0; background: var(--recess); border-radius: 8px; padding: 7px 9px; font: inherit; color: var(--fg); min-width: 0; outline: none }
.cform input:focus { box-shadow: var(--focus) }
.cform .qs { display: flex; flex-wrap: wrap; gap: 4px }
.cform .qs button { border: 0; background: var(--brand-soft); color: var(--primary-text); border-radius: 6px; padding: 2px 7px; font-size: 11.5px }
.typing3 { display: inline-flex; gap: 3px } .typing3 i { width: 5px; height: 5px; border-radius: 50%; background: var(--muted); animation: pulse 1s infinite }

/* steps panel */
.stp { grid-column: 4; grid-row: 1; display: flex; flex-direction: column; min-height: 0; overflow: hidden; position: relative }
.sthead { padding: 12px 14px 8px; display: grid; gap: 6px; flex: 0 0 auto; border-bottom: 1px solid var(--hairline) }
.sthead h2 { margin: 0; font-size: 14.5px; font-weight: 650; letter-spacing: -.02em; overflow-wrap: anywhere }
.agent { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); flex-wrap: wrap }

    const row = g.querySelector('[data-row="W-88202"]'); row.classList.remove("mis"); row.querySelector("[data-dbcell]").innerHTML = `<span class="pill ok mono">approved</span>`; const df = row.querySelector("[data-diff]"); if (df) df.remove();
    const st = g.querySelector("#restat"); st.className = "pill ok"; st.textContent = "0 mismatches"; const mb = g.querySelector("#misban"); mb.className = "banner ok"; mb.innerHTML = `<span><b>Fixed.</b> W-88202 is now approved in the database too.</span>`;
  }

  S.doneReview = true; setStatus(T, "done", "Done · W-88202 fixed"); toast("Applied. The saved script stays the same.", "Agent");
}

/* ---------- rerun from an edited step ---------- */
async function rerun(T, i) {
  if (T.rerunning) return; T.rerunning = true; const my = runId; const hadEdit = T.steps.some(s => s.edited);
  T.forkAt = null; T.steps.forEach((s, j) => { if (j >= i && !s.norerun) { s.st = "pend"; s.note = "" } });
  setStatus(T, "run", `Rerunning from step ${i + 1}`); toast(`Rerunning from step ${i + 1} with the saved script. No AI involved.`, "Studio");
  for (let j = i; j < T.steps.length; j++) {
    if (T.steps[j].norerun) continue; setStep(T, j, "run"); await sleep(520); if (my !== runId) return; T.steps[j].edited = false; setStep(T, j, "done", "");
  }
  if (hadEdit) T.ver++; T.rerunning = false; T.steps.forEach(s => s.edited = false); logAdd(T, "d", `rerun from step ${i + 1} · script v${T.ver}`);
  const rev = T.steps.findIndex(s => s.tab === "review" && s.st === "need");
  setStatus(T, rev >= 0 ? "need" : "done", rev >= 0 ? "Review the change to W-88202" : `Done · reran from step ${i + 1}`);
}
function fork(T) {
  const tk = T.ticks[T.scrubAt], at = tk.step, F = mkTask({ id: "fork" + tasks.length, title: T.title + " (fork)", env: T.env, status: "need", sub: `Forked at ${tk.time} · edit the plan, then run`, slug: T.slug + "-fork", started: true, forkAt: at + 1, clock: T.clock });
  F.steps = T.steps.slice(0, 5).map((s, j) => ({ ico: s.ico, text: s.text, tab: s.tab, st: j <= at ? "done" : "pend", note: "", edited: false, orig: s.text, norerun: false }));
  F.thumb = tk.snap && tk.snap.kind === "b" ? tk.snap.html : T.thumb;
  addTab(F, "plan", "✎", "Fork", `<div class="hd"><h3>Forked from ${esc(T.title)}</h3><span class="pill info">at ${tk.time}</span></div><div class="well"><span>Steps 1 to ${at + 1} are kept as they were. Edit any step after that, then press Run from step ${at + 2}.</span></div>`);
  F.sel = "plan"; selectTask(F); toast(`Forked at ${tk.time}. The original task is untouched.`, "Studio");
}

/* ---------- events ---------- */
const mobile = () => matchMedia("(max-width: 900px)").matches;

  if (x = t.closest("[data-close]")) { const T = cur, id = x.dataset.close, tb = T.tabs.find(q => q.id === id); tb.closed = true; if (T.sel === id) { const n = T.tabs.filter(q => !q.closed).pop(); T.sel = n && n.id } syncPanes(); renderTabs(); return }
  if (x = t.closest("[data-tab]")) { if (cur.scrubAt !== null) cur.scrubAt = null; showTab(cur, x.dataset.tab); return }

  if (x = t.closest("[data-rerun]")) { rerun(cur, +x.dataset.rerun); return }

  if (x = t.closest("[data-jump]")) { const i = cur.ticks.findIndex(k => k.step === +x.dataset.jump); if (i >= 0) doScrub(cur, i); return }

  if (x = t.closest("[data-take]")) { const T = taskOf(x); if (T) toggleControl(T); return }
  if (x = t.closest("[data-cmode]")) { const st = x.closest(".lv").querySelector("#stage"); const on = st.classList.toggle("cmode"); x.textContent = on ? "Click an element…" : "💬 Comment"; return }
  if (x = t.closest("[data-cm]")) { const T = cur; openThread(T, "row:" + x.dataset.cm, x, x.dataset.label); return }
  if (x = t.closest("[data-cmstep]")) { const i = +x.dataset.cmstep; openThread(cur, "step:" + i, x, "Step " + (i + 1)); return }

  if (x = t.closest("[data-cq]")) { const i = $("cpop").querySelector("input"); i.value = x.dataset.cq; i.focus(); return }
  const stg = t.closest(".stage.cmode");
  if (stg) { const tgt = t.closest(".fake-btn,.inp,.banner,.tile,td,b,.hint,span") || t, lab = (tgt.textContent || "element").trim().slice(0, 28); stg.classList.remove("cmode"); const b = stg.closest(".lv").querySelector("[data-cmode]"); b.textContent = "💬 Comment"; openThread(cur, "b:" + lab, tgt, "Page: " + lab); return }
  if (x = t.closest("[data-sheet]")) { if (mobile()) { stpOpen = !stpOpen; $("stp").classList.toggle("open", stpOpen); renderSteps() } return }
  if (x = t.closest(".st")) { if (e.detail > 1) return; clearTimeout(stTimer); const i = +x.dataset.i; stTimer = setTimeout(() => jumpStep(cur, i), 230); return }

let stTimer = 0;
function jumpStep(T, i) {

  const k = T.ticks.findIndex(q => q.step === i);
  if (k >= 0) { doScrub(T, k); return }

document.addEventListener("dblclick", e => {
  clearTimeout(stTimer); const tx = e.target.closest(".tx[data-tx]"); if (!tx || !cur) return; const i = +tx.dataset.tx, s = cur.steps[i]; if (!s || s.st === "run") return;
  cur.editing = true; tx.contentEditable = "true"; tx.focus(); const r = document.createRange(); r.selectNodeContents(tx); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
});
function commitEdit(tx, cancel) {
  if (tx.contentEditable !== "true") return; const T = cur, i = +tx.dataset.tx, s = T.steps[i]; tx.contentEditable = "false"; T.editing = false;
  const v = tx.textContent.trim(); if (!cancel && v && v !== s.text) { s.text = v; s.edited = true } T.pend = false; renderSteps();
}
document.addEventListener("focusout", e => { const tx = e.target.closest && e.target.closest(".tx[contenteditable]"); if (tx) commitEdit(tx) });
document.addEventListener("keydown", e => {

  if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches(".card,.tab")) { e.preventDefault(); e.target.click() }
});
document.addEventListener("submit", e => {

});
