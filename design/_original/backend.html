<pre><span class="k">from</span> studio <span class="k">import</span> api, HTTPError
<span class="k">import</span> studio

refunds = studio.db.<span class="f">table</span>(<span class="s">"refunds"</span>)
UPSTREAM = <span class="s">"http://127.0.0.1:41759"</span>


<span class="d">@api.post</span>(<span class="s">"/refunds"</span>, name=<span class="s">"createRefund"</span>)
<span class="k">def</span> <span class="f">create_refund</span>(req):
    body = req.<span class="f">body</span> <span class="k">or</span> {}
    <span class="k">if</span> <span class="s">"amount"</span> <span class="k">not in</span> body:
        <span class="k">raise</span> <span class="f">HTTPError</span>(<span class="n">422</span>, {<span class="s">"error"</span>: <span class="s">"amount is required"</span>})
    <span class="k">return</span> refunds.<span class="f">insert</span>({<span class="s">"reason"</span>: body.<span class="f">get</span>(<span class="s">"reason"</span>, <span class="s">""</span>), <span class="s">"amount"</span>: body[<span class="s">"amount"</span>]})


<span class="d">@api.get</span>(<span class="s">"/refunds"</span>, name=<span class="s">"listRefunds"</span>)
<span class="k">def</span> <span class="f">list_refunds</span>(req):
    <span class="k">return</span> refunds.<span class="f">list</span>(limit=<span class="f">int</span>(req.query.<span class="f">get</span>(<span class="s">"limit"</span>, <span class="n">50</span>)))


<span class="d">@api.get</span>(<span class="s">"/refunds/stats"</span>, name=<span class="s">"refundStats"</span>)
<span class="k">def</span> <span class="f">refund_stats</span>(req):

        method=<span class="s">"GET"</span>,
