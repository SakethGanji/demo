<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Refund triage · Workflows · Command Studio</title><link rel="stylesheet" href="assets/tokens.css"><link rel="stylesheet" href="assets/components.css"><link rel="stylesheet" href="assets/theme.css"><link rel="stylesheet" href="assets/character.css"><link rel="stylesheet" href="assets/system.css"><link rel="stylesheet" href="assets/inset.css"><link rel="stylesheet" href="assets/edges.css"><link rel="stylesheet" href="assets/light.css"><link rel="stylesheet" href="assets/paper.css"><link rel="stylesheet" href="assets/kit.css"><link rel="stylesheet" href="assets/motion.css"><script src="assets/motion.js"></script><script src="assets/art.js"></script><script src="assets/edges.js"></script><script src="assets/kit.js"></script><script src="assets/lucide.min.js"></script><script src="assets/shell.js"></script><style>
 /* ── page tokens: nodes are raised mini-panels on the recessed canvas well ── */
 :root{--wf-node:#ffffff;--wf-solid-raise:#ffffff;--wf-grid:rgb(var(--ink,38 34 28) / .055);--wf-node-drop:0 1px 2px rgb(var(--ink,38 34 28) / .06),0 6px 14px -8px rgb(var(--ink,38 34 28) / .14)}
 .dark{--wf-node:color-mix(in srgb,#fff 5.5%,var(--card));--wf-solid-raise:#2a2a30;--wf-grid:rgb(255 255 255 / .11);--wf-node-drop:0 1px 2px rgb(0 0 0 / .45),0 8px 18px -10px rgb(0 0 0 / .7)}

 /* ── layout: editor panel (header + canvas well) | inspector ── */
 .wf-ed{display:flex;gap:var(--s4);flex:1;min-height:0}
 .wf-main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
 .wf-insp{width:340px;flex-shrink:0;display:flex;flex-direction:column;overflow:hidden}

 /* header row: 48 tall, no rule */
 .wf-head{display:flex;align-items:center;gap:var(--s2);height:48px;padding:0 var(--s3) 0 var(--s5);flex-shrink:0;min-width:0}
 .wf-crumb{display:flex;align-items:center;gap:6px;font-size:13px;min-width:0;white-space:nowrap}
 .wf-crumb > a{color:var(--muted-foreground);text-decoration:none;transition:color var(--d-instant)}
 .wf-crumb > a:hover{color:var(--foreground)}
 .wf-crumb > svg{width:13px;height:13px;color:var(--faint);flex-shrink:0}
 .wf-pick{display:inline-flex;align-items:center;gap:6px;height:28px;margin-left:-4px;padding:0 6px 0 8px;border:0;border-radius:var(--r-ctl);background:transparent;font:600 13.5px var(--font-sans);letter-spacing:-.01em;color:var(--foreground);cursor:pointer;transition:background-color var(--d-instant),transform var(--d-fast) var(--ease-out)}
 .wf-pick:hover{background:var(--recess-fill)}
 .wf-pick:active{transform:scale(.98)}
 .wf-pick svg{width:13px;height:13px;color:var(--muted-foreground)}
 .wf-pick[aria-expanded="true"]{background:var(--raise-fill);box-shadow:var(--raise-sm)}
 .wf-live{gap:6px;margin-left:2px;font-variant-numeric:tabular-nums}
 .wf-live .dot{width:6px;height:6px}
 .wf-saved{font-size:12px;color:var(--muted-foreground);white-space:nowrap;margin-right:var(--s1)}
 .wf-head .btn .spin{display:none;width:12px;height:12px;border-radius:50%;border:1.5px solid currentColor;border-right-color:transparent;animation:wf-spin 600ms linear infinite;flex-shrink:0}
 .wf-head .btn.busy svg{display:none}.wf-head .btn.busy .spin{display:inline-block;margin:0 1px}
 @keyframes wf-spin{to{transform:rotate(360deg)}}

 /* ── canvas: a recessed well; dot lattice in dark, faint grid in light; moves with the view ── */
 .wf-well{position:relative;flex:1;min-height:0;margin-top:0;touch-action:none;cursor:default;user-select:none;-webkit-user-select:none;
   background-color:var(--well);
   background-image:linear-gradient(var(--wf-grid) 1px,transparent 1px),linear-gradient(90deg,var(--wf-grid) 1px,transparent 1px);
   background-size:var(--gs,32px) var(--gs,32px);background-position:var(--gx,0) var(--gy,0)}
 .dark .wf-well{background-image:radial-gradient(circle at 1px 1px,var(--wf-grid) 1px,transparent 1.6px)}
 .wf-well.panning,.wf-well.hand{cursor:grab}.wf-well.panning{cursor:grabbing}
 .wf-vp{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0}
 .wf-wires{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}

 /* wires: art line style; hot once data has crossed them; dim when skipped */
 .wf-wires .a-wire{transition:stroke var(--d-slow) var(--ease-out),opacity var(--d-slow) var(--ease-out)}
 .wf-wires .a-wire.hot{stroke:color-mix(in srgb,var(--brand-1) 55%,transparent)}
 html:not(.dark) .wf-wires .a-wire.hot{stroke:color-mix(in srgb,var(--brand-1) 70%,transparent)}
 .wf-wires .a-wire.dim{opacity:.35;stroke-dasharray:3 4}
 .wf-elabel{position:absolute;transform:translate(-50%,-50%);height:20px;padding:0 8px;border-radius:999px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;
   font:500 11px/1 var(--font-sans);color:var(--muted-foreground);background:var(--wf-node);box-shadow:var(--raise-sm);pointer-events:none;transition:opacity var(--d-slow) var(--ease-out),color var(--d-slow)}
 .wf-elabel b{font:500 10.5px var(--font-mono);color:var(--foreground)}
 .wf-elabel.dim{opacity:.4}
 .wf-elabel.hot b{color:var(--foreground)}
 .wf-elabel.hot{color:var(--foreground)}

 /* nodes: 220px raised mini-panels */
 .wfn{position:absolute;width:220px;border-radius:10px;background:var(--wf-node);box-shadow:inset 0 1px 0 var(--edge-hi),0 0 0 1px var(--edge-ring),var(--wf-node-drop);
   cursor:pointer;transition:box-shadow var(--d-fast),opacity var(--d-slow) var(--ease-out)}
 .wfn:hover{box-shadow:inset 0 1px 0 var(--edge-hi),0 0 0 1px color-mix(in srgb,var(--foreground) 16%,transparent),var(--wf-node-drop)}
 .wfn.sel,.wfn.sel:hover{box-shadow:inset 0 1px 0 var(--edge-hi),0 0 0 1px var(--ring),0 0 0 4px color-mix(in srgb,var(--ring) 16%,transparent),var(--wf-node-drop)}
 .wfn.drag{cursor:grabbing;transition:none;z-index:3}
 .wfn.st-running{box-shadow:inset 0 1px 0 var(--edge-hi),0 0 0 1px color-mix(in srgb,var(--primary) 55%,transparent),0 0 24px -8px var(--glow),var(--wf-node-drop)}
 .wfn.sel.st-running{box-shadow:inset 0 1px 0 var(--edge-hi),0 0 0 1px var(--ring),0 0 0 4px color-mix(in srgb,var(--ring) 16%,transparent),0 0 24px -8px var(--glow),var(--wf-node-drop)}
 .wfn.st-skipped{opacity:.5}
 .wfn-type{position:absolute;left:2px;bottom:calc(100% + 5px);font-size:11px;font-weight:500;color:var(--muted-foreground);white-space:nowrap;pointer-events:none}
 .wfn-row{display:flex;align-items:center;gap:10px;height:56px;padding:0 12px 0 12px}
 .wfn-ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex-shrink:0;background:var(--raise-fill);box-shadow:var(--raise-sm);color:var(--muted-foreground)}
 .dark .wfn-ico{background:rgb(255 255 255 / .05)}
 .wfn-ico svg{width:15px;height:15px}
 .wfn-ico.ai{background:linear-gradient(135deg,var(--brand-1),var(--brand-2));color:#fff;box-shadow:inset 0 1px 0 rgb(255 255 255 / .22),0 0 0 1px color-mix(in srgb,var(--brand-1) 60%,#000),0 2px 6px -2px color-mix(in srgb,var(--brand-2) 55%,transparent)}
 .wfn-txt{flex:1;min-width:0}
 .wfn-t{font-size:13px;font-weight:550;letter-spacing:-.005em;line-height:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .wfn-s{display:flex;align-items:center;gap:5px;margin-top:2px;font:11px/15px var(--font-mono);color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .wfn-s .method{height:15px;padding:0 4px;font-size:9.5px;line-height:15px}
 .wfn-st{position:absolute;top:11px;right:11px;display:flex}
 .wfn-ms{position:absolute;right:2px;bottom:calc(100% + 5px);font:10.5px/13px var(--font-mono);color:var(--muted-foreground);font-variant-numeric:tabular-nums;opacity:0;transition:opacity var(--d-fast);pointer-events:none}
 .wfn-ms:not(:empty){opacity:1}
 .wfn-st .dot{width:6px;height:6px}
 .wfn-st .dot.wf-idle{background:transparent;box-shadow:inset 0 0 0 1.25px var(--faint)}
 .wfn-st .dot.wf-pend{background:var(--recess-fill);box-shadow:var(--inset-sm),inset 0 0 0 1.25px var(--faint)}
 .wfn-row{padding-right:26px}
 .wfn-foot{display:flex;align-items:center;gap:6px;height:30px;margin:0 6px 6px;padding:0 8px;border-radius:7px;background:var(--recess-fill);box-shadow:var(--inset-sm);
   font:11.5px var(--font-mono);color:var(--muted-foreground);text-decoration:none;transition:color var(--d-instant),background-color var(--d-instant)}
 .wfn-foot svg{width:13px;height:13px}
 .wfn-foot .wf-py{color:var(--foreground)}
 .wfn-foot .wf-go{margin-left:auto;display:inline-flex;align-items:center;gap:3px;font-family:var(--font-sans);font-size:11.5px}
 .wfn-foot .wf-go svg{width:12px;height:12px}
 .wfn-foot:hover{color:var(--foreground);background:color-mix(in srgb,var(--recess-fill) 170%,transparent)}
 .wfn-port{position:absolute;width:9px;height:9px;margin-left:-4.5px;border-radius:50%;background:var(--wf-node);box-shadow:0 0 0 1px var(--art-line);pointer-events:none}
 .wfn-port.in{top:-5px;left:50%}.wfn-port.out{bottom:-5px;left:50%}

 /* floating toolbar: menu glass, bottom centre */
 .wf-tb.menu{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);width:auto;display:flex;align-items:center;gap:2px;padding:4px;border-radius:11px;z-index:4;cursor:default}
 .wf-tb .btn{color:var(--muted-foreground)}
 .wf-tb .btn:hover{color:var(--foreground)}
 .wf-tb .btn.on{background:var(--raise-fill);box-shadow:var(--raise-sm);color:var(--foreground)}
 .wf-tb .btn.sm .kbd{margin-left:2px}
 .wf-tb-sep{width:1px;height:16px;margin:0 4px;background:var(--hairline)}
 .wf-zoom{min-width:48px;height:28px;padding:0 4px;border:0;border-radius:calc(var(--r-ctl) - 1px);background:transparent;font:500 12px var(--font-sans);font-variant-numeric:tabular-nums;color:var(--foreground);cursor:pointer}
 .wf-zoom:hover{background:var(--muted)}

 /* minimap: a raised tile on the well */
 .wf-mini{position:absolute;right:12px;bottom:12px;width:168px;height:108px;border-radius:9px;background:var(--wf-node);box-shadow:inset 0 1px 0 var(--edge-hi),0 0 0 1px var(--edge-ring),var(--wf-node-drop);z-index:4;overflow:hidden;cursor:pointer}
 .wf-mini svg{display:block;width:100%;height:100%}
 .wf-mini .mm-n{fill:color-mix(in srgb,var(--foreground) 14%,transparent)}
 .wf-mini .mm-n.sel{fill:var(--primary)}
 .wf-mini .mm-n.skip{fill:color-mix(in srgb,var(--foreground) 6%,transparent)}
 .wf-mini .mm-v{fill:color-mix(in srgb,var(--primary) 5%,transparent);stroke:color-mix(in srgb,var(--ring) 60%,transparent);stroke-width:1;vector-effect:non-scaling-stroke}

 /* canvas corner note: the pinned test event */
 .wf-note{position:absolute;left:12px;top:12px;z-index:4;display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;font-size:11.5px;color:var(--muted-foreground);background:var(--wf-node);box-shadow:var(--raise-sm);pointer-events:none}
 .wf-note svg{width:12px;height:12px}
 .wf-note .mono{color:var(--foreground);font-size:11px}

 /* ── inspector ── */
 .wf-ih{display:flex;align-items:center;gap:10px;height:56px;padding:0 var(--s3) 0 var(--s5);flex-shrink:0}
 .wf-ih .wfn-ico{width:28px;height:28px}
 .wf-ih-t{font-size:13.5px;font-weight:600;letter-spacing:-.01em;line-height:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .wf-ih .wfn-s{margin-top:1px}
 .wf-insp .tabs{height:40px;border-bottom:1px solid var(--hairline);padding:0 var(--s3);align-items:stretch;flex-shrink:0}
 .wf-body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
 .wf-pane{display:none;flex-direction:column;gap:var(--s5);padding:var(--s5) 0 var(--s6)}
 .wf-pane.on{display:flex;animation:wf-in var(--d-base) var(--ease-out) both}
 @keyframes wf-in{from{opacity:0;transform:translateY(3px)}}
 .wf-f{display:flex;flex-direction:column;gap:7px;padding:0 var(--s5)}
 .wf-f > .well{margin:0 calc(var(--s3) * -1)}
 .wf-lbl{display:flex;align-items:center;gap:var(--s2);min-height:20px;font-size:12px;font-weight:500;color:var(--foreground)}
 .wf-lbl .muted{font-weight:400;color:var(--muted-foreground)}
 .wf-lbl .wf-r{margin-left:auto;display:inline-flex;align-items:center;gap:6px}
 .wf-lbl .btn.xs{color:var(--muted-foreground);margin-right:-6px}
 .wf-hint{font-size:12px;line-height:1.5;color:var(--muted-foreground)}
 .wf-sel{display:flex;align-items:center;gap:8px;height:34px;cursor:pointer;text-align:left;font:inherit;color:var(--foreground)}
 .wf-sel .mono{font-size:12.5px}
 .wf-sel .muted{font-size:12px;color:var(--muted-foreground)}
 .wf-sel > .wf-chev{margin-left:auto;width:14px;height:14px;color:var(--muted-foreground);transition:transform var(--d-base) var(--ease-io)}
 .wf-sel[aria-expanded="true"] > .wf-chev{transform:rotate(180deg)}
 .wf-sel:focus-visible{outline:none;box-shadow:inset 0 0 0 1px var(--ring),var(--focus-ring)}
 .wf-gem{width:14px;height:14px;border-radius:4px;background:linear-gradient(135deg,var(--brand-1),var(--brand-2));flex-shrink:0;box-shadow:inset 0 1px 0 rgb(255 255 255 / .25)}
 .wf-in-mono{font-family:var(--font-mono);font-size:12.5px}
 .wf-row2{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2)}
 /* the prompt editor: a recess holding text and raised field tokens */
 .wf-prompt.input{height:auto;min-height:112px;padding:9px 11px;font:13px/22px var(--font-sans);white-space:pre-wrap;outline:none;cursor:text}
 .wf-tok{display:inline-flex;align-items:center;height:19px;padding:0 6px;margin:0 1px;border-radius:5px;vertical-align:1px;background:var(--wf-solid-raise);box-shadow:var(--raise-sm);
   font:500 11.5px/19px var(--font-mono);color:var(--foreground);white-space:nowrap;cursor:default;user-select:all}
 .wf-tok i{font-style:normal;color:var(--faint)}
 .wf-tok.hl{animation:wf-tok 900ms var(--ease-out) both}
 @keyframes wf-tok{from{box-shadow:var(--raise-sm),0 0 0 3px color-mix(in srgb,var(--ring) 35%,transparent)}}
 /* schema / mapping rows in a well */
 .wf-rows{padding:2px 0}
 .wf-rw{display:flex;align-items:center;gap:var(--s2);min-height:40px;padding:6px var(--s3)}
 .wf-rw + .wf-rw{border-top:1px solid var(--hairline)}
 .wf-rw .mono{font-size:12.5px}
 .wf-rw .wf-k{min-width:84px}
 .wf-rw .wf-v{flex:1;min-width:0;font-size:12px;color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .wf-rw .wf-arrow{width:13px;height:13px;color:var(--faint);flex-shrink:0}
 .wf-ty{display:inline-flex;align-items:center;height:19px;padding:0 6px;border-radius:5px;background:var(--raise-fill);box-shadow:var(--raise-sm);font:500 11px/19px var(--font-mono);color:var(--muted-foreground);flex-shrink:0}
 .wf-rw .btn.xs{margin-left:auto}
 .wf-add{align-self:flex-start;margin-left:calc(var(--s2) * -1);color:var(--muted-foreground)}
 /* temperature: recessed track, raised thumb */
 .wf-range{-webkit-appearance:none;appearance:none;width:100%;height:18px;margin:0;background:transparent;cursor:pointer;--p:20%}
 .wf-range:focus-visible{outline:none}
 .wf-range::-webkit-slider-runnable-track{height:6px;border-radius:999px;background:linear-gradient(90deg,var(--primary) 0 var(--p),transparent var(--p)),var(--recess-fill);box-shadow:var(--inset-sm)}
 .wf-range::-moz-range-track{height:6px;border-radius:999px;background:linear-gradient(90deg,var(--primary) 0 var(--p),transparent var(--p)),var(--recess-fill);box-shadow:var(--inset-sm)}
 .wf-range::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:-5px;border-radius:50%;background:var(--wf-solid-raise);box-shadow:inset 0 1px 0 var(--edge-hi),0 0 0 1px var(--edge-ring),0 1px 3px rgb(0 0 0 / .18)}
 .wf-range::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:var(--wf-solid-raise);box-shadow:inset 0 1px 0 var(--edge-hi),0 0 0 1px var(--edge-ring),0 1px 3px rgb(0 0 0 / .18)}
 .wf-range:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 1px var(--ring),var(--focus-ring)}
 .wf-scale{display:flex;justify-content:space-between;font:10.5px var(--font-mono);color:var(--muted-foreground);margin-top:-2px}
 .wf-val{font:500 12px var(--font-mono);font-variant-numeric:tabular-nums;color:var(--foreground)}
 .wf-sw{display:flex;align-items:center;gap:var(--s3);padding:0 var(--s5);font-size:12.5px}
 .wf-sw .wf-hint{font-size:12px}
 .wf-sw .switch{margin-left:auto;cursor:pointer}
 .wf-cond{display:grid;grid-template-columns:minmax(0,1.4fr) 52px minmax(0,1fr);gap:var(--s2)}
 .wf-cond .input{display:flex;align-items:center;height:34px}
 .wf-seg.seg{display:flex;width:100%;height:30px;padding:2px}
 .wf-seg.seg > button{flex:1;font-size:12.5px}
 /* output / input */
 .wf-run{display:flex;align-items:center;gap:var(--s2);padding:0 var(--s5);font-size:12.5px;min-width:0}
 .wf-run b{font-weight:550}
 .wf-run .muted{color:var(--muted-foreground);white-space:nowrap}
 .wf-run .badge{margin-left:auto}
 .wf-json.json.well{margin:0 var(--s2);padding:var(--s3) var(--s4);font:12px/19px var(--font-mono);white-space:pre;overflow:auto;color:var(--foreground)}
 .wf-json .jk{color:var(--foreground)}
 .wf-json .js{color:var(--syn-string)}
 .wf-json .jn{color:var(--syn-number)}
 .wf-json .jp{color:var(--muted-foreground)}
 .wf-meta{display:flex;flex-wrap:wrap;gap:4px 14px;padding:0 var(--s5);font-size:12px;color:var(--muted-foreground)}
 .wf-meta span{display:inline-flex;align-items:center;gap:5px}
 .wf-meta svg{width:12px;height:12px}
 .wf-meta b{font-weight:500;color:var(--foreground);font-variant-numeric:tabular-nums}
 .wf-kv .kit-kv{min-height:38px;padding:6px var(--s3)}
 .wf-kv .kit-kv-k{width:84px;font-size:12px}
 .wf-kv .kit-kv-v{font-size:12.5px}
 .wf-kv .kit-kv-v a{color:var(--foreground);text-decoration:none;display:inline-flex;align-items:center;gap:5px}
 .wf-kv .kit-kv-v a:hover{text-decoration:underline}
 .wf-kv .kit-kv-v a svg{width:12px;height:12px;color:var(--muted-foreground)}
 .wf-empty{padding:var(--s6) var(--s5);font-size:12.5px;color:var(--muted-foreground);text-align:center}
 @media (prefers-reduced-motion:reduce){.wf-pane.on{animation:none}}
</style></head><body><div id="shell"></div>

 <section class="panel wf-main" aria-label="Workflow editor">

    <button class="wf-pick" id="wf-pick" aria-haspopup="listbox" aria-expanded="false" data-tip="Switch workflow">Refund triage<i data-lucide="chevrons-up-down"></i></button></nav>
   <span class="badge success wf-live" id="wf-live" data-tip="Published · serving POST /hooks/refund"><span class="dot ok flat"></span><span id="wf-ver">Live · v14</span></span>

  </div>
  <div class="well wf-well" id="wf-well" aria-label="Canvas. Drag nodes to move them, drag the background to pan.">
   <div class="wf-vp" id="wf-vp"><svg class="wf-wires art" id="wf-wires" aria-hidden="true"></svg></div>
   <span class="wf-note"><i data-lucide="pin"></i>Test event <span class="mono">ord_8812</span></span>
   <div class="menu wf-tb" role="toolbar" aria-label="Canvas tools">
    <button class="btn ghost icon-sm on" data-tool="select" data-tip="Select" data-kbd="V" aria-label="Select"><i data-lucide="mouse-pointer-2"></i></button>

    const params = (PARAMS[n.custom ? 'custom' : n.id])(n);
    const input = !inp ? `<div class="wf-empty">${I('webhook')}<div style="margin-top:8px">Triggers have no input. This node starts the run with the request body.</div></div>`
      : `<div class="wf-run"><span class="muted">From</span><b>${fromOf[n.id]}</b>${n.id === 'cls' ? '<span class="badge outline mono" style="margin-left:auto">pinned</span>' : ''}</div><pre class="json well wf-json">${json(inp)}</pre>`;
    const output = st === 'skipped' || !out ? `${runRow('')}<div class="wf-empty">No output: the <b style="font-weight:500;color:var(--foreground)">else review</b> branch didn’t run.</div>`
      : `${runRow(n.id === 'refund' ? '200' : 'JSON')}<pre class="json well wf-json">${json(out)}</pre>${n.id === 'cls' ? `<div class="wf-meta"><span>${I('cpu')}<b>212</b> in · <b>14</b> out tokens</span><span>${I('timer')}<b>1.18 s</b></span></div>` : ''}`;
    $('#wf-body').innerHTML = `<div class="wf-pane" data-pane="params">${params}</div><div class="wf-pane" data-pane="input">${input}</div><div class="wf-pane" data-pane="output">${output}</div>`;
    showTab(curTab, true); icons();
    $$('#wf-body [data-ts]').forEach((el) => { const d = new Date(el.dataset.ts); el.dataset.tip = d.toLocaleString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false, timeZone: 'UTC' }) + ' UTC'; });
    const r = $('#wf-temp'); if (r) { const set = () => { r.style.setProperty('--p', r.value * 100 + '%'); $('#wf-temp-v').textContent = (+r.value).toFixed(1); }; r.addEventListener('input', set); set(); }
  }
  function showTab(t, quiet) {
    curTab = t;
    $$('#wf-tabs .tab').forEach((b) => { b.classList.toggle('active', b.dataset.tab === t); b.setAttribute('aria-selected', b.dataset.tab === t); });
    $$('#wf-body .wf-pane').forEach((p) => p.classList.toggle('on', p.dataset.pane === t));
    if (quiet) $$('#wf-body .wf-pane.on').forEach((p) => { p.style.animation = 'none'; });
    const tabs = $('#wf-tabs'), a = tabs.querySelector('.tab.active'), l = tabs.querySelector('.m-tabline');
    if (a && l) { l.style.width = a.offsetWidth + 'px'; l.style.transform = `translateX(${a.offsetLeft}px)`; }
  }
  $('#wf-tabs').addEventListener('click', (e) => { const b = e.target.closest('.tab'); if (b) showTab(b.dataset.tab); });

  /* inspector controls: menus, switches, segmented, field tokens */
  const MODELS = [['gemini-2.5-flash', 'fast · cheap'], ['gemini-2.5-pro', 'slower · best'], ['gemini-2.0-flash-lite', 'cheapest']];
  const ROUTES = [['POST', '/refunds', 'createRefund'], ['GET', '/refunds', 'listRefunds'], ['GET', '/refunds/stats', 'refundStats']];
  $('#wf-body').addEventListener('click', (e) => {
    const s = e.target.closest('.switch'); if (s) { s.classList.toggle('on'); s.setAttribute('aria-checked', s.classList.contains('on')); return; }
    const sb = e.target.closest('.wf-seg > button'); if (sb) { $$(':scope > button', sb.parentNode).forEach((x) => x.classList.toggle('on', x === sb)); return; }
    const m = e.target.closest('[data-menu]'); if (!m) return;
    const kind = m.dataset.menu;
    if (kind === 'model') {
      const cur = $('#wf-model').textContent;
      Kit.menu(m, { width: m.offsetWidth, items: MODELS.map(([k, sub]) => ({ group: 'Google', label: `<span class="mono">${k}</span>`, sub, checked: k === cur, onSelect: () => { $('#wf-model').textContent = k; byId('cls').sub = `<span>AI · ${k}</span>`; nodeEl.cls.querySelector('.wfn-s').innerHTML = byId('cls').sub; renderInspector(); } })) });
    } else if (kind === 'field') {
      Kit.menu(m, { search: true, placeholder: 'Search fields…', align: 'end', width: 240, items: tokens[selected].map((f) => ({ group: fromOf[selected] || 'Input', label: `<span class="mono">${f}</span>`, icon: 'braces', onSelect: () => {
        const p = $('#wf-prompt'); p.insertAdjacentHTML('beforeend', ' ' + tok(f)); const t = p.lastElementChild; t.classList.add('hl'); } })) });
    } else if (kind === 'route') {
      Kit.menu(m, { width: m.offsetWidth, search: true, placeholder: 'Search routes…', items: ROUTES.map(([mm, p, n]) => ({ group: 'refunds.py', label: `<span class="mono">${p}</span>`, method: mm, sub: n, checked: n === $('#wf-rt-n').textContent,
        onSelect: () => { $('#wf-rt').innerHTML = `${M(mm)}<span class="mono">${p}</span>`; $('#wf-rt-n').textContent = n; const nd = byId('refund'); nd.title = 'Call ' + n; nd.sub = `${M(mm)}<span>${p}</span>`; nodeEl.refund.querySelector('.wfn-t').textContent = nd.title; nodeEl.refund.querySelector('.wfn-s').innerHTML = nd.sub; } })) });
    } else {
      const opts = { auth: [['HMAC signature', 'X-Signature'], ['Bearer token', 'Authorization'], ['None', 'public']], op: [['≥', 'at least'], ['>', 'greater than'], ['=', 'equals'], ['<', 'less than']], chan: [['#refunds-review', '6 members'], ['#payments-ops', '14 members']], table: [['refunds', '3 rows']] }[kind] || [];
      Kit.menu(m, { width: Math.max(200, m.offsetWidth), items: opts.map(([l, sub], i) => ({ label: l, sub, checked: i === 0, onSelect: () => {} })) });
    }
  });
  $('#wf-body').addEventListener('keydown', (e) => { const s = e.target.closest('.switch'); if (s && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); s.click(); } });

  /* ── pointer: drag nodes, pan the background ── */
  let drag = null;
  well.addEventListener('pointerdown', (e) => {
    if (e.button !== 0 || e.target.closest('.wf-tb, .wf-mini, .wfn-foot')) return;
    const nEl = e.target.closest('.wfn');
    if (nEl && tool === 'select') {
      const n = byId(nEl.dataset.id); if (selected !== n.id) select(n.id);
      drag = { kind: 'node', n, el: nEl, sx: e.clientX, sy: e.clientY, ox: n.x, oy: n.y, moved: false };
    } else {
      drag = { kind: 'pan', sx: e.clientX, sy: e.clientY, ox: view.x, oy: view.y }; well.classList.add('panning');
    }
    well.setPointerCapture(e.pointerId);
  });
  well.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
    if (drag.kind === 'pan') { view.x = drag.ox + dx; view.y = drag.oy + dy; apply(); return; }
    if (!drag.moved && Math.hypot(dx, dy) < 3) return;
    drag.moved = true; drag.el.classList.add('drag');
    drag.n.x = Math.round(drag.ox + dx / view.z); drag.n.y = Math.round(drag.oy + dy / view.z);
    place(drag.n); wires(); mini();
  });
  const end = () => { if (!drag) return; if (drag.el) drag.el.classList.remove('drag'); well.classList.remove('panning'); drag = null; };
  well.addEventListener('pointerup', end); well.addEventListener('pointercancel', end);
  well.addEventListener('wheel', (e) => {
    e.preventDefault();
    if (e.ctrlKey || e.metaKey) { const r = well.getBoundingClientRect(); zoomBy(e.deltaY < 0 ? 1.1 : 1 / 1.1, e.clientX - r.left, e.clientY - r.top); }
    else { view.x -= e.deltaX; view.y -= e.deltaY; apply(); }
  }, { passive: false });
  well.addEventListener('keydown', (e) => { const nEl = e.target.closest('.wfn'); if (nEl && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); select(nEl.dataset.id); } });

  /* ── toolbar ── */
  function setTool(t) { tool = t; $$('.wf-tb [data-tool]').forEach((b) => b.classList.toggle('on', b.dataset.tool === t)); well.classList.toggle('hand', t === 'hand'); }
  $$('.wf-tb [data-tool]').forEach((b) => b.addEventListener('click', () => setTool(b.dataset.tool)));
  $('#wf-zo').addEventListener('click', () => zoomBy(1 / 1.1));
  $('#wf-zi').addEventListener('click', () => zoomBy(1.1));
  $('#wf-z').addEventListener('click', () => zoomBy(1 / view.z));
  $('#wf-fit').addEventListener('click', () => fit());
  $('#wf-mini').addEventListener('click', () => fit());

  /* add node: a searchable Kit.menu of node types; backend routes link the workflow to the Python backend */
  const TYPES = [
    { group: 'Triggers', label: 'Webhook', icon: 'webhook', sub: 'HTTP request' }, { group: 'Triggers', label: 'Schedule', icon: 'clock', sub: 'cron' }, { group: 'Triggers', label: 'Error trigger', icon: 'triangle-alert', sub: 'on failure' },
    { group: 'Backend · refunds.py', label: '<span class="mono">/refunds</span>', method: 'POST', sub: 'createRefund', t: 'Call createRefund', ty: 'Backend route', s: `${M('POST')}<span>/refunds</span>`, ic: 'file-code-2' },
    { group: 'Backend · refunds.py', label: '<span class="mono">/refunds</span>', method: 'GET', sub: 'listRefunds', t: 'Call listRefunds', ty: 'Backend route', s: `${M('GET')}<span>/refunds</span>`, ic: 'file-code-2' },
    { group: 'Backend · refunds.py', label: '<span class="mono">/refunds/stats</span>', method: 'GET', sub: 'refundStats', t: 'Call refundStats', ty: 'Backend route', s: `${M('GET')}<span>/refunds/stats</span>`, ic: 'file-code-2' },
    { group: 'AI', label: 'LLM classify', icon: 'sparkles', sub: 'structured output' }, { group: 'AI', label: 'AI agent', icon: 'bot', sub: 'tools + memory' },
    { group: 'Flow', label: 'If / else', icon: 'split' }, { group: 'Flow', label: 'Switch', icon: 'route' }, { group: 'Flow', label: 'Merge', icon: 'git-merge' }, { group: 'Flow', label: 'Wait', icon: 'timer' },
    { group: 'Data', label: 'Table insert', icon: 'table-2', sub: 'refunds' }, { group: 'Data', label: 'Table query', icon: 'database', sub: 'refunds' },
    { group: 'Integrations', label: 'Slack message', icon: 'message-square-text' }, { group: 'Integrations', label: 'Send email', icon: 'mail' }, { group: 'Integrations', label: 'HTTP request', icon: 'globe' },
  ];
  let added = 0;
  function addNode(t) {
    const W = well.clientWidth, H = well.clientHeight, id = 'n' + (++added);
    const n = { id, custom: true, type: t.ty || t.group.replace(/ ·.*/, '').replace(/s$/, ''), icon: t.ic || t.icon, ai: t.group === 'AI', title: t.t || t.label.replace(/<[^>]+>/g, ''), sub: t.s || `<span>${t.sub || 'not configured'}</span>`,
      x: Math.round((W / 2 - view.x) / view.z - 110 + added * 16), y: Math.round((H / 2 - view.y) / view.z - 28 + added * 16), ms: '' };
    NODES.push(n); const el = mountNode(n); icons(); el.querySelector('.dot').className = 'dot wf-idle'; el.dataset.st = 'idle';
    select(id, 'params');
    Kit.toast({ title: `Added <b style="font-weight:550">${n.title}</b>`, desc: 'Drag it into place, then wire it in.', tone: 'ok', action: { label: 'Undo', onClick: () => { NODES.splice(NODES.indexOf(n), 1); el.remove(); delete nodeEl[id]; select('cls'); } } });
  }
  function openAdd() { return Kit.menu($('#wf-add'), { search: true, placeholder: 'Search nodes…', width: 280, items: TYPES.map((t) => ({ ...t, onSelect: () => addNode(t) })) }); }
  $('#wf-add').addEventListener('click', openAdd);

  /* workflow switcher in the crumb */
  $('#wf-pick').addEventListener('click', (e) => Kit.menu(e.currentTarget, { width: 260, items: [
    { group: 'Payments Ops', label: 'Refund triage', dot: 'ok', sub: 'live · v14', checked: true, onSelect: () => {} },
    { group: 'Payments Ops', label: 'Daily payouts', dot: 'ok', sub: 'cron 06:00', onSelect: () => Kit.toast({ title: 'Daily payouts', desc: 'This mockup shows Refund triage only.' }) },
    { group: 'Payments Ops', label: 'Chargeback sync', dot: 'idle', sub: 'draft', onSelect: () => Kit.toast({ title: 'Chargeback sync', desc: 'This mockup shows Refund triage only.' }) },
    { separator: true }, { label: 'New workflow', icon: 'plus', onSelect: () => {} } ] }));

  /* ── execution: pending → running → done, one packet per wire as data flows ── */
  let running = false;
  function setSt(id, st, ms) {
    const el = nodeEl[id]; if (!el) return; el.dataset.st = st;
    el.classList.toggle('st-running', st === 'running'); el.classList.toggle('st-skipped', st === 'skipped');
    el.querySelector('.wfn-st .dot').className = 'dot ' + ({ pending: 'wf-pend', running: 'm-live', done: 'ok flat', skipped: 'wf-idle', idle: 'wf-idle' }[st]);
    el.querySelector('.wfn-ms').textContent = st === 'done' ? (ms || '') : st === 'skipped' ? 'skipped' : '';
    if (id === selected && !el.classList.contains('drag')) renderInspector();
  }
  function wire(id, cls) { const p = wireEl[id], l = labelEl[id]; if (!p) return; p.classList.remove('hot', 'dim'); if (cls) p.classList.add(cls); if (l) { l.classList.remove('hot', 'dim'); if (cls) l.classList.add(cls); } }
  async function flow(id) { wire(id, 'hot'); LunaArt.pulse(wireEl[id], { duration: 520 }); await sleep(500); }
  async function step(id) { const n = byId(id); setSt(id, 'running'); await sleep(n.dur); setSt(id, 'done', n.ms); }
  async function run() {
    if (running) return; running = true; runNo += 1;
    const btn = $('#wf-test'); btn.classList.add('busy');
    const t = Kit.toast({ title: `Run #${runNo} · running`, desc: 'Refund triage · test event <span class="mono">ord_8812</span>', tone: 'busy' });
    NODES.forEach((n) => setSt(n.id, n.custom ? 'idle' : 'pending')); EDGES.forEach((e) => wire(e.id, null)); mini();
    await sleep(240);
    await step('hook'); await flow('e-hook-cls');
    await step('cls'); await flow('e-cls-route');
    await step('route');
    setSt('review', 'skipped'); wire('e-route-review', 'dim'); wire('e-review-log', 'dim'); mini();
    await flow('e-route-refund');
    await step('refund'); await flow('e-refund-log');
    await step('log');
    lastRun = { no: runNo, ago: 'just now', ts: new Date().toISOString() };
    if (selected) renderInspector();
    t.update({ title: `Run #${runNo} · 1.4 s · succeeded`, desc: '5 nodes ran · <span class="mono">else review</span> skipped', tone: 'ok', action: { label: 'View', onClick: () => select('log', 'output') } });
    btn.classList.remove('busy'); running = false;
  }
  $('#wf-test').addEventListener('click', run);

  /* publish: a small sheet */
  let ver = 14;
  $('#wf-pub').addEventListener('click', () => {
    const tested = lastRun.no > 4821;
    const sh = Kit.sheet({ title: `Publish Refund triage`, width: 420,
      body: `<p class="kit-lead">Publishes <b style="font-weight:550;color:var(--foreground)">v${ver + 1}</b> to live. <span class="mono" style="font-size:12px">POST /hooks/refund</span> switches over with no downtime; runs in flight finish on v${ver}.</p>
        <div class="well">
          <div class="kit-kv"><span class="kit-kv-k">Version</span><span class="kit-kv-v"><span class="mono">v${ver}</span>${I('arrow-right')}<span class="mono">v${ver + 1}</span></span></div>
          <div class="kit-kv"><span class="kit-kv-k">Changes</span><span class="kit-kv-v">Classify reason · prompt, temperature</span></div>
          <div class="kit-kv"><span class="kit-kv-k">Calls</span><span class="kit-kv-v">${M('POST')}<span class="mono">/refunds</span><span class="muted kit-end">refunds.py</span></span></div>
          <div class="kit-kv"><span class="kit-kv-k">Test run</span><span class="kit-kv-v">${tested ? `<span class="dot ok flat"></span>Run #${lastRun.no} succeeded<span class="muted kit-end">1.4 s</span>` : `<span class="dot warn"></span>Not tested since the last edit`}</span></div>
        </div>`,
      footer: `<span class="kit-grow"></span><button class="btn ghost sm" data-x>Cancel</button><button class="btn sm" data-go>${I('upload')} Publish v${ver + 1}</button>` });
    icons();
    sh.el.querySelector('[data-x]').addEventListener('click', () => sh.close());
    sh.el.querySelector('[data-go]').addEventListener('click', () => {
      sh.close(); ver += 1; $('#wf-ver').textContent = `Live · v${ver}`;
      Kit.toast({ title: `Published v${ver}`, desc: 'Refund triage is live on <span class="mono">POST /hooks/refund</span>', tone: 'ok' });
    });
  });

  /* keys: ⌘↵ test run · N add node · V/H tools · +/−/0 zoom · ⇧1 fit */
  addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); run(); return; }
    if (e.metaKey || e.ctrlKey || e.altKey || e.target.closest('input, textarea, [contenteditable="true"], .kit-sheet, .menu')) return;
    const k = e.key.toLowerCase();
    if (k === 'n') { e.preventDefault(); openAdd(); }
    else if (k === 'v') setTool('select'); else if (k === 'h') setTool('hand');
    else if (e.key === '=' || e.key === '+') zoomBy(1.1); else if (e.key === '-') zoomBy(1 / 1.1);
    else if (e.key === '0') zoomBy(1 / view.z); else if (e.key === '!' && e.shiftKey) fit();
  });

  /* ── boot ── */
  NODES.forEach(mountNode); icons();
  NODES.forEach((n) => setSt(n.id, n.id === 'review' ? 'skipped' : 'done', n.ms));
  EDGES.forEach((e) => wire(e.id, /review/.test(e.id) ? 'dim' : 'hot'));
  const boot = () => { wires(); EDGES.forEach((e) => wire(e.id, /review/.test(e.id) ? 'dim' : null)); fit(); select('cls', 'params'); };
  boot();
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { wires(); fit(); });
  addEventListener('resize', () => { wires(); mini(); });
  if (!/[?&]autorun=0/.test(location.search)) setTimeout(run, 1500);
  window.WF = { run, select, showTab, fit, zoomBy, addNode, openAdd, setTool, NODES, view, TYPES };
})();
</script></body></html>
