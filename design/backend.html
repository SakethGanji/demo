  ];
  const plain = (h) => { const t = document.createElement('div'); t.innerHTML = h; return t.textContent; };

  const flow = $('#ai-flow'), status = $('#ai-status'), timeEl = $('#ai-time'), log = $('#ai-log'), say = $('#ai-say'), diff = $('#ai-diff'), confirmBar = $('#ai-confirm'), scroller = $('#ai-scroll');
  const q = $('#ai-q'), go = $('#ai-go');
  $('#ai-lines').innerHTML = DIFF.map(([t, n, h]) => `<div class="ai-ln${t === '+' ? ' add' : t === '-' ? ' del' : ''}"><span class="ai-no">${n}</span><span class="ai-mk">${t === ' ' ? '' : t === '-' ? '−' : '+'}</span><span class="ai-cd">${h}</span></div>`).join('');

  let gen = 0, timers = [], agoTimer = 0, t0 = 0, clock = 0, undoHTML = null, wasDirty = false;
  const later = (fn, ms) => { const g = gen; timers.push(setTimeout(() => g === gen && fn(), ms)); };
  const setPhase = (p) => { flow.dataset.phase = p; };
  /* settle: once a state change's motion should be over by the wall clock, finish anything still running.
     A no-op when frames flow; when they don't (background tab, headless capture) nothing sits on its first frame. */
  const settle = (el, ms = 360) => setTimeout(() => el.getAnimations({ subtree: true }).forEach((a) => {
    const t = a.effect?.getTiming?.(); if (t && t.iterations !== Infinity && a.playState !== 'finished') a.finish();
  }), ms);
  const setStatus = (html, live) => {
    status.innerHTML = html; status.classList.toggle('ai-gen', !!live);
    status.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 140, easing: 'ease-out' }); settle(flow);
  };
  const show = (el) => { el.hidden = false; el.classList.remove('ai-show'); void el.offsetWidth; el.classList.add('ai-show'); settle(flow); };
  const busyBtn = (on) => { if (on) { go.style.width = go.offsetWidth + 'px'; go.classList.add('sending'); } else { go.classList.remove('sending'); go.style.width = ''; } };

  function stream(text, done) {
    const words = text.split(' '), chunks = [];
    for (let i = 0; i < words.length;) { const n = 1 + ((i * 7) % 3 === 0 ? 1 : 0); chunks.push(words.slice(i, i + n).join(' ')); i += n; }
    say.innerHTML = '';
    chunks.forEach((c, i) => later(() => {
      say.insertAdjacentHTML('beforeend', `<span class="ai-chunk">${(i ? ' ' : '') + esc(c).replace(/`([^`]+)`/g, '<code>$1</code>')}</span>`);
      settle(say); if (i === chunks.length - 1 && done) done();
    }, i * 55));
  }

  function run() {
    const prompt = q.value.trim(); if (!prompt) { q.focus(); return; }
    gen++; timers.forEach(clearTimeout); timers = []; clearInterval(agoTimer); clearInterval(clock);
    log.innerHTML = STEPS.map((s, i) => `<div class="ai-step" data-state="pending" role="listitem">
      <button class="ai-row" aria-expanded="false" disabled><span class="ai-st"><span class="ai-st-p"></span><span class="dot m-live"></span><i data-lucide="check"></i></span><i data-lucide="${s.icon}" class="ai-tool"></i><span class="ai-lbl"><span class="ai-l-run">${s.run}</span><span class="ai-l-done">${s.done}</span></span><span class="ai-meta" id="ai-m${i}"></span><i data-lucide="chevron-right" class="ai-chev"></i></button>
      <div class="ai-detail"><div><div class="ai-io"><div><div class="ai-io-h">Input</div><pre class="ai-json">${hj(s.io[0])}</pre></div><div><div class="ai-io-h">Output</div><pre class="ai-json">${hj(s.io[1])}</pre></div></div></div></div></div>`).join('');
    Shell.icons();
    say.innerHTML = ''; diff.hidden = true; confirmBar.hidden = true; scroller.scrollTop = 0;
    flow.classList.remove('folded'); flow.classList.add('open'); setPhase('run'); busyBtn(true);
    t0 = performance.now(); timeEl.textContent = '0.0s'; settle(flow);
    clock = setInterval(() => { timeEl.textContent = ((performance.now() - t0) / 1000).toFixed(1) + 's'; }, 100);
    const rows = [...log.children];
    let at = 0;
    STEPS.forEach((s, i) => {
      later(() => { rows[i].dataset.state = 'running'; setStatus(esc(s.status), true); }, at);
      at += s.ms;
      later(() => {
        rows[i].dataset.state = 'done'; rows[i].querySelector('.ai-row').disabled = false;
        $('#ai-m' + i).textContent = (s.ms / 1000).toFixed(1) + 's'; settle(flow);
      }, at);
    });
    const tWrite = STEPS[0].ms + STEPS[1].ms;
    later(() => stream(SAY), tWrite);                                   /* the explanation streams in while it writes */
    later(() => show(diff), tWrite + STEPS[2].ms);                      /* the diff lands when the write step is done */
    later(() => {                                                       /* self-test done: ready to confirm */
      clearInterval(clock); timeEl.textContent = (at / 1000).toFixed(1) + 's';
      setPhase('ready'); busyBtn(false); show(confirmBar);
      setStatus('<b>1 change ready</b> · review before applying', false);
    }, at);
  }

  function fold(html, phase) {
    gen++; timers.forEach(clearTimeout); timers = []; clearInterval(clock); busyBtn(false);
    setPhase(phase); flow.classList.add('folded'); timeEl.textContent = ''; setStatus(html, false); q.value = '';
  }
  const ago = (t) => { const s = Math.round((Date.now() - t) / 1000); return s < 2 ? 'now' : s < 60 ? s + 's ago' : Math.round(s / 60) + 'm ago'; };

  function applyChange() {
    if (flow.dataset.phase !== 'ready') return;
    const html = code.innerHTML, mark = 'body[<span class="s">"amount"</span>]})', at = html.indexOf(mark);
    if (at < 0) { toast({ title: 'Couldn’t apply the change', desc: 'createRefund changed since the AI read it. Refine again.', tone: 'err' }); return; }
    const a = html.lastIndexOf('\n', at) + 1, b = html.indexOf('\n', at), end = b < 0 ? html.length : b;
    undoHTML = html; wasDirty = chip.classList.contains('dirty');
    code.innerHTML = html.slice(0, a) + NEW.map((l) => `<span class="ai-ins">${l}</span>`).join('\n') + html.slice(end);
    markDirty(); settle(code, 1800);
    const when = Date.now(), iso = new Date(when).toISOString();
    fold(`<b>Applied</b> · validate amount &gt; 0 · <span id="ai-ago" data-ts="${iso}" data-tip="${exact()}">${ago(when)}</span>`, 'applied');
    agoTimer = setInterval(() => { const el = $('#ai-ago'); if (el) el.textContent = ago(when); else clearInterval(agoTimer); }, 1000);
    toast({ title: 'Change applied to refunds.py', desc: 'createRefund · +3 −1 · unsaved', tone: 'ok', action: { label: 'Undo', onClick: undo } });
  }
  function undo() {
    if (undoHTML == null) return;
    code.innerHTML = undoHTML; undoHTML = null; numberLines();
    if (!wasDirty) { chip.classList.remove('dirty'); saved.textContent = 'Saved now'; }
    clearInterval(agoTimer); setPhase('discarded'); setStatus('<b>Reverted</b> · validate amount &gt; 0', false);
  }
  function discard() { if (flow.dataset.phase === 'ready' || flow.dataset.phase === 'run') fold('<b>Discarded</b> · validate amount &gt; 0', 'discarded'); }

  go.addEventListener('click', run);
  q.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); run(); } });
  $('#ai-apply').addEventListener('click', applyChange);
  $('#ai-discard').addEventListener('click', discard);
  $('#ai-x').addEventListener('click', () => { if (flow.dataset.phase === 'run' || flow.dataset.phase === 'ready') discard(); flow.classList.remove('open'); clearInterval(agoTimer); });
  log.addEventListener('click', (e) => {
    const r = e.target.closest('.ai-row'); if (!r || r.disabled) return;
    const st = r.parentElement, o = st.classList.toggle('open'); r.setAttribute('aria-expanded', o); settle(st);
  });
  $('#ai-copy').addEventListener('click', (e) => {
    const t = DIFF.filter((d) => d[0] !== '-').map((d) => plain(d[2])).join('\n');
    try { navigator.clipboard.writeText(t).catch(() => {}); } catch (err) {}
    const sw = e.currentTarget.querySelector('.m-swap'); sw.classList.add('done'); setTimeout(() => sw.classList.remove('done'), 1200);
  });
  /* ⇧⌘↵ applies while a change is waiting; runs before the page's ⌘↵ = Send */
  addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.shiftKey && e.key === 'Enter' && flow.dataset.phase === 'ready') { e.preventDefault(); e.stopImmediatePropagation(); applyChange(); }
  }, true);
  setTimeout(() => { if (flow.dataset.phase === 'idle' && !q.value) { q.value = 'Validate amount is positive in createRefund'; run(); } }, 2000); /* demo: play once */

  /* ── route picker: a searchable Kit.menu grouped under the module ── */
  const pick = $('#rp-pick');
  function setRoute(r) {
    route = r;
    const mEl = $('#rp-pick-m'); mEl.className = 'method ' + r.m.toLowerCase(); mEl.textContent = r.m; $('#rp-pick-p').textContent = r.p;
    const tm = document.getElementById('rp-r-m'), tp = document.getElementById('rp-r-p'), tn = document.getElementById('rp-r-n');
    if (tm) { tm.textContent = r.m; tm.style.fill = `var(--method-${r.m.toLowerCase()})`; }
    if (tp) { tp.textContent = r.p; tp.setAttribute('x', r.m.length > 3 ? 40 : 35); }
    if (tn) tn.textContent = r.n;
    $('#rp')?.setAttribute('aria-label', `${r.m} ${r.p} runs in the sandbox.`);
  }
  function openPicker() {
    return window.Kit?.menu?.(pick, {           /* Kit owns aria-expanded, Esc, arrows and outside-click */
      search: true, placeholder: 'Search routes…', width: pick.offsetWidth,
      items: ROUTES.map((r) => ({ group: 'refunds.py', label: r.p, method: r.m, sub: r === route ? 'current' : r.n, checked: r === route, onSelect: () => setRoute(r) })),
    });
  }
  pick.addEventListener('click', openPicker);
  pick.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowDown') { e.preventDefault(); openPicker(); } });
  window.BackendDemo = { run, applyChange, discard, openPicker, setRoute };
})();
</script></body></html>
