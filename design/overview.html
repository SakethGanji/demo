 /* page scroller (not .pad: that name belongs to .well.pad). The page is a size container so the bento
    reflows on the main panel's width, not the viewport's. */
 .page{padding:28px var(--s8);overflow-y:auto;flex:1;container:bt-page / inline-size}

 /* ── the bento: one 12-column grid, 16px gaps, tiles of varied size ── */
 .bt-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:var(--s4);align-items:stretch}
 .bt-hero{grid-column:span 8}
 .bt-runs{grid-column:span 4}
 .bt-mini{grid-column:span 3}
 .bt-routes{grid-column:span 7}
 .bt-recent{grid-column:span 5}
 .bt-sec,.bt-rel,.bt-apps{grid-column:span 4}

 /* tile material: the panel recipe (gradient edge + soft shadow), never glass; 12px radius */
 .main .page .bt.panel{position:relative;display:flex;flex-direction:column;min-width:0;border-radius:var(--r-panel);
   border:1px solid transparent !important;
   background:linear-gradient(180deg,var(--mat-top),var(--mat-bottom)) padding-box,linear-gradient(180deg,var(--mat-edge-top),var(--mat-edge-bottom)) border-box !important;
   box-shadow:var(--mat-shadow) !important}
 .dark .bt.panel::after{content:'';position:absolute;left:12%;right:12%;top:0;height:1px;pointer-events:none;z-index:1;background:linear-gradient(90deg,transparent,var(--edge),transparent)}
 .bt .panel-head .btn svg{width:14px;height:14px}
 .bt>.well{flex:1}
 .bt-foot{display:flex;align-items:center;gap:var(--s2);padding:0 var(--s5) var(--s4);font-size:12px;color:var(--muted-foreground)}

 /* ── hero tile ── */
 .bt-hero{padding:var(--s5) 0 0}
 .bt-hero-top{display:flex;align-items:center;gap:var(--s3);padding:0 var(--s5)}
 .bt-hero-top h1{font-size:26px;font-weight:650;margin:0;line-height:1.1}
 .bt-hero-top .p-avatar{width:32px;height:32px;border-radius:9px;font-size:14px}
 .bt-hero-actions{display:flex;gap:var(--s2);margin-left:auto}
 .hero-meta{display:flex;align-items:center;gap:var(--s3);color:var(--muted-foreground);font-size:12.5px;flex-wrap:wrap;min-width:0}
 /* snippet: a small segmented control picks the form; the value is recessed, the copy button raised inside it.
    All three panes share one grid cell, so switching tabs never changes the tile's height.
    Not .url: kit.js/motion.js wire .url to "Copied URL"; this snippet owns its own copy + toast. */
 .ov-snip{margin:var(--s4) var(--s5) 0}
 .ov-snip-head{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);margin-bottom:6px}
 .ov-snip .seg{flex-shrink:0}
 .ov-snip .seg>button{height:20px;padding:0 9px;font-size:11.5px;font-weight:500}
 .ov-snip-val{position:relative;display:grid;align-items:center;min-height:42px;padding:4px 42px 4px var(--s3);border-radius:var(--r-ctl);background:var(--recess-fill);box-shadow:var(--inset-sm)}
 .ov-snip-val pre{grid-area:1/1;margin:0;font:12px/17px var(--font-mono);white-space:pre;overflow:hidden;text-overflow:ellipsis;color:var(--foreground);visibility:hidden;background:none;border:0;padding:0}
 .ov-snip-val pre.on{visibility:visible}
 .ov-snip-val .ov-dim{color:var(--muted-foreground)}
 .ov-snip-copy{position:absolute;right:7px;top:50%;margin-top:-14px;width:28px;height:28px;display:grid;place-items:center;padding:0;border:0;border-radius:calc(var(--r-ctl) - 2px);
   background:var(--raise-fill);box-shadow:var(--raise-sm);color:var(--muted-foreground);cursor:pointer;transition:color var(--d-fast),transform var(--d-instant),box-shadow var(--d-instant)}
 .ov-snip-copy:hover{color:var(--foreground)}
 .ov-snip-copy:active{transform:scale(.98);box-shadow:var(--raise-press)}
 .ov-snip-copy:focus-visible{outline:0;box-shadow:0 0 0 1px var(--ring),var(--focus-ring)}
 /* the system diagram: large, in its own well, on the hero's hairline grid (the page's one hero vector) */
 .bt-sys.well{margin-top:var(--s4);display:grid;place-items:center;padding:var(--s4) var(--s5) var(--s3);min-height:0}
 .bt-sys .vx-grid{-webkit-mask:radial-gradient(60% 80% at 55% 45%,#000 15%,transparent 80%);mask:radial-gradient(60% 80% at 55% 45%,#000 15%,transparent 80%)}
 .dark .bt-sys .vx-grid{-webkit-mask:radial-gradient(60% 80% at 55% 45%,#000 0%,rgb(0 0 0 / .5) 45%,transparent 80%);mask:radial-gradient(60% 80% at 55% 45%,#000 0%,rgb(0 0 0 / .5) 45%,transparent 80%)}
 .bt-sys-art{width:100%;max-width:640px}

 /* ── Runs tile: the focal stat (the only .vx-edge) ── */
 .main .page .bt-runs.panel{background:linear-gradient(180deg,var(--brand-soft),transparent 46%) padding-box,linear-gradient(180deg,var(--mat-top),var(--mat-bottom)) padding-box,linear-gradient(180deg,var(--mat-edge-top),var(--mat-edge-bottom)) border-box !important}
 .bt-runs.vx-edge::before{inset:-1px}
 .bt-runs .stat{padding:0 var(--s5);border:0 !important;background:none !important;font-variant-numeric:tabular-nums}
 .bt-runs .stat .label{display:flex;align-items:center;gap:6px}
 .bt-runs .stat .value{font-size:48px;font-weight:600;letter-spacing:-.04em;line-height:1.2;margin-top:2px;flex-wrap:wrap;gap:0}
 .bt-runs .m-spark{display:block;flex-basis:100%;width:100%;height:44px;margin:var(--s2) 0 0}
 .bt-axis{display:flex;justify-content:space-between;margin-top:6px;font-size:11px;color:var(--muted-foreground);font-variant-numeric:tabular-nums}
 .bt-cal-well.well{margin-top:var(--s4);padding:var(--s3) var(--s4);display:flex;flex-direction:column;gap:var(--s2)}
 .bt-cal-head{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted-foreground)}
 .bt-cal-head b{font-weight:500;color:var(--foreground)}
 .bt-legend{display:inline-flex;align-items:center;gap:3px;font-size:11px}
 .bt-legend>i:first-child{margin-left:3px}
 .bt-legend>i.l4{margin-right:3px}
 .bt-legend i{width:9px;height:9px;border-radius:2px}
 .bt-legend .bt-gap{width:6px}
 .bt-legend .bt-fd{width:5px;height:5px;border-radius:50%;background:var(--destructive);margin-right:2px}
 .bt-cal-wrap{--bt-cell:26px;display:grid;grid-template-columns:auto auto;justify-content:center;gap:5px 14px;align-items:center}
 .bt-cal-dow{display:grid;grid-template-columns:repeat(7,var(--bt-cell));gap:5px;font-size:10.5px;color:var(--faint);text-align:center;grid-column:2}
 .bt-cal-wk{display:grid;grid-auto-rows:var(--bt-cell);gap:5px;font-size:10.5px;color:var(--muted-foreground);align-items:center;font-variant-numeric:tabular-nums}
 .ov-cal{display:grid;grid-template-columns:repeat(7,var(--bt-cell));grid-auto-rows:var(--bt-cell);gap:5px}
 .ov-cal i,.bt-legend i{position:relative;border-radius:4px;background:var(--recess-fill);box-shadow:inset 0 0 0 1px var(--edge-ring);transition:background-color var(--d-slow) var(--ease-out)}
 .ov-cal i:empty:not([data-tip]){background:none;box-shadow:none}
 .ov-cal i[data-tip]{cursor:default}
 .ov-cal i.l1,.bt-legend .l1{background:color-mix(in srgb,var(--primary) 16%,transparent);box-shadow:none}
 .ov-cal i.l2,.bt-legend .l2{background:color-mix(in srgb,var(--primary) 32%,transparent);box-shadow:none}
 .ov-cal i.l3,.bt-legend .l3{background:color-mix(in srgb,var(--primary) 54%,transparent);box-shadow:none}
 .ov-cal i.l4,.bt-legend .l4{background:color-mix(in srgb,var(--primary) 82%,transparent);box-shadow:none}
 .ov-cal i.ov-fail::after{content:'';position:absolute;top:3px;right:3px;width:5px;height:5px;border-radius:50%;background:var(--destructive);box-shadow:0 0 0 1.5px var(--well)}
 .ov-cal i.ov-today{outline:1px solid color-mix(in srgb,var(--foreground) 40%,transparent);outline-offset:1px}

 /* ── small stat tiles ── */
 .bt-mini .panel-head{height:44px}
 .bt-mini .panel-head h3{font-weight:500;color:var(--muted-foreground)}
 .bt-num{display:flex;align-items:baseline;gap:6px;padding:0 var(--s5) var(--s4);font-size:28px;font-weight:600;letter-spacing:-.03em;line-height:1.15;font-variant-numeric:tabular-nums;font-optical-sizing:auto}
 .bt-num small{font-size:12.5px;font-weight:400;letter-spacing:0;color:var(--muted-foreground)}
 .bt-mini .bt-go{width:24px;height:24px;display:grid;place-items:center;border-radius:calc(var(--r-ctl) - 2px);color:var(--muted-foreground);transition:color var(--d-fast),background-color var(--d-fast)}
 .bt-mini .bt-go:hover{color:var(--foreground);background:var(--hairline)}
 .bt-mini .bt-go svg{width:14px;height:14px}
 .bt-failed .panel-head>svg{color:var(--destructive) !important;background:color-mix(in srgb,var(--destructive) 10%,transparent) !important}

 /* ── tables + lists in wells: rows get the same quiet hover ── */
 .well>.table th{height:34px}
 .bt-routes .table th,.bt-routes .table td{white-space:nowrap}
 .well>.table th:first-child,.well>.table td:first-child{padding-left:var(--s4)}
 .well>.table td.num,.well>.table th.num{font-variant-numeric:tabular-nums}
 .well>.table tbody tr:not(.group-row):hover td{background:var(--hairline)}
 .well>.table .group-row td{height:30px;font:12px var(--font-mono);color:var(--muted-foreground)}
 .runs .li{display:flex;align-items:center;gap:10px;height:34px;padding:0 var(--s3);border-bottom:1px solid var(--hairline);font-size:12.5px;font-variant-numeric:tabular-nums;transition:background-color var(--d-fast)}
 .runs .li:hover{background:var(--hairline)}
 .runs .li .method{background:none !important;min-width:38px;justify-content:flex-start;padding:0}
 .runs .li .r{margin-left:auto;color:var(--muted-foreground);white-space:nowrap}
 .runs .li .mono{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

 /* ── secrets ── */
 .bt-sec-well.well{display:flex;flex-direction:column}
 .bt-sec-name{display:flex;align-items:center;gap:var(--s2);padding:10px var(--s3) 8px;font-size:12px}
 .bt-sec-name>svg{width:14px;height:14px;color:var(--muted-foreground)}
 .bt-env{display:flex;align-items:center;gap:var(--s2);height:34px;padding:0 var(--s3);border-top:1px solid var(--hairline);font-size:12.5px}
 .bt-env .mono{width:40px;color:var(--muted-foreground)}
 .bt-env .badge{margin-left:auto}
 .badge[data-tip]{cursor:help}

 /* ── releases ── */
 .rel-art.well{display:grid;align-content:center;padding:var(--s3) var(--s4) var(--s1)}

 /* ── apps ── */
 .app-row.well{display:flex;align-items:center;gap:var(--s4);padding:var(--s3)}
 .app-row .art-thumb{width:104px;border-radius:7px;transition:transform var(--d-fast) var(--ease-out)}
 .app-row:hover .art-thumb{transform:translateY(-1px)}
 .app-title{font-weight:500;font-size:13px}
 .app-badges{display:flex;gap:6px;margin-top:6px}
 .app-sub{font-size:12px;margin-top:6px}

 /* ── narrow main panel (≈1100px viewport): a simpler 6-column bento ── */
 @container bt-page (max-width: 980px) {
   .bt-grid{grid-template-columns:repeat(6,minmax(0,1fr))}
   .bt-hero,.bt-runs,.bt-routes,.bt-recent,.bt-apps{grid-column:span 6}
   .bt-mini,.bt-sec,.bt-rel{grid-column:span 3}
   /* Runs goes landscape: number + sparkline on the left, the 30 days on the right */
   .bt-runs{display:grid !important;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto 1fr;column-gap:var(--s2)}
   .bt-runs>.panel-head{grid-column:1/-1}
   .bt-runs>.bt-cal-well.well{margin:0 var(--s2) var(--s2) 0}
   .bt-runs>.stat{padding-bottom:var(--s4)}
 }
 @container bt-page (max-width: 1060px) { .bt-routes .bt-auth{display:none} }

  const sys = document.querySelector('.bt-sys .art');
  const node = sys && [...sys.querySelectorAll(':scope > g')].find((g) => /3 rows/.test(g.textContent));
  if (node) node.classList.add('a-glow');

  /* snippet: tabs switch the pane in place; copy swaps the icon to a check for 2 s and toasts once */
  const snip = document.querySelector('.ov-snip');
  if (snip) {
    const panes = [...snip.querySelectorAll('pre')], tabs = [...snip.querySelectorAll('.seg > button')], copy = snip.querySelector('.ov-snip-copy');
    snip.querySelector('.seg').addEventListener('click', (e) => {
      const b = e.target.closest('button'); if (!b) return;
      tabs.forEach((t) => t.setAttribute('aria-selected', t === b));
      panes.forEach((p, i) => p.classList.toggle('on', i === +b.dataset.pane));
    });
    let t;
    copy.addEventListener('click', () => {
      const p = snip.querySelector('pre.on');
      try { navigator.clipboard.writeText(p.textContent).catch(() => {}); } catch (e) {}
      const sw = copy.querySelector('.m-swap'); sw.classList.add('done'); clearTimeout(t); t = setTimeout(() => sw.classList.remove('done'), 2000);
      if (window.Kit) Kit.toast({ tone: 'ok', title: 'Copied', desc: p.dataset.what });
    });
  }

  /* 30-day activity: Sep 16 → today (Thu Oct 15), weeks as rows Mon→Sun */
  const cal = document.querySelector('.ov-cal');
  const RUNS = [118, 131, 104, 46, 38, 122, 139, 147, 156, 112, 52, 41, 96, 133, 141, 128, 109, 57, 33, 127, 151, 144, 136, 101, 63, 44, 119, 137, 142, 128];
  const FAILS = { 8: 2, 20: 1, 29: 1 };                 /* Sep 24, Oct 6, today (POST /refunds 422) */
  const step = (n) => (n >= 129 ? 4 : n >= 110 ? 3 : n >= 70 ? 2 : n > 0 ? 1 : 0);
  const DAY0 = Date.UTC(2026, 8, 16), dayMs = 864e5, lead = 2; /* Sep 16 is a Wednesday: 2 blank slots before it */
  const label = (i, n) => new Date(DAY0 + i * dayMs).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', timeZone: 'UTC' }) + ` · ${n} runs · ${FAILS[i] || 0} failed`;
  const paint = (el, i, n) => { el.className = 'l' + step(n) + (FAILS[i] ? ' ov-fail' : '') + (i === RUNS.length - 1 ? ' ov-today' : ''); el.dataset.tip = label(i, n); };
  let todayEl = null;
  if (cal) {
    for (let s = 0; s < 35; s++) {
      const el = document.createElement('i'), i = s - lead;
      if (i >= 0 && i < RUNS.length) { paint(el, i, RUNS[i]); if (i === RUNS.length - 1) todayEl = el; }
      cal.appendChild(el);
    }
    /* the live run (motion.js) rolls #m-runs 128 → 129; read the rolled digits and add the difference to today */
    const runsCell = document.querySelector('.bt-runs .stat'), base = 128, today = RUNS.length - 1;
    const read = () => {
      const r = document.getElementById('m-runs'); if (!r || !r.children.length) return null;
      const ds = [...r.children].map((d) => { const m = /translateY\(-?([\d.]+)em\)/.exec(d.style.transform); return m ? Math.round(+m[1] / 1.2) : NaN; });
      return ds.some(isNaN) ? null : +ds.join('');
    };
    if (runsCell && todayEl) new MutationObserver(() => {
      const v = read(); if (v == null || v <= base) return;
      const n = RUNS[today] + (v - base); if (todayEl.dataset.n == n) return;
      todayEl.dataset.n = n; paint(todayEl, today, n);
    }).observe(runsCell, { subtree: true, childList: true, attributes: true, attributeFilter: ['style'] });
  }

  /* a secret was added (the Release sheet's fix): prod stops flagging it here too */
  document.addEventListener('cs:secret-added', (e) => {
    if (!e.detail || e.detail.name !== 'PAYMENTS_TOKEN') return;
    const b = document.querySelector('#bt-prod .badge'); if (!b || b.classList.contains('success')) return;
    b.className = 'badge success'; b.removeAttribute('data-tip'); b.innerHTML = '<span class="dot ok flat"></span>set';
  });

  /* the live run (motion.js) lands after the panel head; keep it inside the runs well, and give its "now" an exact time */
  const tip = (iso) => new Date(iso).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false, timeZone: 'UTC' }) + ' UTC';
  const NOW = '2026-10-15T09:25:31Z';
  const stamp = (txt) => { const s = document.createElement('span'); s.dataset.ts = NOW; s.dataset.tip = tip(NOW); s.textContent = txt; return s; };
  const fixNow = (el) => { [...el.childNodes].forEach((t) => { if (t.nodeType === 3 && /now\s*$/.test(t.data)) { t.data = t.data.replace(/now\s*$/, ''); el.appendChild(stamp('now')); } }); };
  const well = document.querySelector('.well.runs'), table = document.querySelector('.well > .table tbody');
  if (!well) return;
  new MutationObserver(() => {
    const run = document.getElementById('m-run');
    if (run && run.parentNode !== well) { well.prepend(run); fixNow(run.querySelector('.r')); }
  }).observe(well.parentNode, { childList: true });
  if (table) new MutationObserver((ms) => ms.forEach((m) => { const td = m.target.closest && m.target.closest('td'); if (td && !td.querySelector('[data-ts]')) fixNow(td); }))
    .observe(table, { childList: true, subtree: true });
})();
</script></body></html>
