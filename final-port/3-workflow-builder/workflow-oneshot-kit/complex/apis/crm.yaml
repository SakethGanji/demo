openapi: 3.0.3
info:
  title: crm
  version: '1.0'
servers:
- url: http://crm.bank.test
paths:
  /customers/{customer_id}/address:
    put:
      operationId: updateAddress
      summary: Change a customer's address
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  customer_id:
                    type: string
                required:
                - customer_id
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                address:
                  type: string
              required:
              - address
