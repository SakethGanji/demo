openapi: 3.0.3
info:
  title: bizbureau
  version: '1.0'
servers:
- url: http://bizbureau.bank.test
paths:
  /company-ratings:
    post:
      operationId: companyRating
      summary: Credit rating of a company (A best to D worst)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  registration_number:
                    type: string
                  rating:
                    type: string
                    enum:
                    - A
                    - B
                    - C
                    - D
                required:
                - registration_number
                - rating
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                registration_number:
                  type: string
              required:
              - registration_number
