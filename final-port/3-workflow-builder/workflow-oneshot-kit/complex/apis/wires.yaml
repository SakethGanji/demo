openapi: 3.0.3
info:
  title: wires
  version: '1.0'
servers:
- url: http://wires.bank.test
paths:
  /wires/{wire_id}/status:
    get:
      operationId: wireStatus
      summary: Where a sent wire is
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  wire_id:
                    type: string
                  status:
                    type: string
                    enum:
                    - pending
                    - settled
                    - failed
                required:
                - wire_id
                - status
      parameters:
      - name: wire_id
        in: path
        required: true
        schema:
          type: string
