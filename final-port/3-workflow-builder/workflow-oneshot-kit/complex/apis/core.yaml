openapi: 3.0.3
info:
  title: core
  version: '1.0'
servers:
- url: http://core.bank.test
paths:
  /accounts/{account_id}/debit:
    post:
      operationId: debit
      summary: Debit an account (cash withdrawal)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  txn_id:
                    type: string
                required:
                - txn_id
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: number
              required:
              - amount
