openapi: 3.0.3
info:
  title: cards
  version: '1.0'
servers:
- url: http://cards.bank.test
paths:
  /cards/{customer_id}/atm-limit:
    post:
      operationId: setLimit
      summary: Set a customer's ATM limit for today
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  limit:
                    type: number
                required:
                - limit
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                limit:
                  type: number
              required:
              - limit
