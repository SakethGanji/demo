openapi: 3.0.3
info:
  title: dms
  version: '1.0'
servers:
- url: http://dms.bank.test
paths:
  /customers/{customer_id}/documents:
    get:
      operationId: documents
      summary: Whether a customer has uploaded the requested KYC documents
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  customer_id:
                    type: string
                  uploaded:
                    type: boolean
                required:
                - customer_id
                - uploaded
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          type: string
