openapi: 3.0.3
info:
  title: esign
  version: '1.0'
servers:
- url: http://esign.bank.test
paths:
  /envelopes:
    post:
      operationId: createEnvelope
      summary: Send a document for e-signature
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  envelope_id:
                    type: string
                required:
                - envelope_id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                signer_email:
                  type: string
                document:
                  type: string
                reference:
                  type: string
              required:
              - signer_email
              - document
              - reference
  /envelopes/{envelope_id}:
    get:
      operationId: getEnvelope
      summary: Signature status of an envelope
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  envelope_id:
                    type: string
                  status:
                    type: string
                    enum:
                    - sent
                    - signed
                    - declined
                required:
                - envelope_id
                - status
      parameters:
      - name: envelope_id
        in: path
        required: true
        schema:
          type: string
  /envelopes/{envelope_id}/cancel:
    post:
      operationId: cancelEnvelope
      summary: Withdraw an envelope
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  envelope_id:
                    type: string
                  status:
                    type: string
                required:
                - envelope_id
                - status
      parameters:
      - name: envelope_id
        in: path
        required: true
        schema:
          type: string
