openapi: 3.0.3
info:
  title: iam
  version: '1.0'
servers:
- url: http://iam.bank.test
paths:
  /users/{user_id}/revoke-access:
    post:
      operationId: revoke
      summary: Remove a user's access
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    type: string
                required:
                - user_id
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
              required:
              - reason
