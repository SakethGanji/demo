openapi: 3.0.3
info:
  title: mortgages
  version: '1.0'
servers:
- url: http://mortgages.bank.test
paths:
  /mortgages:
    post:
      operationId: book
      summary: Book a mortgage
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  mortgage_id:
                    type: string
                required:
                - mortgage_id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                application_id:
                  type: string
                amount:
                  type: number
              required:
              - application_id
              - amount
